# The .gitleaks.toml of this fixture (SECURITY.md). Cargo.lock here pins
# smallvec 1.6.0 ON PURPOSE: it is the bait for the cargo-deny advisories gate,
# asserted by id in ci.yml, and target-gated so no CI run ever builds it. This
# file keeps the repo's own OSV self-scan honest about everywhere else —
# osv-scanner loads it automatically for lockfiles in this directory, and the
# scoped ignore never leaves the fixture.
#
# If this entry ever suppresses anything beyond the planted advisory, that is
# a real finding being hidden — the reason field is the contract.

[[IgnoredVulns]]
id = "RUSTSEC-2021-0003"
reason = "planted bait for the cargo-deny advisories gate; never compiled (cfg(windows) gate)"

# The same advisory under its aliases, in case the scanner reports those ids
# instead of the RustSec one.
[[IgnoredVulns]]
id = "GHSA-43w2-9j62-hq99"
reason = "alias of RUSTSEC-2021-0003"

[[IgnoredVulns]]
id = "CVE-2021-25900"
reason = "alias of RUSTSEC-2021-0003"
