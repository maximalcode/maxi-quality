# maxi-quality — Python type baseline (mypy strict).
#
# USAGE — mypy has NO `extend`/`include` mechanism, unlike ruff. There is no way
# to inherit this file. A consuming project must either:
#
#   1. Point at it explicitly, which is what CI should do:
#        mypy --config-file path/to/maxi-quality/configs/python/mypy.ini src/
#
#   2. Or COPY it in (what scripts/adopt.sh does) and add project-specific
#      [mypy-*] override sections underneath.
#
# Option 2 means a copied file can drift from this one. That is a known cost,
# and it is the same trap that bit samples/dotnet/.editorconfig — which is why
# adopt.sh writes this file verbatim and CI diffs it. Do not hand-edit a copy.
#
# WHY strict = True RATHER THAN A HAND-PICKED SET:
#
# `strict` is a moving alias: when mypy adds a check, strict picks it up on the
# next upgrade. That is normally an argument AGAINST it under
# TreatWarningsAsErrors-style gating. It is fine here for the same reason the
# analyzer pins are fine — samples/ asserts exact counts, so a mypy upgrade that
# starts flagging something new turns CI red in a PR where a human looks at it,
# rather than landing quietly.
#
# The flags below strict are not redundant decoration. `strict` does NOT imply
# warn_unreachable or explicit_package_bases, and both earn their place: the
# first catches conditions that can never fire, the second is what makes mypy
# work at all in a src-layout monorepo.

[mypy]
python_version = 3.12
strict = True

# --- Not implied by strict --------------------------------------------------
# Code after an exhaustive return, or a comparison the types make impossible.
# This is the check that finds a narrowed-to-Never branch someone still guards.
warn_unreachable = True
# Without these two, a monorepo with src/ layouts gets "duplicate module named
# 'models'" the moment two packages both have one.
explicit_package_bases = True
namespace_packages = True

# --- Implied by strict, stated anyway ---------------------------------------
# Spelled out because `strict` is an alias whose contents change between
# releases. If a future mypy drops one of these from strict, this file keeps it
# rather than silently loosening.
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
check_untyped_defs = True
no_implicit_optional = True

# Never type-check what you did not write.
exclude = (?x)(
    ^\.venv/
    | /\.venv/
    | ^build/
    | ^dist/
    | \.eggs/
    | node_modules/
  )

# --- Third-party stubs ------------------------------------------------------
# A library with no type information is not a reason to fail the build; it is a
# reason to stop pretending mypy knows anything about it. Projects add their own
# untyped dependencies here after copying this file.
#
# Note this is per-project by nature — there is no useful baseline list, because
# the set of untyped libraries is entirely a function of what you import.
