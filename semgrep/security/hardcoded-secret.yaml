# One convention, two rule ids — C# typed declarations (`string apiKey = "..."`)
# do not parse as TypeScript, and vice versa.
#
# Division of labour: Gitleaks catches secrets whose *shape* is a known token
# (AWS keys, GitHub PATs, JWTs). These rules catch the homegrown ones it cannot
# fingerprint, by looking at the variable NAME instead.
#
# NAME ALONE HAS NO PRECISION. The 2026-07-31 Phase A scan of Consumer A scored
# this rule 0 true positives out of 5 (issue #17): two URL constants with
# `Token` in the name, one `'none'` sentinel, and two e2e fixtures. All three
# shapes are baited as negative controls in `samples/semgrep/` — see the
# `tokenEndpoint` and `UNASSIGNED_TOKEN` pair in each bad sample — so a
# regression here fails CI. Names like *Token*/*Key*/*Secret* are pervasive on constants that
# hold endpoints, sentinels and config keys, so the name test is now paired with
# a VALUE test:
#
#   1. a bare URL is an endpoint, not a credential — but a URL with embedded
#      userinfo (`scheme://user:pass@host`) still fires, which is the case that
#      actually leaks;
#   2. a value under 12 characters is a sentinel or an enum, not a key — the
#      shortest thing worth protecting is longer than that;
#   3. e2e fixtures are excluded by path, because their credentials are local
#      and disposable by construction.
#
# A suppression is how a real leak gets committed, so keep every exclusion
# narrow and justified by an observed false positive — never speculative.
rules:
  - id: hardcoded-secret-ts
    message: >-
      Secret-looking name assigned a literal. Read it from configuration or a
      secret store, never from source.
    severity: ERROR
    languages: [typescript]
    paths:
      exclude:
        - "*.test.ts"
        - "*.spec.ts"
        # Phase A #17: e2e fixtures carry local, disposable credentials.
        - "**/e2e/**"
        - "**/fixtures/**"
    patterns:
      - pattern-either:
          - pattern: const $NAME = "..."
          - pattern: let $NAME = "..."
          - pattern: var $NAME = "..."
          # Member assignment, not a bare `$NAME = "..."` — a bare assignment
          # pattern also matches the declarator inside `const x = "..."`, which
          # produced two findings on one line.
          - pattern: $OBJ.$NAME = "..."
          - pattern: '$NAME: "..."'
      - metavariable-regex:
          metavariable: $NAME
          regex: '(?i).*(password|passwd|secret|apikey|api_key|token|privatekey|private_key|connectionstring|connstr).*'
      - pattern-not-regex: '=\s*""'
      # Obvious placeholders are not secrets.
      - pattern-not-regex: '(?i)(changeme|placeholder|example|redacted|dummy|<[^>]*>|\{\{[^}]*\}\}|\$\{)'
      # An endpoint is not a credential. `[^@]` keeps userinfo URLs
      # (postgres://user:pass@host) firing — those are the ones that leak.
      - pattern-not-regex: '[:=]\s*[''"][a-zA-Z][a-zA-Z0-9+.-]*://[^@''"]*[''"]'
      # Under 12 chars is a sentinel or an enum, not a key.
      - pattern-not-regex: '[:=]\s*[''"][^''"]{0,11}[''"]'

  - id: hardcoded-secret-dotnet
    message: >-
      Secret-looking name assigned a literal. Read it from configuration
      (IConfiguration / user-secrets / a vault), never from source.
    severity: ERROR
    languages: [csharp]
    paths:
      exclude:
        - "*Tests*"
        # Phase A #17: e2e fixtures carry local, disposable credentials.
        - "**/e2e/**"
        - "**/fixtures/**"
    patterns:
      - pattern-either:
          - pattern: $TYPE $NAME = "...";
          - pattern: const $TYPE $NAME = "...";
          - pattern: $NAME = "...";
      - metavariable-regex:
          metavariable: $NAME
          regex: '(?i).*(password|passwd|secret|apikey|api_?key|token|privatekey|private_?key|connectionstring|connstr).*'
      - pattern-not-regex: '=\s*""'
      - pattern-not-regex: '(?i)(changeme|placeholder|example|redacted|dummy|<[^>]*>|\{\{[^}]*\}\})'
      # See the TS rule above for the reasoning on these two.
      - pattern-not-regex: '=\s*"[a-zA-Z][a-zA-Z0-9+.-]*://[^@"]*"'
      - pattern-not-regex: '=\s*"[^"]{0,11}"'

  # Python, added for issue #21. Ruff already covers most of this convention —
  # S105/S106/S107 flag a secret-shaped NAME assigned a literal, which is the
  # same idea — with one measured hole that is exactly the one this rule's value
  # guard was built to close:
  #
  #     CONNECTION_STRING = "postgres://admin:hunter2@db.internal:5432/app"
  #
  # Ruff is silent on that (measured 2026-08-02, ruff 0.16.1), because S105's
  # name list is password/pass/passwd/pwd/secret/token and does not reach
  # `connection_string`. A userinfo URL in a Python service was therefore
  # invisible to every layer this baseline runs. It is not invisible to the TS
  # and C# twins, and that asymmetry is the bug.
  #
  # THE NAME REGEX IS NOT A COPY of the two above, and that is deliberate:
  # `connectionString` matches `connectionstring`, `connection_string` does not.
  # Python is snake_case, so every multi-word name here takes an optional
  # underscore. Copying the TS regex verbatim would have shipped a rule that
  # looked identical and matched nothing on the one shape it exists for.
  - id: hardcoded-secret-python
    message: >-
      Secret-looking name assigned a literal. Read it from configuration or a
      secret store, never from source.
    severity: ERROR
    languages: [python]
    paths:
      exclude:
        - "*_test.py"
        - "test_*.py"
        - "**/tests/**"
        - "**/conftest.py"
        # Phase A #17: e2e fixtures carry local, disposable credentials.
        - "**/e2e/**"
        - "**/fixtures/**"
    patterns:
      - pattern-either:
          - pattern: $NAME = "..."
          - pattern: '$NAME: $TYPE = "..."'
          - pattern: $OBJ.$NAME = "..."
      - metavariable-regex:
          metavariable: $NAME
          regex: '(?i).*(password|passwd|secret|api_?key|token|private_?key|connection_?string|connstr).*'
      # These three guards are regexes over RAW SOURCE TEXT, so unlike the
      # semgrep string pattern above they do NOT treat '...' and "..." alike.
      # Python has no prevailing quote style — ruff format picks double, most
      # existing code does not — so every one of them takes both.
      - pattern-not-regex: '=\s*[''"]{2}'
      - pattern-not-regex: '(?i)(changeme|placeholder|example|redacted|dummy|<[^>]*>|\{\{[^}]*\}\})'
      # An endpoint is not a credential. `[^@]` keeps userinfo URLs
      # (postgres://user:pass@host) firing — those are the ones that leak.
      - pattern-not-regex: '=\s*[''"][a-zA-Z][a-zA-Z0-9+.-]*://[^@''"]*[''"]'
      # Under 12 chars is a sentinel or an enum, not a key.
      - pattern-not-regex: '=\s*[''"][^''"]{0,11}[''"]'
      # A FOURTH GUARD THE TS AND C# TWINS DO NOT HAVE, and it is here because
      # it was measured rather than imagined. Run over 4,133 files of Django,
      # Celery, SQLAlchemy, Flask and httpx, the three guards above left twelve
      # findings, and the largest single class was PROSE in a secret-named
      # constant — `REASON_CSRF_TOKEN_MISSING = "CSRF token missing."`,
      # `SECRET_KEY_WARNING_MSG = (...)`, an `ALTER USER ... IDENTIFIED BY`
      # template. A credential does not contain a space.
      #
      # Narrow on purpose: it keys on whitespace, not on `*_MSG` names. The one
      # real shape it would lose is an ADO.NET-style
      # `Server=x;User Id=y;Password=z`, which is not a Python idiom — Python
      # connection strings are URLs, and those are covered by the guard above
      # keeping userinfo firing.
      - pattern-not-regex: '=\s*[''"][^''"]*\s'

  # Java, added for issue #10. Same value tests as the other three — a bare URL
  # is an endpoint, a userinfo URL is a leak, under 12 characters is a sentinel
  # — because all three of those were real false positives measured on
  # Consumer A (#17) and none of them is language-specific.
  #
  # SCREAMING_CASE is in the name regex because that is how Java spells a
  # constant, and `private static final String API_TOKEN` is the exact shape
  # this rule exists for.
  - id: hardcoded-secret-java
    message: >-
      Secret-looking name assigned a literal. Read it from configuration or a
      secret store (@Value, Environment, a secrets manager), never from source.
    severity: ERROR
    languages: [java]
    paths:
      exclude:
        - "*Test.java"
        - "*Tests.java"
        - "*IT.java"
        - "**/test/**"
        - "**/e2e/**"
        - "**/fixtures/**"
    patterns:
      - pattern-either:
          - pattern: String $NAME = "...";
          - pattern: $OBJ.$NAME = "...";
      # THE SEPARATORS ARE NOT DECORATION. The other three languages spell
      # these names in camelCase, so `connectionstring` matches. Java spells a
      # constant SCREAMING_SNAKE, so the same regex copied across silently
      # misses CONNECTION_STRING and PRIVATE_KEY — measured 2026-08-09 on this
      # rule's own fixture, where the userinfo-URL bait (the one case that
      # actually leaks) came back clean while API_TOKEN fired beside it. The
      # port would have shipped looking like it worked.
      - metavariable-regex:
          metavariable: $NAME
          regex: '(?i).*(password|passwd|secret|api[_-]?key|token|private[_-]?key|connection[_-]?string|conn[_-]?str).*'
      - pattern-not-regex: '=\s*""'
      - pattern-not-regex: '(?i)(changeme|placeholder|example|redacted|dummy|<[^>]*>|\$\{)'
      # An endpoint is not a credential. `[^@]` keeps userinfo URLs
      # (postgres://user:pass@host) firing — those are the ones that leak.
      - pattern-not-regex: '[:=]\s*"[a-zA-Z][a-zA-Z0-9+.-]*://[^@"]*"'
      # Under 12 chars is a sentinel or an enum, not a key.
      - pattern-not-regex: '=\s*"[^"]{0,11}"'
