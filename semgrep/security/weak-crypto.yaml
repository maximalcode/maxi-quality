rules:
  - id: weak-crypto
    message: >-
      MD5/SHA1/DES/RC4 are broken for anything security-relevant. Use SHA-256+
      for digests, and a password hash (Argon2/bcrypt/PBKDF2) for passwords —
      never a raw digest.
    severity: ERROR
    languages: [typescript, csharp]
    pattern-either:
      # C#
      - pattern: MD5.Create(...)
      - pattern: SHA1.Create(...)
      - pattern: new MD5CryptoServiceProvider(...)
      - pattern: new SHA1CryptoServiceProvider(...)
      - pattern: DES.Create(...)
      - pattern: TripleDES.Create(...)
      # TypeScript / Node
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")
      - pattern: createHash("md5")
      - pattern: createHash("sha1")
      - pattern: crypto.createCipheriv("des", ...)
      - pattern: crypto.createCipheriv("rc4", ...)
      # Everything above is a LITERAL spelling, and that matters: semgrep
      # constant-propagates those, so `const a = 'md5'; createHash(a)` matches.
      # The regex branch below cannot — a metavariable-regex sees the
      # variable's NAME, not its value. Both are kept for that reason; dropping
      # the literals in favour of the "cleaner" regex silently loses a
      # detection the rule already had.
      #
      # The regex branch covers what the literals miss, found by testing the
      # rule against evasions in security review pass 3:
      #   - CASE. OpenSSL algorithm names are case-insensitive, so
      #     createHash('MD5') works and was not matched.
      #   - REAL DES NAMES. Only the exact string "des" was listed, while
      #     Triple-DES is des-ede3 / des-ede3-cbc and plain DES is des-cbc.
      #     The rule's own message promised "MD5/SHA1/DES/RC4" and the README
      #     repeated it, so documented coverage exceeded real coverage.
      - patterns:
          - pattern-either:
              - pattern: createHash($ALGO, ...)
              - pattern: crypto.createHash($ALGO, ...)
              - pattern: createCipheriv($ALGO, ...)
              - pattern: crypto.createCipheriv($ALGO, ...)
              - pattern: createDecipheriv($ALGO, ...)
              - pattern: crypto.createDecipheriv($ALGO, ...)
          - metavariable-regex:
              metavariable: $ALGO
              regex: (?i)^["'](md[245]|sha-?1|rc4[-a-z0-9]*|des(-[a-z0-9]+)*|3des[-a-z0-9]*)["']$

  # Java, added for issue #10. A SEPARATE ID rather than three languages on the
  # rule above, per docs/STATUS.md §4: a rule listing N languages needs every
  # pattern to parse in all N, and `MD5.Create(...)` is not Java.
  #
  # The same two-branch shape as the TypeScript half, and for the same measured
  # reason. The literal branch is what semgrep constant-propagates, so
  # `String a = "MD5"; MessageDigest.getInstance(a);` matches it; a
  # metavariable-regex sees the variable NAME and cannot. Deleting either one
  # loses detections the rule already had.
  #
  # JCA algorithm names are case-insensitive and DES has several real spellings
  # ("DES", "DESede", "DESede/CBC/PKCS5Padding"), which is exactly the evasion
  # the TypeScript rule shipped open. The regex takes the transformation form
  # into account because Cipher.getInstance takes algorithm/mode/padding in one
  # string.
  - id: weak-crypto-java
    message: >-
      MD5/SHA-1/DES/RC4 are broken for anything security-relevant. Use SHA-256+
      for digests, AES-GCM for ciphers, and a password hash
      (Argon2/bcrypt/PBKDF2) for passwords — never a raw digest.
    severity: ERROR
    languages: [java]
    pattern-either:
      - pattern: MessageDigest.getInstance("MD5", ...)
      - pattern: MessageDigest.getInstance("SHA-1", ...)
      - pattern: MessageDigest.getInstance("SHA1", ...)
      - patterns:
          - pattern-either:
              - pattern: MessageDigest.getInstance($ALGO, ...)
              - pattern: java.security.MessageDigest.getInstance($ALGO, ...)
              - pattern: Cipher.getInstance($ALGO, ...)
              - pattern: javax.crypto.Cipher.getInstance($ALGO, ...)
              - pattern: KeyGenerator.getInstance($ALGO, ...)
              - pattern: SecretKeyFactory.getInstance($ALGO, ...)
          - metavariable-regex:
              metavariable: $ALGO
              regex: '(?i)^"(md[245]|sha-?1|rc4|arcfour|des|desede|3des|tripledes)([/-][^"]*)?"$'
