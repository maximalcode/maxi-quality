rules:
  - id: command-injection-ts
    message: >-
      Shell command built from an interpolated value — command injection. Use
      execFile/spawn with an argument array so the shell never parses the input.
    severity: ERROR
    languages: [typescript]
    patterns:
      - pattern-either:
          - pattern: $CP.exec($CMD, ...)
          - pattern: $CP.execSync($CMD, ...)
          - pattern: exec($CMD, ...)
          - pattern: execSync($CMD, ...)
      - metavariable-pattern:
          metavariable: $CMD
          # `pattern-regex` matches RAW SOURCE TEXT, not the parsed literal — so
          # unlike a semgrep string pattern it does NOT treat '...' and "..." as
          # the same thing. The single-quoted branch was missing, and single
          # quotes are the prevailing TypeScript style, so
          #
          #     exec('ls -la ' + dir)
          #
          # matched nothing at all, while the identical shape in
          # sql-string-concat-ts matched every quote style. Same defect, found
          # and fixed once in the sibling rule and left standing here.
          #
          # The root cause both times: NEITHER concatenation branch had a
          # fixture, so the gap could not show up as a lost finding. Both do now.
          pattern-either:
            - pattern-regex: |-
                `[^`]*\$\{
            - pattern-regex: |-
                "[^"]*"\s*\+
            - pattern-regex: |-
                '[^']*'\s*\+

  - id: command-injection-dotnet
    message: >-
      Process arguments built by string interpolation — command injection. Use
      ProcessStartInfo.ArgumentList so each argument is passed separately.
    severity: ERROR
    languages: [csharp]
    pattern-either:
      - pattern: Process.Start($"...{...}...", ...)
      - pattern: Process.Start($EXE, $"...{...}...")
      - pattern: |
          $PSI.Arguments = $"...{...}...";

  # ---------------------------------------------------------------------------
  # THE SAME CONVENTION, ONE STEP AWAY FROM THE SINK.
  #
  # Both rules above require the interpolation to sit syntactically inside the
  # sink call, so binding it to a variable one line up silences them (issue #20,
  # docs/EVAL-vs-oss-tools.md §2d):
  #
  #     const cmd = `tar -czf backup.tgz ${path}`;   // silent
  #     exec(cmd);                                   // silent
  #
  # sql-string-concat closes its half of this by dropping the sink and matching
  # the string. THAT DOES NOT TRANSFER HERE, and the reason is the whole design
  # of these two rules. A SQL string identifies itself — SELECT, INSERT, WHERE.
  # A shell command does not: `"ls -la " + dir` and `"Hello " + name` are the
  # same shape, so a sink-free command rule is a rule against string
  # concatenation, which means it gets switched off, which finds nothing.
  #
  # So this half is done with taint instead, and the sink stays. The source is
  # the interpolation, the sink is the exec call, and Semgrep carries the taint
  # across the local binding. The METAVARIABLE-REGEX ON THE SINK ARGUMENT is
  # what keeps this from double-reporting: restricted to a bare identifier, the
  # inline form (`exec(\`ls -la ${dir}\`)`) belongs to the pattern rules above and
  # is matched only there. `samples/semgrep/` carries a duplication control for
  # it in both languages.
  #
  # MEASURED, AND THE MEASUREMENT IS THE LIMIT OF THIS FIX: Semgrep OSS taint is
  # INTRAPROCEDURAL. It crosses a local variable; it does not cross a function
  # call, so `exec(buildCommand(dir))` stays silent here. Interprocedural taint
  # is a Semgrep Pro feature, and the free tool that did reach it in the eval
  # (CodeQL) cannot run on a private repo — see docs/EVAL-vs-oss-tools.md §0.
  # Nothing free closes the remaining gap, so it is documented rather than
  # papered over with a noisy pattern.
  - id: command-injection-indirect-ts
    mode: taint
    message: >-
      Shell command built from an interpolated value and passed to exec through
      a variable — command injection. Use execFile/spawn with an argument array
      so the shell never parses the input.
    severity: ERROR
    languages: [typescript]
    pattern-sources:
      # Same three quote styles as the pattern rule above, and for the same
      # reason: these are regexes over raw source text, so covering one quote
      # style says nothing about the others.
      - pattern-regex: '`[^`]*\$\{'
      - pattern-regex: '"[^"]*"\s*\+'
      - pattern-regex: "'[^']*'\\s*\\+"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
          # A bare identifier only. Anything else is the inline form, which the
          # pattern rule above already owns.
          - metavariable-regex:
              metavariable: $CMD
              regex: '^[A-Za-z_$][A-Za-z0-9_$]*$'

  - id: command-injection-indirect-dotnet
    mode: taint
    message: >-
      Process arguments built by string interpolation and passed to the process
      through a variable — command injection. Use ProcessStartInfo.ArgumentList
      so each argument is passed separately.
    severity: ERROR
    languages: [csharp]
    pattern-sources:
      - pattern: $"...{...}..."
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Process.Start($EXE, $CMD)
              - pattern: Process.Start($CMD)
              - pattern: $PSI.Arguments = $CMD;
          - metavariable-regex:
              metavariable: $CMD
              regex: '^[A-Za-z_][A-Za-z0-9_]*$'

  # Java, added for issue #10. Runtime.exec(String) and a ProcessBuilder given
  # `sh -c` are the two shapes that hand a whole command line to a shell; both
  # have array-taking siblings that do not, which is the fix the message names.
  #
  # Only double quotes, for the same reason the C# and Java SQL rules give:
  # Java has no single-quoted string type. Text blocks concatenate the same way.
  - id: command-injection-java
    message: >-
      Shell command built by string concatenation — command injection. Use the
      array forms (Runtime.exec(String[]) or new ProcessBuilder("cmd", arg))
      so no shell ever parses the input.
    severity: ERROR
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec($CMD, ...)
          - pattern: $RT.exec($CMD, ...)
          - pattern: new ProcessBuilder(..., $CMD)
          - pattern: $PB.command(..., $CMD)
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern-regex: '"[^"]*"\s*\+'

  # The taint half, exactly as in the two languages above: the interpolation is
  # bound to a local one line up, so every pattern rule goes silent. Same
  # measured limit too — semgrep OSS taint is INTRAPROCEDURAL, so
  # `exec(buildCommand(dir))` stays quiet and QueryBuilder.java carries a
  # fixture that documents the gap rather than papering over it.
  #
  # The metavariable-regex on the sink argument is the duplication control: a
  # bare identifier only, so the inline form belongs to the rule above and is
  # reported once.
  - id: command-injection-indirect-java
    mode: taint
    message: >-
      Shell command built by concatenation and passed to exec through a variable
      — command injection. Use the array forms (Runtime.exec(String[]) or new
      ProcessBuilder("cmd", arg)) so no shell ever parses the input.
    severity: ERROR
    languages: [java]
    pattern-sources:
      - pattern-regex: '"[^"]*"\s*\+'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Runtime.getRuntime().exec($CMD, ...)
              - pattern: $RT.exec($CMD, ...)
              - pattern: new ProcessBuilder(..., $CMD)
              - pattern: $PB.command(..., $CMD)
          - metavariable-regex:
              metavariable: $CMD
              regex: '^[A-Za-z_][A-Za-z0-9_]*$'
