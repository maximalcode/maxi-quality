rules:
  - id: sql-string-concat-dotnet
    message: >-
      SQL built by string concatenation or interpolation — this is SQL injection.
      Use parameters (cmd.Parameters.Add / Dapper's anonymous-object args), or
      FormattableString with a provider that parameterises it.
    severity: ERROR
    languages: [csharp]
    pattern-either:
      - pattern: |
          new SqlCommand($"...{...}...", ...)
      - pattern: |
          new SqlCommand("..." + $X, ...)
      - patterns:
          - pattern-either:
              - pattern: $CONN.Query(...)
              - pattern: $CONN.QueryAsync(...)
              - pattern: $CONN.Execute(...)
              - pattern: $CONN.ExecuteAsync(...)
              - pattern: $CMD.CommandText = $SQL
          - pattern-either:
              # Only double quotes here, and that is CORRECT rather than an
              # oversight: C# has no single-quoted string type ('x' is a char).
              # The TypeScript twin needed both — see the note there before
              # copying this shape into another language.
              - pattern-regex: '"[^"]*\b(SELECT|INSERT|UPDATE|DELETE|WHERE|FROM)\b[^"]*"\s*\+'
              - pattern-regex: '\$"[^"]*\b(SELECT|INSERT|UPDATE|DELETE|WHERE|FROM)\b[^"]*\{'

  - id: sql-string-concat-ts
    message: >-
      SQL built by template literal or concatenation — this is SQL injection.
      Use placeholders and pass values as the query's parameter array.
    severity: ERROR
    languages: [typescript]
    patterns:
      # The entry point is a BOUND NAME plus a regex, not a fixed list of
      # patterns. The fixed list was `.query` / `.execute` / `.raw`, which meant
      # Prisma's `$queryRawUnsafe` and `$executeRawUnsafe` — the two methods
      # whose names say outright that they do not parameterise — matched nothing
      # whatsoever, while the README showed this rule as covering TypeScript.
      #
      # The list stays short on purpose. A rule that flags every method call
      # taking a string gets switched off, and a switched-off rule finds less
      # than a narrow one. Prisma's `$queryRaw` / `$executeRaw` are deliberately
      # NOT here: they are tagged templates and Prisma parameterises their
      # interpolations, so flagging them would be a false positive on the SAFE
      # form of the same API.
      - pattern-either:
          - pattern: $DB.$METHOD($SQL, ...)
          - pattern: $DB.$METHOD($SQL)
      - metavariable-regex:
          metavariable: $METHOD
          regex: '^(query|execute|raw|\$queryRawUnsafe|\$executeRawUnsafe)$'
      - metavariable-pattern:
          metavariable: $SQL
          patterns:
            # `pattern-regex` matches RAW SOURCE TEXT, not the parsed literal —
            # so unlike a semgrep string pattern it does NOT treat '...' and
            # "..." as the same thing. The double-quoted branch shipped alone,
            # which meant
            #
            #     db.query('SELECT * FROM u WHERE id = ' + id)
            #
            # — single quotes being the prevailing TypeScript style, and this
            # baseline shipping no quote rule — was silently exempt. That is the
            # commonest SQL-injection shape in JavaScript. Found in security
            # review pass 3; the root cause is that no fixture ever covered the
            # concatenation branch, so CI was green over the gap.
            #
            # command-injection-ts carried the IDENTICAL defect and was not
            # looked at when this one was fixed, so it kept it for as long
            # again. A defect found by measurement is a class, not an instance —
            # check the sibling rule first. Every branch of both is baited now.
            - pattern-either:
                - pattern-regex: |-
                    `[^`]*\b(SELECT|INSERT|UPDATE|DELETE|WHERE|FROM)\b[^`]*\$\{
                - pattern-regex: |-
                    "[^"]*\b(SELECT|INSERT|UPDATE|DELETE|WHERE|FROM)\b[^"]*"\s*\+
                - pattern-regex: |-
                    '[^']*\b(SELECT|INSERT|UPDATE|DELETE|WHERE|FROM)\b[^']*'\s*\+

  # ---------------------------------------------------------------------------
  # THE SAME CONVENTION, ONE STEP AWAY FROM THE SINK.
  #
  # Both rules above match the SINK CALL and require the concatenation to sit
  # syntactically inside it. Measured 2026-08-02 (docs/EVAL-vs-oss-tools.md §2d,
  # issue #20): move the string one step and every branch above goes quiet on the
  # identical bug — not only across a function boundary, but across a local
  # variable, which is the commoner shape of the two:
  #
  #     var sql = "SELECT * FROM Users WHERE Id = " + id;   // silent
  #     conn.Execute(sql);                                  // silent
  #
  # So these two rules drop the sink entirely and match the STRING: a literal
  # carrying a SQL keyword, concatenated or interpolated, wherever it is built.
  # That is the precision trade the free registry's `csharp-sqli` makes, and on
  # this corpus it is the only shape that reaches a helper at all — Semgrep OSS
  # has no interprocedural taint. Measured, because "OSS taint mode would do
  # this" is exactly the kind of assumption this repo does not ship on: taint
  # mode crosses a local variable and does NOT cross a function call. It is used
  # for the local-variable half of command-injection, where there is no keyword
  # to match on; here there is one, so the wider rule is affordable.
  #
  # THE `^` ANCHORS ARE LOAD-BEARING. `pattern-regex` inside a
  # `metavariable-pattern` is a SUBSTRING match over the metavariable's source
  # text, so unanchored it also matches `return db.query("SELECT ..." + id)` —
  # where the concatenation is the sink's argument and the rules above already
  # fire — and one bug gets reported twice under two ids. `samples/semgrep/`
  # carries a duplication control for exactly that, per language.
  - id: sql-string-concat-builder-dotnet
    message: >-
      SQL assembled by concatenation or interpolation outside a query call. It
      is still SQL injection wherever the string is built — parameterise it here
      (cmd.Parameters.Add / Dapper's anonymous-object args) rather than at the
      sink.
    severity: ERROR
    languages: [csharp]
    patterns:
      - pattern-either:
          - pattern: return $SQL;
          - pattern: $T $VAR = $SQL;
          - pattern: var $VAR = $SQL;
          - pattern: $VAR = $SQL;
          - pattern: $RET $M(...) => $SQL;
      # `CommandText` is a sink, and sql-string-concat-dotnet already owns it.
      # Without this the assignment branch above reports it a second time.
      - pattern-not: $CMD.CommandText = $SQL;
      - metavariable-pattern:
          metavariable: $SQL
          pattern-either:
            # Only double quotes, for the same reason as the sink rule: C# has
            # no single-quoted string type.
            - pattern-regex: '^"[^"]*\b(SELECT|INSERT|UPDATE|DELETE|WHERE|FROM)\b[^"]*"\s*\+'
            - pattern-regex: '^\$"[^"]*\b(SELECT|INSERT|UPDATE|DELETE|WHERE|FROM)\b[^"]*\{'

  - id: sql-string-concat-builder-ts
    message: >-
      SQL assembled by template literal or concatenation outside a query call.
      It is still SQL injection wherever the string is built — use placeholders
      here and pass the values as the query's parameter array.
    severity: ERROR
    languages: [typescript]
    patterns:
      - pattern-either:
          - pattern: return $SQL;
          # `var $VAR = $SQL` covers const and let too — semgrep normalises the
          # three declaration keywords. A concise arrow body (`=> 'SELECT ...'`)
          # is normalised to a return and is covered by the branch above; adding
          # an explicit arrow pattern here reported it twice.
          - pattern: var $VAR = $SQL;
          - pattern: $VAR = $SQL;
      - metavariable-pattern:
          metavariable: $SQL
          pattern-either:
            - pattern-regex: |-
                ^`[^`]*\b(SELECT|INSERT|UPDATE|DELETE|WHERE|FROM)\b[^`]*\$\{
            - pattern-regex: |-
                ^"[^"]*\b(SELECT|INSERT|UPDATE|DELETE|WHERE|FROM)\b[^"]*"\s*\+
            - pattern-regex: |-
                ^'[^']*\b(SELECT|INSERT|UPDATE|DELETE|WHERE|FROM)\b[^']*'\s*\+

  # Java, added for issue #10. Same design as the TypeScript rule: a BOUND
  # method name plus a regex on the argument, never a fixed list of patterns,
  # because a fixed list is what let Prisma's two Unsafe methods through under
  # a green tick (docs/STATUS.md §4).
  #
  # The entry points are Spring's JdbcTemplate/JdbcClient, JPA's
  # createQuery/createNativeQuery and plain JDBC's Statement. NOT included:
  # PreparedStatement, whose entire purpose is the parameterised form — flagging
  # it would be a false positive on the fix this rule asks for.
  #
  # Only double quotes in the regex, and unlike the TypeScript rule that is
  # CORRECT rather than an oversight: Java has no single-quoted string type
  # ('x' is a char). Same reasoning as the C# branch above. Text blocks are
  # covered by the concatenation form because a """...""" + id still ends in a
  # quote followed by a plus.
  - id: sql-string-concat-java
    message: >-
      SQL built by string concatenation — this is SQL injection. Bind the value
      instead: JdbcClient .param(), JdbcTemplate's Object[] args, or
      PreparedStatement placeholders.
    severity: ERROR
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: $DB.$METHOD($SQL, ...)
          - pattern: $DB.$METHOD($SQL)
      - metavariable-regex:
          metavariable: $METHOD
          regex: '^(sql|query|queryForObject|queryForList|queryForMap|queryForRowSet|update|batchUpdate|execute|executeQuery|executeUpdate|createQuery|createNativeQuery)$'
      - metavariable-pattern:
          metavariable: $SQL
          patterns:
            - pattern-regex: '"[^"]*\b(SELECT|INSERT|UPDATE|DELETE|WHERE|FROM)\b[^"]*"\s*\+'

  # The builder form, one step away from the sink — the Java twin of
  # sql-string-concat-builder-dotnet/-ts. StringBuilder is how a dynamic WHERE
  # clause actually gets assembled in Java, and none of the sink patterns above
  # can see it because the sink receives a variable.
  #
  # `pattern-not` on the parameter placeholder is what keeps this from firing on
  # the SAFE form of the same builder: appending " AND name = ?" is exactly the
  # fix being asked for.
  - id: sql-string-concat-builder-java
    message: >-
      SQL assembled in a StringBuilder from a non-literal — the concatenated
      value reaches the database as code. Append a placeholder ("?" or a named
      parameter) and bind the value separately.
    severity: ERROR
    languages: [java]
    patterns:
      - pattern: $SB.append($PART)
      - metavariable-regex:
          metavariable: $SB
          regex: '(?i).*(sql|query|where|clause|builder)\w*'
      - pattern-not: $SB.append("...")
