rules:
  - id: mutation-requires-authz-dotnet
    message: >-
      Service mutation method with no authorisation check. Every Create/Update/
      Delete entry point must call the authz gate before it touches state —
      "the caller already checked" is how privilege-escalation bugs happen.
    severity: ERROR
    languages: [csharp]
    paths:
      include:
        - "*Service.cs"
        - "*Handler.cs"
      exclude:
        - "*Tests*"
    patterns:
      - pattern: |
          public $RET $METHOD(...) { ... }
      - metavariable-regex:
          metavariable: $METHOD
          regex: '^(Create|Update|Delete|Remove|Set|Assign|Revoke|Grant)\w*'
      - pattern-not: |
          public $RET $METHOD(...) { ... $AUTHZ.Require(...); ... }
      - pattern-not: |
          public $RET $METHOD(...) { ... $AUTHZ.Authorize(...); ... }
      - pattern-not: |
          public $RET $METHOD(...) { ... await $AUTHZ.RequireAsync(...); ... }
      - pattern-not: |
          public $RET $METHOD(...) { ... await $AUTHZ.AuthorizeAsync(...); ... }

  - id: mutation-requires-authz-ts
    message: >-
      Service mutation method with no authorisation check. Every create/update/
      delete entry point must call the authz gate before it touches state.
    severity: ERROR
    languages: [typescript]
    paths:
      include:
        - "*service.ts"
        - "*handler.ts"
      exclude:
        - "*.test.ts"
        - "*.spec.ts"
    patterns:
      - pattern: |
          async $METHOD(...) { ... }
      - metavariable-regex:
          metavariable: $METHOD
          regex: '^(create|update|delete|remove|set|assign|revoke|grant)\w*'
      # TWO exemptions, not three, and neither mentions `await`.
      #
      # `await $AUTHZ.require(...)` used to be listed separately and was dead:
      # semgrep matches the inner call inside the await expression, so the plain
      # form already covered both spellings. Proved by deleting it — nothing
      # changed — and that is the problem with a branch no fixture can single
      # out. It cannot be shown to work, and it cannot be shown to have stopped.
      #
      # Dropping it took `authorize` with it, which was listed ONLY in its
      # awaited form: an un-awaited `authorize` was a finding while an
      # un-awaited `require` was not, for no reason anyone chose. Forgetting to
      # await a gate is its own bug and a real one; it is not this rule's, and
      # the rule now says the same thing about both spellings of both names.
      - pattern-not: |
          async $METHOD(...) { ... $AUTHZ.require(...); ... }
      - pattern-not: |
          async $METHOD(...) { ... $AUTHZ.authorize(...); ... }

  # Python, added for issue #21.
  #
  # The name regex is anchored differently from the two above and it matters.
  # C# and TypeScript spell a mutation `DeleteOrder` / `deleteOrder`, so a
  # prefix match on `Delete\w*` is unambiguous. Python spells it `delete_order`,
  # and a bare prefix match would also take `settle_invoice` and `granted_at`
  # along with it — `set` and `grant` are prefixes of real words. So the verb
  # must be the whole name or be followed by an underscore.
  #
  # A LEADING UNDERSCORE IS NOT MATCHED, deliberately: `_delete_row` is a
  # private helper, and the convention is about ENTRY POINTS. Python has no
  # `public` keyword for the rule to key on the way the C# twin does, and the
  # underscore is the language's own answer to the same question.
  - id: mutation-requires-authz-python
    message: >-
      Service mutation method with no authorisation check. Every create/update/
      delete entry point must call the authz gate before it touches state —
      "the caller already checked" is how privilege-escalation bugs happen.
    severity: ERROR
    languages: [python]
    paths:
      include:
        - "*service.py"
        - "*handler.py"
      exclude:
        - "*_test.py"
        - "test_*.py"
        - "**/tests/**"
        - "**/conftest.py"
    patterns:
      - pattern-either:
          - pattern: |
              def $METHOD(...):
                  ...
          - pattern: |
              async def $METHOD(...):
                  ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: '^(create|update|delete|remove|set|assign|revoke|grant)(_\w*)?$'
      # As in the TS rule, `await` is not spelled out: semgrep matches the inner
      # call inside the await expression, so one form covers both. Both sync and
      # async definitions need their own exemption pattern, though — unlike the
      # await case, `async def` is a different node and the plain form does not
      # cover it.
      - pattern-not: |
          def $METHOD(...):
              ...
              $AUTHZ.require(...)
              ...
      - pattern-not: |
          def $METHOD(...):
              ...
              $AUTHZ.authorize(...)
              ...
      - pattern-not: |
          async def $METHOD(...):
              ...
              $AUTHZ.require(...)
              ...
      - pattern-not: |
          async def $METHOD(...):
              ...
              $AUTHZ.authorize(...)
              ...

  # Java, added for issue #10.
  #
  # THE @PreAuthorize EXEMPTION IS LOAD-BEARING, not a convenience. In a Spring
  # codebase the annotation IS the authorisation check — it is enforced by a
  # method interceptor before the body runs — so a rule that only knows about
  # an explicit gate CALL fires on every correctly-secured service in the repo.
  # That is the shape docs/STATUS.md §4 records for catch-and-swallow: 4 of 4
  # false positives on real code, from a rule that was right about the pattern
  # and wrong about the idiom.
  #
  # Every exemption below has a counterexample in samples/semgrep/UserService.java
  # that must stay silent, and a sibling that must fire — a fixture that merely
  # passes cannot tell "the exemption matched" from "the rule never reached the
  # method" (docs/STATUS.md §4).
  - id: mutation-requires-authz-java
    message: >-
      Service mutation method with no authorisation check. Every create/update/
      delete entry point must be gated — @PreAuthorize on the method, or an
      explicit authz call before it touches state. "The caller already checked"
      is how privilege-escalation bugs happen.
    severity: ERROR
    languages: [java]
    paths:
      include:
        - "*Service.java"
        - "*Handler.java"
      exclude:
        - "*Test.java"
        - "*Tests.java"
        - "*IT.java"
        - "**/test/**"
    patterns:
      - pattern: |
          public $RET $METHOD(...) { ... }
      - metavariable-regex:
          metavariable: $METHOD
          regex: '^(create|update|delete|remove|set|assign|revoke|grant)\w*'
      - pattern-not: |
          public $RET $METHOD(...) { ... $AUTHZ.require(...); ... }
      - pattern-not: |
          public $RET $METHOD(...) { ... $AUTHZ.authorize(...); ... }
      - pattern-not: |
          public $RET $METHOD(...) { ... $AUTHZ.checkPermission(...); ... }
      # The Spring annotations, all three spellings. @PreAuthorize covers the
      # SpEL form, @Secured the role-list form, @RolesAllowed the Jakarta one.
      - pattern-not: |
          @PreAuthorize(...)
          public $RET $METHOD(...) { ... }
      - pattern-not: |
          @Secured(...)
          public $RET $METHOD(...) { ... }
      - pattern-not: |
          @RolesAllowed(...)
          public $RET $METHOD(...) { ... }
