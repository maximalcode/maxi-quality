# DELIBERATE CALL on audit timestamps (Phase A #18): `CreatedAt = UtcNow` and
# friends KEEP FIRING. They were the ambiguous third of the Consumer A hits
# (~8 of 26), and they stay in scope because "was this row created before the
# cutoff?" is exactly the assertion you cannot write a test for without
# sleeping. Injecting the clock at a persistence boundary is cheap; the
# exemptions below are for code whose *purpose* is to read the clock, not for
# code that merely finds it convenient.
rules:
  # This is the cross-language proof rule: ONE rule id, one message, firing in
  # both the TypeScript and the C# sample. See docs/CONCEPT.md §10.
  - id: no-ambient-clock
    message: >-
      Reading the ambient clock directly makes this code untestable — you cannot
      write a test for "expires tomorrow" without sleeping. Inject a clock
      (TimeProvider in .NET, a `now()` port in TS) and read the time from it.
    severity: ERROR
    languages: [typescript, csharp]
    paths:
      exclude:
        - "*Tests*"
        - "*.test.ts"
        - "*.spec.ts"
        # Phase A #18 — infrastructure where reading the clock IS the function.
        # Each entry is justified by an OBSERVED false positive, never a
        # speculative one.
        #
        # These are generic shapes, not consumer-specific file names, on
        # purpose. This glob list must NOT become a junk drawer of every
        # consumer's module names — that would silently exempt future
        # business logic that happens to live in an already-listed file.
        # The supported fix for a one-off site is an inline suppression that
        # states WHY, next to the code:
        #
        #   // nosemgrep: no-ambient-clock — this ID scheme encodes wall-clock
        #   // time by definition; the overload taking an explicit instant is
        #   // the testable entry point.
        #
        # Observed instances of that at Phase A: two ID generators (one C#,
        # one TypeScript) and one health endpoint whose whole purpose is
        # reporting server time. All three take a comment at adoption, not a
        # glob here.
        - "*Seeder*"    # dev-only data seeding
        - "**/Dev/**"
        - "*.config.ts" # perf/playwright/harness configs
    patterns:
      - pattern-either:
          # C#
          - pattern: DateTime.Now
          - pattern: DateTime.UtcNow
          - pattern: DateTime.Today
          - pattern: DateTimeOffset.Now
          - pattern: DateTimeOffset.UtcNow
          # TypeScript
          - pattern: new Date()
          - pattern: Date.now()
      # Stamping a timestamp into a log line is not untestable business logic.
      # Done by context rather than by excluding "*Worker*" wholesale, because
      # background workers DO carry time-sensitive logic (backoff, scheduling)
      # that this rule should still catch. Verified to parse in both languages.
      - pattern-not-inside: $LOG.LogTrace(...)
      - pattern-not-inside: $LOG.LogDebug(...)
      - pattern-not-inside: $LOG.LogInformation(...)
      - pattern-not-inside: $LOG.LogWarning(...)
      - pattern-not-inside: $LOG.LogError(...)
      - pattern-not-inside: $LOG.LogCritical(...)
      - pattern-not-inside: console.log(...)
      - pattern-not-inside: console.debug(...)
      - pattern-not-inside: console.info(...)
      - pattern-not-inside: console.warn(...)
      - pattern-not-inside: console.error(...)

  # Python, added for issue #21. A SECOND rule id rather than a third entry in
  # the `languages` list above, because every pattern in a rule must parse in
  # every language it declares and `DateTime.UtcNow` / `new Date()` do not parse
  # as Python. The id above remains the cross-language proof rule for TS and C#
  # (docs/CONCEPT.md §10); this one carries the same message.
  # Java, added for issue #10. THE SCOPE HERE IS NARROWER THAN THE OTHER THREE
  # AND THAT IS THE POINT — it is the overlap audit #10 asked for, run against
  # the real analyzer output rather than against a changelog.
  #
  # Measured 2026-08-09 with Error Prone 2.50.0 on this repo's own Java fixture,
  # by planting all five shapes and reading what came back:
  #
  #   new Date()                  -> [JavaUtilDate]            already flagged
  #   LocalDate.now()             -> [JavaTimeDefaultTimeZone] already flagged
  #   LocalDateTime.now()         -> [JavaTimeDefaultTimeZone] already flagged
  #   Instant.now()               -> nothing
  #   System.currentTimeMillis()  -> nothing
  #
  # So this rule matches the last two and only those. Adding the first three
  # would put a second finding on a line the compiler already failed the build
  # over, which is not more coverage — it is the same bug reported twice, and
  # the reason people start ignoring one of the two reporters.
  #
  # Instant.now() is the interesting one: it is NOT a JavaTimeDefaultTimeZone
  # violation, because an Instant carries no zone and there is nothing for the
  # default zone to silently get wrong. It is still an ambient clock read, and
  # still the thing that makes "expires tomorrow" untestable.
  #
  # System.nanoTime() is deliberately absent: it is a monotonic duration source,
  # not a wall clock, and injecting a Clock does not replace it.
  - id: no-ambient-clock-java
    message: >-
      Reading the ambient clock directly makes this code untestable — you cannot
      write a test for "expires tomorrow" without sleeping. Inject a
      java.time.Clock and read the time from it (clock.instant(),
      clock.millis()).
    severity: ERROR
    languages: [java]
    paths:
      exclude:
        - "*Test.java"
        - "*Tests.java"
        - "*IT.java"
        - "**/test/**"
        # Same generic shapes as the other three, and the same rule about them:
        # this list must not become a junk drawer of consumer module names.
        - "*Seeder*"
        - "**/dev/**"
    pattern-either:
      - pattern: Instant.now()
      - pattern: java.time.Instant.now()
      - pattern: System.currentTimeMillis()

  - id: no-ambient-clock-python
    message: >-
      Reading the ambient clock directly makes this code untestable — you cannot
      write a test for "expires tomorrow" without sleeping. Inject a clock (a
      `now()` port, or pass the instant in) and read the time from it.
    severity: ERROR
    languages: [python]
    paths:
      exclude:
        - "*_test.py"
        - "test_*.py"
        - "**/tests/**"
        - "**/conftest.py"
        # Same generic shapes as the rule above, and the same warning: this list
        # must not become a junk drawer of consumer module names. A one-off site
        # takes an inline `# nosemgrep: no-ambient-clock-python — <why>`.
        - "*seed*.py"
        - "**/dev/**"
        - "conf.py"
    patterns:
      # THE RECEIVER IS A BOUND NAME PLUS A REGEX, not a literal `datetime.`.
      # The first draft used `pattern: datetime.now(...)` on the assumption that
      # semgrep matches a dotted suffix, so it would also cover
      # `datetime.datetime.now()`. It does not — and `import datetime` then
      # `datetime.datetime.now()` is the spelling most Python code uses, so the
      # rule would have shipped covering the less common half. Caught because
      # the fixture used the qualified form; that is the whole argument for
      # baiting an assumption rather than a branch.
      #
      # Both spellings of the import are covered by the same regex:
      # `from datetime import datetime` gives `datetime.now()`, plain
      # `import datetime` gives `datetime.datetime.now()`. An aliased import
      # (`import datetime as dt`) is NOT reachable and is not worth a guessed
      # list of alias names.
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $M.now(...)
                  - pattern: $M.utcnow()
                  - pattern: $M.today()
              - metavariable-regex:
                  metavariable: $M
                  regex: '^(datetime\.)?(datetime|date)$'
          - pattern: time.time()
      # Stamping a timestamp into a log line is not untestable business logic —
      # the same carve-out the TS and C# rule makes, in Python's logging idiom.
      - pattern-not-inside: $LOG.debug(...)
      - pattern-not-inside: $LOG.info(...)
      - pattern-not-inside: $LOG.warning(...)
      - pattern-not-inside: $LOG.error(...)
      - pattern-not-inside: $LOG.exception(...)
      - pattern-not-inside: $LOG.critical(...)
