rules:
  - id: no-float-for-money
    message: >-
      Binary floating point cannot represent 0.10 exactly, so money in a
      double/float silently drifts once you sum enough rows. Use decimal (C#) or
      integer minor units for any amount, price, total, balance or fee.
    severity: ERROR
    languages: [csharp]
    pattern-either:
      # Fields and locals.
      - patterns:
          - pattern-either:
              - pattern: double $NAME;
              - pattern: float $NAME;
              - pattern: double $NAME = ...;
              - pattern: float $NAME = ...;
          - metavariable-regex:
              metavariable: $NAME
              regex: '(?i).*(amount|price|total|balance|cost|fee|salary|payment|subtotal|discount|tax).*'
      # Method parameters. The body matters: without `{ ... }` the pattern does
      # not match a real method declaration.
      - patterns:
          - pattern-either:
              - pattern: $RET $M(..., double $NAME, ...) { ... }
              - pattern: $RET $M(..., float $NAME, ...) { ... }
              - pattern: $RET $M(..., double $NAME, ...) => ...;
              - pattern: $RET $M(..., float $NAME, ...) => ...;
          - metavariable-regex:
              metavariable: $NAME
              regex: '(?i).*(amount|price|total|balance|cost|fee|salary|payment|subtotal|discount|tax).*'

  # Python, added for issue #21. Same convention, and the same fix on the other
  # side: `decimal.Decimal` or integer minor units.
  #
  # THE COVERAGE IS NARROWER THAN THE C# RULE, AND HONESTLY SO. C# declares a
  # type on every local, so the rule sees `double total`. Python only has a type
  # where somebody wrote an annotation, so an unannotated `total = 0.0` is not
  # reachable here. That is a real limit, not an oversight: a rule keyed on the
  # literal instead would fire on every float in the codebase. Consumer C runs
  # mypy strict, which means annotations exist on parameters and attributes —
  # which is where money crosses a boundary and where getting it wrong costs
  # something. The gap has a fixture that stays silent, so it is visible.
  - id: no-float-for-money-python
    message: >-
      Binary floating point cannot represent 0.10 exactly, so money in a float
      silently drifts once you sum enough rows. Use decimal.Decimal or integer
      minor units for any amount, price, total, balance or fee.
    severity: ERROR
    languages: [python]
    paths:
      exclude:
        - "*_test.py"
        - "test_*.py"
        - "**/tests/**"
        - "**/conftest.py"
    pattern-either:
      # Annotated assignments and bare annotations — module level, class
      # attributes, and locals.
      - patterns:
          - pattern-either:
              - pattern: '$NAME: float = ...'
              - pattern: '$NAME: float'
          - metavariable-regex:
              metavariable: $NAME
              regex: '(?i).*(amount|price|total|balance|cost|fee|salary|payment|subtotal|discount|tax).*'
      # Function and method parameters, sync and async. The body is `...` rather
      # than omitted, for the same reason as the C# rule: without it the pattern
      # does not match a real definition.
      - patterns:
          - pattern-either:
              - pattern: |
                  def $F(..., $NAME: float, ...):
                      ...
              - pattern: |
                  async def $F(..., $NAME: float, ...):
                      ...
          - metavariable-regex:
              metavariable: $NAME
              regex: '(?i).*(amount|price|total|balance|cost|fee|salary|payment|subtotal|discount|tax).*'

  # Java, added for issue #10. Java declares a type on every field, local and
  # parameter, so the coverage is the C# rule's rather than the Python rule's
  # narrower one — nothing here depends on somebody having written an
  # annotation.
  #
  # Error Prone has no check for this: measured 2026-08-09, a planted
  # `double price` came back clean.
  - id: no-float-for-money-java
    message: >-
      Binary floating point cannot represent 0.10 exactly, so money in a
      double/float silently drifts once you sum enough rows. Use
      java.math.BigDecimal or integer minor units for any amount, price, total,
      balance or fee.
    severity: ERROR
    languages: [java]
    paths:
      exclude:
        - "*Test.java"
        - "*Tests.java"
        - "*IT.java"
        - "**/test/**"
    pattern-either:
      # Fields and locals.
      - patterns:
          - pattern-either:
              - pattern: double $NAME;
              - pattern: float $NAME;
              - pattern: double $NAME = ...;
              - pattern: float $NAME = ...;
          - metavariable-regex:
              metavariable: $NAME
              regex: '(?i).*(amount|price|total|balance|cost|fee|salary|payment|subtotal|discount|tax).*'
      # Method parameters. The body matters here for the same reason it does in
      # the C# rule: without `{ ... }` the pattern does not match a real
      # declaration.
      - patterns:
          - pattern-either:
              - pattern: $RET $M(..., double $NAME, ...) { ... }
              - pattern: $RET $M(..., float $NAME, ...) { ... }
          - metavariable-regex:
              metavariable: $NAME
              regex: '(?i).*(amount|price|total|balance|cost|fee|salary|payment|subtotal|discount|tax).*'
