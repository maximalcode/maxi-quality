# One convention, two rule ids: `catch (...)` is not valid C# and
# `catch (Exception e)` is not valid TypeScript, so Semgrep needs a pattern per
# language. Keep the message identical so the finding reads the same either way.
#
# WHY THE `pattern-not-regex`, AND WHY IT IS NESTED UNDER `patterns:`
#
# The message tells you the escape hatch is a comment explaining the silence.
# Until 2026-07-31 that was a lie: Semgrep matches on the AST, comments are not
# AST nodes, so a block containing only a comment is still `{ }` and still
# matched. Following the instruction verbatim did not clear the finding — the
# rule flagged documented-and-intentional catches identically to silent ones.
#
# Found by measuring against Consumer A before adoption: 6 of its 38 Layer 2
# findings were this rule, and the blocks it flagged already carried exactly the
# comment the message asks for.
#
# The regex re-reads the matched source text (where comments DO survive) and
# drops matches whose catch block opens with one. It must sit inside a
# `patterns:` block alongside the `pattern-either` — a `pattern-not-regex` at
# rule level next to a top-level `pattern-either` is silently ignored, which was
# verified the hard way: it changed nothing.
#
# The escape hatch is now real. A bare `catch { }` still fires, which is the
# whole point and is what samples/semgrep asserts.
#
# 2026-08-02 — THE SAME BUG, ONE SYNTAX FURTHER ALONG.
#
# A regex that re-reads source text has to step over every token the language
# allows between `catch` and `{`, and C# allows one the original expression did
# not know about: an exception filter, `catch (T e) when (cond) { }`. The old
# `catch\s*(\([^)]*\))?\s*\{` walks straight from the closing paren to the
# brace, so a FILTERED catch never matched the negation and could not be cleared
# by the comment the message asks for — while an unfiltered one beside it could.
# Documented-and-intentional flagged again, and the message again promising an
# escape hatch that did not exist for that shape. Found the same way as the
# first one: measuring against Consumer A, where the filter is how a specific
# error code gets caught by name.
#
# Only the C# id needs the extra branch. JavaScript and TypeScript have no
# exception filter, so the TS negation is left alone rather than grown a branch
# for syntax that cannot occur.
#
# The lesson worth keeping is not about `when` specifically: this negation is a
# LEXICAL patch over an AST rule, so every catch-clause syntax is a separate
# thing it can silently miss, and each one costs a real consumer a false
# positive before anyone notices. Both halves of the filter form are planted in
# samples/semgrep/Bad.cs — one that must fire, one that must not — because a
# negative control on its own proves the escape hatch works and nothing about
# whether the branch still matches.

rules:
  - id: catch-and-swallow-ts
    message: >-
      Empty catch block — the failure is discarded silently. Log it, wrap it, or
      rethrow. If ignoring really is correct, say why in a comment inside the
      block so the next reader does not have to guess.
    severity: ERROR
    languages: [typescript]
    patterns:
      - pattern-either:
          - pattern: |
              try { ... } catch ($E) { }
          - pattern: |
              try { ... } catch { }
      - pattern-not-regex: 'catch\s*(\([^)]*\))?\s*\{\s*(//|/\*)'

  - id: catch-and-swallow-dotnet
    message: >-
      Empty catch block — the failure is discarded silently. Log it, wrap it, or
      rethrow. If ignoring really is correct, say why in a comment inside the
      block so the next reader does not have to guess.
    severity: ERROR
    languages: [csharp]
    patterns:
      - pattern-either:
          - pattern: |
              try { ... } catch { }
          - pattern: |
              try { ... } catch ($T $E) { }
          - pattern: |
              try { ... } catch ($T) { }
      # The `(when ...)` group is the 2026-08-02 fix; see the header. Greedy
      # `.*` rather than lazy so a filter containing its own parens —
      # `when (IsTransient(e))` — still reaches the brace by backtracking.
      - pattern-not-regex: 'catch\s*(\([^)]*\))?\s*(when\s*\(.*\)\s*)?\{\s*(//|/\*)'
