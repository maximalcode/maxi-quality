name: facts
description: Print the paths a composite action sees.
inputs:
  target:
    description: same default actions/layer2 uses
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CTX_ACTION_PATH: ${{ github.action_path }}
        IN_TARGET: ${{ inputs.target }}
      run: |
        echo "composite: github.action_path = $CTX_ACTION_PATH"
        echo "composite: GITHUB_ACTION_PATH = $GITHUB_ACTION_PATH"
        echo "composite: inputs.target      = $IN_TARGET"
        for p in "$CTX_ACTION_PATH" "$GITHUB_ACTION_PATH" "$IN_TARGET"; do
          if [[ -d "$p" ]]; then echo "  exists : $p"; else echo "  MISSING: $p"; fi
        done
