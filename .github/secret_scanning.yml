# maxi-quality — GitHub secret-scanning exclusions (issue #61).
#
# This repo plants fake credentials on purpose: samples/semgrep/ is the bait
# the `hardcoded-secret-*` rules are asserted against, and a sample that stops
# being detected means the rule regressed (CLAUDE.md §5). One of those fakes —
# samples/semgrep/Bad.cs — is written in GitHub's own `ghp_` shape precisely
# because a realistic token is what the rule has to catch.
#
# So enabling secret scanning without this file produces a permanent alert on
# a string that was never valid, and a security tab whose one open finding is
# the test suite working. That is how a real alert gets missed.
#
# The same argument `.gitleaks.toml` already makes for Gitleaks, in the one
# format GitHub reads. Scoped to samples/ and nowhere else: the exclusion must
# not extend to code a leaked credential could plausibly reach.
#
# NOTE — this file governs ALERTS, not push protection. Push protection is a
# separate setting and it still evaluates every push, so an edit that moves one
# of the sample tokens can be blocked at push time and has to be allowed
# explicitly. That is the correct trade: the fixtures change rarely, and a
# push-time prompt on samples/ is cheaper than a scanner that ignores them.
paths-ignore:
  - 'samples/**'
