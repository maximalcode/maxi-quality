name: probe-reusable
on:
  workflow_call:
    inputs:
      container-image:
        type: string
        default: ''
      runner:
        type: string
        default: 'ubuntu-latest'
jobs:
  facts:
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.container-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Where am I
        shell: bash
        env:
          IMAGE: ${{ inputs.container-image }}
          CTX_WORKSPACE: ${{ github.workspace }}
          CTX_TEMP: ${{ runner.temp }}
          CTX_TOOL_CACHE: ${{ runner.tool_cache }}
        run: |
          echo "input container-image = [$IMAGE]"
          id
          if [[ -f /.dockerenv ]]; then where=container; else where=host; fi
          echo "running in: $where"
          head -2 /etc/os-release
          echo "HOME=$HOME"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE   github.workspace=$CTX_WORKSPACE"
          echo "RUNNER_TEMP=$RUNNER_TEMP   runner.temp=$CTX_TEMP"
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-}   runner.tool_cache=$CTX_TOOL_CACHE"
          echo "RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH"
          echo "CARGO_HOME=${CARGO_HOME:-<unset>} RUSTUP_HOME=${RUSTUP_HOME:-<unset>}"
          echo "PATH=$PATH"
          ls -ldn "$GITHUB_WORKSPACE" "$HOME" || true
          echo "--- global safe.directory after checkout:"
          git config --global --get-all safe.directory || echo "(none)"
          echo "--- git status in the workspace:"
          git status --short --branch 2>&1 | head -3 || echo "git status rc=$?"
          if [[ -z "$IMAGE" && "$where" != host ]]; then echo "::error::empty image but running in a container"; exit 1; fi
          if [[ -n "$IMAGE" && "$where" != container ]]; then echo "::error::image set but running on the host"; exit 1; fi
          echo "OK: [$IMAGE] -> $where"
      - uses: ./.github/actions/facts
      # The currently released payload, unmodified, to see where it breaks.
      - name: Released layer2 as-is
        continue-on-error: true
        uses: maximalcode/maxi-quality/actions/layer2@613a26c952d3a5b224b15e7268b182826c1e53b2
