# maxi-quality — the coverage ratchet.
#
# WHY THIS IS AN ACTION AND NOT A JOB IN quality.yml
#
# quality.yml runs TOOLS over a checkout. Coverage needs the consumer's TESTS
# to run first, and a test suite is not something this baseline can drive: it
# needs services, fixtures, env, a database, a build. Every attempt to guess a
# "standard" test command ends with a gate that is either skipped or wrong.
#
# So the split is: the consumer runs its own tests and produces an lcov or
# Cobertura report — which every mainstream runner already does with one flag —
# and this action does the part that is genuinely shared, which is remembering
# the number and refusing to let it fall.
#
#   - vitest    : --coverage.reporter=lcov          -> coverage/lcov.info
#   - jest / c8 : --coverage --coverageReporters=lcov
#   - coverlet  : dotnet test --collect:"XPlat Code Coverage"
#                                                   -> **/coverage.cobertura.xml
#   - pytest    : --cov --cov-report=xml            -> coverage.xml
#
# THE FLOOR IS COMMITTED, AND RAISING IT IS THE CONSUMER'S COMMIT
#
# `raise: true` rewrites the floor file, it does NOT commit it. Committing from
# CI is a write to the consumer's default branch, and this baseline does not
# take that permission on a consumer's behalf — see README for the six-line
# commit-back step if you want it.
#
# ONE-TIME SETUP: run this action once with `raise: true` and commit the file it
# writes. Until a floor exists the step FAILS rather than passing, because a
# ratchet with nothing to compare against reports ok at any coverage — which is
# what the default configuration silently did.

name: 'maxi-quality coverage ratchet'
description: >-
  Compare measured line coverage against a committed floor. Fails when it
  drops; never demands a number the repo has not already reached.

inputs:
  report:
    description: >-
      Coverage report path or glob. Repeatable: one per line. lcov and
      Cobertura are both accepted and detected by content, not by filename.
    required: true
  floor-file:
    description: 'Committed floor. Lives in the CONSUMER repo.'
    default: '.maxi-quality/coverage.json'
  tolerance:
    description: >-
      Percentage points of slack below the floor. A ratchet that fires on
      rounding noise gets switched off within a week.
    default: '0.1'
  raise:
    description: >-
      'true' rewrites the floor file when coverage improved. It does NOT
      commit — that is the consumer's decision, not this action's.
    default: 'false'
  patch-threshold:
    description: >-
      Minimum coverage, in percent, of the lines this change ADDS. The
      aggregate ratchet cannot see a new untested function inside a large
      well-covered repo; this is the number that can. '0' switches the gate off
      and keeps the measurement. Requires the base ref to be fetchable — see
      base-ref.
    default: '50'
  base-ref:
    description: >-
      Branch or commit the changed lines are measured against. Empty means
      "the pull request's base", which is what the patch gate is for. On an
      event with no base (a push) the patch gate reports that it did not run
      rather than passing quietly. A base that is NAMED but cannot be resolved
      is an error, never an empty diff.
    default: ''

outputs:
  coverage:
    description: 'Measured line coverage, percent to 2dp.'
    value: ${{ steps.ratchet.outputs.coverage }}
  floor:
    description: >-
      The floor the file holds once this run is over, or 'none' if it still
      holds nothing. Pair it with `raised` to tell a run that moved the floor
      from one that met it.
    value: ${{ steps.ratchet.outputs.floor }}
  raised:
    description: "'true' when the floor file was rewritten."
    value: ${{ steps.ratchet.outputs.raised }}
  patch-coverage:
    description: >-
      Coverage of the added lines, percent to 2dp, or 'n/a' when the change
      added no measurable lines. Never 0 or 100 for the n/a case.
    value: ${{ steps.ratchet.outputs.patch_coverage }}
  patch-status:
    description: >-
      'ok' | 'below' | 'off' | 'n/a' | 'no-base'. Pair it with patch-coverage
      to tell a gate that passed from one that never ran.
    value: ${{ steps.ratchet.outputs.patch_status }}

runs:
  using: composite
  steps:
    - name: Coverage ratchet
      id: ratchet
      shell: bash
      env:
        REPORTS: ${{ inputs.report }}
        FLOOR_FILE: ${{ inputs.floor-file }}
        TOLERANCE: ${{ inputs.tolerance }}
        RAISE: ${{ inputs.raise }}
        PATCH_THRESHOLD: ${{ inputs.patch-threshold }}
        BASE_REF: ${{ inputs.base-ref }}
        GH_BASE_REF: ${{ github.base_ref }}
      run: |
        set -Eeuo pipefail

        # globstar, or `**` is just `*`.
        #
        # Without it the documented pattern — `**/coverage.cobertura.xml`, which
        # this action's own input description and the README both show — matched
        # exactly one directory level and therefore could not match coverlet's
        # real output, which lands in TestResults/[guid]/. The pattern was in the
        # docs from the start and nothing ever ran it.
        #
        # bash 3.2 (macOS system bash) has no globstar at all, so this is a
        # question and not an assumption. A runner without it must not quietly
        # match one level less than the pattern says — see the check below.
        GLOBSTAR=1
        shopt -s globstar 2>/dev/null || GLOBSTAR=0

        # nullglob so an unmatched pattern expands to nothing rather than to
        # itself; the `matched` check below then reports it as the missing
        # report it is, instead of as a path that fails to open.
        shopt -s nullglob

        # Globs are expanded HERE, not by the script, so an unmatched pattern
        # is caught loudly instead of being passed through as a literal path
        # that then fails to open with a confusing message.
        ARGS=()
        while IFS= read -r pattern; do
          [[ -n "${pattern// }" ]] || continue
          if (( ! GLOBSTAR )) && [[ "$pattern" == *'**'* ]]; then
            echo "::error::'$pattern' uses ** but this runner's bash ($BASH_VERSION) has no globstar, so it would match a single directory level and silently miss anything deeper. Use a runner with bash 4+, or write the path out."
            exit 1
          fi
          matched=0
          # shellcheck disable=SC2086
          for f in $pattern; do
            [[ -f "$f" ]] || continue
            ARGS+=(--report "$f")
            matched=1
          done
          if (( ! matched )); then
            echo "::error::no coverage report matched '$pattern'. The test step did not produce one — a missing report must not read as a passing gate."
            exit 1
          fi
        done <<< "$REPORTS"

        # --require-floor is not optional and has no input to switch it off. A
        # consumer who has never recorded a floor has a step that cannot fail,
        # and an opt-out would just be the old behaviour with a name. Recording
        # one is a single run with `raise: true`.
        ARGS+=(--floor-file "$FLOOR_FILE" --tolerance "$TOLERANCE" --require-floor)
        # An `if`, not `[[ ... ]] && ARGS+=(--write)`. Under `set -e` a false
        # `[[ ]] && cmd` does NOT abort mid-script — it bites as the LAST
        # statement of a script (the script exits 1, failing the step) or of a
        # function (it returns 1). Written as an `if` so reordering can never
        # make it the last statement and turn `raise: false` into a red step.
        if [[ "$RAISE" == "true" ]]; then
          ARGS+=(--write)
        fi

        # ---- patch coverage: the lines this change ADDED -------------------
        #
        # THE RULE THIS BLOCK EXISTS FOR: a base that is NAMED but cannot be
        # resolved must be an ERROR. An unresolvable base yields an empty diff,
        # an empty diff has no measurable added lines, and "no measurable added
        # lines" reports not-applicable and exits 0 — so a broken checkout would
        # render as a passing patch gate, run after run. That is the exact shape
        # of failure this milestone exists to remove.
        #
        # Not having a base at all is a different thing and is NOT an error: on
        # a push there is no pull request to diff against. That case says so out
        # loud (patch_status=no-base) instead of passing quietly.
        PATCH_ARGS=()
        PATCH_STATUS_OVERRIDE=""

        if [[ "$PATCH_THRESHOLD" == "0" ]]; then
          echo "patch gate: off (patch-threshold: 0). The aggregate ratchet still runs."
          PATCH_STATUS_OVERRIDE="off"
        else
          REF="$BASE_REF"
          [[ -n "$REF" ]] || REF="$GH_BASE_REF"

          if [[ -z "$REF" ]]; then
            echo "::notice::patch coverage did not run: this event has no base ref to diff against, so there are no 'changed lines'. The aggregate ratchet still gated this run."
            PATCH_STATUS_OVERRIDE="no-base"
          else
            # One fetch attempt, then assert. A shallow checkout (the default
            # fetch-depth: 1) does not contain the base, and the fix is either
            # fetch-depth: 0 on the consumer's checkout or this fetch working.
            if ! git rev-parse --verify --quiet "${REF}^{commit}" >/dev/null; then
              git fetch --no-tags --quiet origin "+${REF}:${REF}" 2>/dev/null || true
            fi

            BASE_COMMIT="$(git rev-parse --verify --quiet "${REF}^{commit}" || true)"
            [[ -n "$BASE_COMMIT" ]] || BASE_COMMIT="$(git rev-parse --verify --quiet "origin/${REF}^{commit}" || true)"

            if [[ -z "$BASE_COMMIT" ]]; then
              echo "::error::patch coverage: base ref '${REF}' cannot be resolved in this checkout, so the changed lines cannot be determined. This is an error and not an empty diff, because an empty diff would report not-applicable and pass. Fix the checkout: actions/checkout with fetch-depth: 0, or fetch the base branch before this step."
              exit 1
            fi

            MERGE_BASE="$(git merge-base HEAD "$BASE_COMMIT" 2>/dev/null || true)"
            if [[ -z "$MERGE_BASE" ]]; then
              echo "::error::patch coverage: '${REF}' resolved to ${BASE_COMMIT} but shares no history with HEAD, so there is no merge base to diff from. A shallow checkout is the usual cause; use fetch-depth: 0."
              exit 1
            fi

            git diff "$MERGE_BASE" HEAD > "$RUNNER_TEMP/patch.diff"
            PATCH_ARGS+=(--diff-file "$RUNNER_TEMP/patch.diff" --patch-threshold "$PATCH_THRESHOLD")
            echo "patch gate: changed lines vs ${REF} (merge base ${MERGE_BASE:0:12}), bar ${PATCH_THRESHOLD}%"
          fi
        fi

        ARGS+=("${PATCH_ARGS[@]+"${PATCH_ARGS[@]}"}")

        rc=0
        python3 "${GITHUB_ACTION_PATH}/../../scripts/coverage.py" "${ARGS[@]}" \
          > "$RUNNER_TEMP/coverage.out" 2> "$RUNNER_TEMP/coverage.msg" || rc=$?

        # The script prints key=value on stdout precisely so this is a copy,
        # not a parse.
        cat "$RUNNER_TEMP/coverage.out" >> "$GITHUB_OUTPUT"
        # The script only emits patch_* when it was given a diff. When it was
        # not, the outputs still have to exist and still have to say WHY, or a
        # caller cannot tell a patch gate that passed from one that never ran.
        if [[ -n "$PATCH_STATUS_OVERRIDE" ]]; then
          {
            echo "patch_coverage=n/a"
            echo "patch_status=$PATCH_STATUS_OVERRIDE"
          } >> "$GITHUB_OUTPUT"
        fi
        cat "$RUNNER_TEMP/coverage.msg"

        {
          echo "### Coverage ratchet"
          echo
          echo '```'
          cat "$RUNNER_TEMP/coverage.msg"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        exit "$rc"
