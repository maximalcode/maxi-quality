name: 'maxi-quality workflow scope'
description: >-
  Collect non-gating language, job and matrix scope for the reusable quality
  workflow. Each runner uploads one identity-bearing fragment; the collector
  joins only the current invocation and attempt.

inputs:
  mode:
    description: 'init, fragment, or collect.'
    default: fragment
  root:
    description: 'Checkout root used for independent presence observation.'
    default: ${{ github.workspace }}
  producer:
    description: 'Scope producer identity.'
    default: gate
  languages:
    description: 'Language selection input from the reusable workflow.'
    default: auto
  workflow:
    description: 'Workflow identity.'
    default: ${{ github.workflow }}
  invocation-id:
    description: 'Reusable-workflow invocation identity.'
    default: ${{ github.run_id }}
  run-id:
    description: 'GitHub run identity.'
    default: ${{ github.run_id }}
  run-attempt:
    description: 'Current GitHub run attempt.'
    default: ${{ github.run_attempt }}
  commit:
    description: 'Analyzed commit.'
    default: unknown
  ref:
    description: 'Analyzed ref.'
    default: unknown
  mode-name:
    description: 'Full or changed-only analysis mode.'
    default: full
  baseline-ref:
    description: 'Changed-only baseline, when present.'
    default: ''
  expected-jobs:
    description: 'JSON list or logical_job|language|leg lines.'
    default: '[]'
  job-outcomes:
    description: 'JSON needs results for direct producer jobs.'
    default: '{}'
  coverage-state:
    description: 'Coverage workflow state.'
    default: unknown
  logical-job:
    description: 'Logical job key for a fragment.'
    default: unknown
  language:
    description: 'Language associated with a fragment.'
    default: ''
  leg:
    description: 'Stable matrix leg key.'
    default: ''
  state:
    description: 'run, skipped, not_applicable, or unknown.'
    default: unknown
  outcome:
    description: 'success, failure, cancelled, or unknown.'
    default: unknown
  reason:
    description: 'Human-readable execution boundary reason.'
    default: ''
  reason-code:
    description: 'Stable reason code.'
    default: ''
  diagnostic:
    description: 'Optional diagnostic text.'
    default: ''
  diagnostic-file:
    description: 'Optional file containing complete boundary diagnostics.'
    default: ''
  cancellation:
    description: 'Cancellation metadata when finalization observes it.'
    default: ''
  layer2-invocation-id:
    description: 'Layer 2 invocation identity to reconcile.'
    default: ''
  artifact-prefix:
    description: 'Unique artifact prefix for this invocation.'
    default: maxi-quality-workflow-scope

runs:
  using: composite
  steps:
    - name: Initialize workflow scope
      id: initialize
      if: always() && inputs.mode == 'init'
      continue-on-error: true
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        OUT: ${{ runner.temp }}/maxi-quality-workflow-scope-manifest.json
        PRODUCER: ${{ inputs.producer }}
        WORKFLOW: ${{ inputs.workflow }}
        INVOCATION: ${{ inputs.invocation-id }}
        RUN_ID: ${{ inputs.run-id }}
        RUN_ATTEMPT: ${{ inputs.run-attempt }}
        COMMIT: ${{ inputs.commit }}
        REF: ${{ inputs.ref }}
        LANGUAGES: ${{ inputs.languages }}
        MODE_NAME: ${{ inputs.mode-name }}
        BASELINE: ${{ inputs.baseline-ref }}
        EXPECTED: ${{ inputs.expected-jobs }}
        JOB_OUTCOMES: ${{ inputs.job-outcomes }}
        COVERAGE: ${{ inputs.coverage-state }}
        ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
      run: |
        set -u
        script="$GITHUB_ACTION_PATH/../../scripts/workflow_scope.py"
        args=(init --out "$OUT" --root "$ROOT" --producer "$PRODUCER" --workflow "$WORKFLOW"
          --invocation-id "$INVOCATION" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
          --commit "$COMMIT" --ref "$REF" --languages "$LANGUAGES" --mode "$MODE_NAME"
          --expected-jobs-json "$EXPECTED" --coverage-state "$COVERAGE")
        [[ -n "$BASELINE" ]] && args+=(--baseline-ref "$BASELINE")
        python3 "$script" "${args[@]}"
        transport=$(python3 -c 'import hashlib, os; print(hashlib.sha256(os.environ["ARTIFACT_PREFIX"].encode()).hexdigest()[:16])')
        echo "artifact_name=${ARTIFACT_PREFIX}-${transport}-manifest" >> "$GITHUB_OUTPUT"

    - name: Upload workflow scope manifest
      if: always() && inputs.mode == 'init'
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
      with:
        name: ${{ steps.initialize.outputs.artifact_name }}
        path: ${{ runner.temp }}/maxi-quality-workflow-scope-manifest.json
        if-no-files-found: warn

    - name: Write workflow scope fragment
      id: fragment
      if: always() && inputs.mode == 'fragment'
      continue-on-error: true
      shell: bash
      env:
        OUT: ${{ runner.temp }}/maxi-quality-workflow-scope-fragment.json
        PRODUCER: ${{ inputs.producer }}
        WORKFLOW: ${{ inputs.workflow }}
        INVOCATION: ${{ inputs.invocation-id }}
        RUN_ID: ${{ inputs.run-id }}
        RUN_ATTEMPT: ${{ inputs.run-attempt }}
        LOGICAL_JOB: ${{ inputs.logical-job }}
        LANGUAGE: ${{ inputs.language }}
        LEG: ${{ inputs.leg }}
        STATE: ${{ inputs.state }}
        OUTCOME: ${{ inputs.outcome }}
        REASON: ${{ inputs.reason }}
        REASON_CODE: ${{ inputs.reason-code }}
        DIAGNOSTIC: ${{ inputs.diagnostic }}
        DIAGNOSTIC_FILE: ${{ inputs.diagnostic-file }}
        ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
      run: |
        set -u
        script="$GITHUB_ACTION_PATH/../../scripts/workflow_scope.py"
        args=(fragment --out "$OUT" --producer "$PRODUCER" --workflow "$WORKFLOW"
          --invocation-id "$INVOCATION" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
          --logical-job "$LOGICAL_JOB" --language "$LANGUAGE" --leg "$LEG" --state "$STATE" --outcome "$OUTCOME"
          --reason "$REASON" --reason-code "$REASON_CODE")
        [[ -n "$DIAGNOSTIC" ]] && args+=(--diagnostic "$DIAGNOSTIC")
        if [[ -n "$DIAGNOSTIC_FILE" && -f "$DIAGNOSTIC_FILE" ]]; then
          args+=(--diagnostic "$(cat "$DIAGNOSTIC_FILE")")
        fi
        python3 "$script" "${args[@]}"
        transport=$(python3 -c 'import hashlib, os; print(hashlib.sha256((os.environ["ARTIFACT_PREFIX"] + "\0" + os.environ["LOGICAL_JOB"] + "\0" + os.environ["LEG"]).encode()).hexdigest()[:16])')
        echo "artifact_name=${ARTIFACT_PREFIX}-${transport}-fragment" >> "$GITHUB_OUTPUT"

    - name: Upload workflow scope fragment
      if: always() && inputs.mode == 'fragment'
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
      with:
        name: ${{ steps.fragment.outputs.artifact_name }}
        path: ${{ runner.temp }}/maxi-quality-workflow-scope-fragment.json
        if-no-files-found: warn

    - name: Download workflow scope fragments
      if: always() && inputs.mode == 'collect'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ inputs.artifact-prefix }}-*
        path: ${{ runner.temp }}/maxi-quality-workflow-scope-input
        merge-multiple: false

    - name: Download Layer 2 scope fragments
      if: always() && inputs.mode == 'collect' && inputs.layer2-invocation-id != ''
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: maxi-quality-layer2-${{ inputs.producer }}-${{ inputs.run-id }}-${{ inputs.run-attempt }}-*
        path: ${{ runner.temp }}/maxi-quality-layer2-scope-input
        merge-multiple: false

    - name: Collect and publish workflow scope
      if: always() && inputs.mode == 'collect'
      continue-on-error: true
      shell: bash
      env:
        INPUT_ROOT: ${{ runner.temp }}/maxi-quality-workflow-scope-input
        LAYER2_INPUT_ROOT: ${{ runner.temp }}/maxi-quality-layer2-scope-input
        OUT: ${{ runner.temp }}/maxi-quality-workflow-scope.json
        ROOT: ${{ inputs.root }}
        PRODUCER: ${{ inputs.producer }}
        WORKFLOW: ${{ inputs.workflow }}
        INVOCATION: ${{ inputs.invocation-id }}
        RUN_ID: ${{ inputs.run-id }}
        RUN_ATTEMPT: ${{ inputs.run-attempt }}
        COMMIT: ${{ inputs.commit }}
        REF: ${{ inputs.ref }}
        LANGUAGES: ${{ inputs.languages }}
        MODE_NAME: ${{ inputs.mode-name }}
        BASELINE: ${{ inputs.baseline-ref }}
        EXPECTED: ${{ inputs.expected-jobs }}
        JOB_OUTCOMES: ${{ inputs.job-outcomes }}
        COVERAGE: ${{ inputs.coverage-state }}
        LAYER2_INVOCATION: ${{ inputs.layer2-invocation-id }}
        CANCELLATION: ${{ inputs.cancellation }}
      run: |
        set -u
        script="$GITHUB_ACTION_PATH/../../scripts/workflow_scope.py"
        manifest=$(find "$INPUT_ROOT" -type f -name '*manifest.json' -print -quit 2>/dev/null || true)
        fragments="$RUNNER_TEMP/maxi-quality-workflow-scope-fragments"
        mkdir -p "$fragments"
        find "$INPUT_ROOT" -type f -name '*fragment.json' -print0 2>/dev/null | while IFS= read -r -d '' path; do
          key=$(printf '%s' "$path" | sha256sum | cut -c1-16)
          cp "$path" "$fragments/$key.json"
        done
        if [[ -z "$manifest" ]]; then
          manifest="$INPUT_ROOT/missing-manifest.json"
        fi
        args=(collect --manifest "$manifest" --fragments-dir "$fragments" --out "$OUT"
          --root "$ROOT" --producer "$PRODUCER" --workflow "$WORKFLOW" --invocation-id "$INVOCATION"
          --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --commit "$COMMIT" --ref "$REF"
          --languages "$LANGUAGES" --mode "$MODE_NAME" --expected-jobs-json "$EXPECTED"
          --coverage-state "$COVERAGE" --layer2-dir "$LAYER2_INPUT_ROOT" --job-outcomes "$JOB_OUTCOMES"
          --layer2-invocation-id "$LAYER2_INVOCATION")
        [[ -n "$BASELINE" ]] && args+=(--baseline-ref "$BASELINE")
        [[ -n "$CANCELLATION" ]] && args+=(--cancellation "$CANCELLATION")
        if [[ "$manifest" == "$INPUT_ROOT/missing-manifest.json" ]]; then
          args+=(--expected-job 'detect||' --expected-job 'layer2||')
        fi
        python3 "$script" "${args[@]}"
        python3 "$script" summary --out "$OUT" --summary-file "$GITHUB_STEP_SUMMARY"

    - name: Upload whole workflow scope
      if: always() && inputs.mode == 'collect'
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
      with:
        name: ${{ inputs.artifact-prefix }}-final
        path: ${{ runner.temp }}/maxi-quality-workflow-scope.json
        if-no-files-found: warn
